<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>割不割 · Demo</title>
<!-- ⚠ 样式已按「每文件 ≤1000 行」拆到 game/style-*.css（顺序来源：game/style.bundle.js）。
     tools/build.mjs 会把下面三行 link 标签内联成一个 style 块（单文件交付的前提），
     所以不要把上面三行改成别的写法，也别改顺序。 -->
<link rel="stylesheet" href="style-1-base.css">
<link rel="stylesheet" href="style-2-v3.css">
<link rel="stylesheet" href="style-3-fixes.css">
</head>
<body>
<div id="app">
  <div id="top">
    <div class="row between" id="toprow1">
      <div id="clock">第 <b>1</b> 天 <b>00:00</b> · <span id="corp">种植公司</span></div>
      <div id="speedbar">
        <button class="sbtn" data-sp="0">❚❚</button>
        <button class="sbtn on" data-sp="1">1×</button>
        <button class="sbtn" data-sp="2">2×</button>
        <button class="sbtn" data-sp="4">4×</button>
      </div>
    </div>
    <div class="row between" id="toprow2">
      <div id="navwrap">
        <div id="navbig">10,000<small>G</small></div>
        <div id="navlab">净资产</div>
      </div>
      <div id="navmeta"></div>
    </div>
    <div id="daybar"><div id="dayfill"></div></div>
    <div id="phasetag"></div>
  </div>

  <div id="view"></div>
  <div id="feed"></div>
  <div id="tabs"></div>

  <div id="toasts"></div>
  <div class="overlay hide" id="ovStart"></div>
  <div class="overlay hide" id="ovTalent"></div>
  <div class="overlay hide" id="ovEnd"></div>
</div>
<script>/* 出错时把异常写到标题与阶段条上，方便无头排查（浏览器里肉眼也看得到） */
window.addEventListener('load', function () {
  var de = document.documentElement, ap = document.getElementById('app');
  document.title = 'W' + window.innerWidth + ' H' + window.innerHeight +
    ' scrollW' + de.scrollWidth + ' bodyW' + document.body.scrollWidth +
    ' appW' + (ap ? ap.getBoundingClientRect().width : -1) +
    ' dpr' + (window.devicePixelRatio || 1);
});
window.addEventListener('error', function (e) {
  document.title = 'ERR: ' + e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno;
  var d = document.getElementById('phasetag'); if (d) d.textContent = '脚本出错：' + e.message;
});</script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
