      '</div><div class="fact">' +
        (mine ? '' :
          '<button class="btn p" data-act="votefor" data-id="' + dec.id + '">同意</button>' +
          '<button class="btn" data-act="voteagainst" data-id="' + dec.id + '">不同意</button>') +
      '</div></div>';
    }).join('');
}

/* Z3b 名录与名次（docs/19 §4.6）+ 找人谈事（docs/19 §4.9）。
   ⚠ 榜单读引擎的 G.standings()，UI **不自己排序、不自己算身价** ——
     两处各算一遍必然对不上（本项目踩过“面板价 vs 成交价”）。
   ⚠ 三颗按钮一律 data-act + data-*：wiring-check 会替我验证它们真的接到了分派表。 */
function boardSection() {
  const rows = (G && G.standings) ? G.standings() : [];
  if (!rows.length) return '';
  const list = rows.map(r => {
    const me = r.pid === G.s.humanId;
    const talk = me ? '' :
      '<span class="chips">' +
        '<button class="btn" data-act="contact" data-kind="borrow" data-to="' + r.pid + '">借钱</button>' +
        '<button class="btn" data-act="contact" data-kind="jv" data-to="' + r.pid + '">买他股份</button>' +
        '<button class="btn" data-act="contact" data-kind="invite" data-to="' + r.pid + '">请他议事</button>' +
      '</span>';
    /* 你已经占了人家多少、离下一道门槛还差多远（docs/19 §4.11 B 要求“每个节点都要有说明文本”）。
       门槛表读引擎的 G.rights()，UI 不自己写一份 —— 两处各写一遍必然会对不上。 */
    let mine = '';
    if (!me && G.rights) {
      const rr = G.rights(HUMAN, r.pid);
      if (rr.stake > 0) {
        mine = ' · 你占 ' + Math.round(rr.stake * 100) + '%' +
          (rr.next ? '（再过 ' + ((rr.next.at - rr.stake) * 100).toFixed(1) + '% 可' + esc(rr.next.label) + '）' : '');
      }
    }
    return '<div class="firm">' +
      '<div class="fmain">' +
        '<div class="ft">' + r.rank + '. ' + esc(r.name) +
          (me ? '<span class="tag">你</span>' : '') + '</div>' +
        '<div class="fl">' + esc(r.corpName) + ' · 身价 ' + fmt(r.nav) + ' G' +
          (r.debt > 0 ? ' · 欠着 ' + fmt(r.debt) + ' G' : '') + mine + '</div>' +
      '</div>' +
      (talk ? '<div class="fact">' + talk + '</div>' : '') +
    '</div>';
  }).join('');
  return '<div class="ct"><h3>公司名录 · 名次</h3><span class="sub">共 ' + rows.length +
    ' 家 · 实时</span></div><div class="firms">' + list + '</div>';
}

function viewLedger() {
  const book = ledgerBook();
  const belt = ledgerBelt();
  const held = book.filter(r => !r.mine).length;

  return '<div class="ledger">' +
    /* Z0 身价**不在这里画**：docs/20 §2.1 的 Z0 就是「顶栏」本身
       （身价印章超大字 · 现金 · 授信 · 日子），不是正文里的一张卡。
       我第一版把它当正文卡片画，结果同一个数在一屏里挂了三个标签
       （顶栏大字 / 身价卡 / 公司卡家底）—— 正是 §0「三个钱数永不同屏并列」要防的事。
       现在顶栏那个大字已经改成身价（08-chrome），本屏从 Z1 告急带开始。 */

    /* Z1 告急带：有内容才显（空数组 = 整条不占屏）。已是一段现成 HTML，直出。 */
    (belt.length ? '<div class="belt">' + belt.join('') + '</div>' : '') +

    /* Z2 控股地图 */
    '<div class="ct"><h3>手里的公司</h3><span class="sub">共 ' + book.length + ' 家' +
      (held ? '（参股 ' + held + ' 家）' : '') + '</span></div>' +
    '<div class="firms">' + book.map(r =>
      /* 卡内布局：左边文字（公司名 + 状态章 + 持股/家底），右边动作按钮。
         ⚠ 原来是「文字两行 + 按钮独占第三行」，卡片被撑成三行、按钮吊在左下角；
           2026-10-08 玩家要求改用左右分布 —— 卡片矮一截，也不用再往下扫一眼找按钮。
         ⚠ 两层包装（.fmain / .fact）是必需的：只给按钮 float/absolute 的话，
           公司名一长就会压到按钮底下（.fmain 的 min-width:0 才是那个“允许被挤”的开关）。 */
      '<div class="firm">' +
        '<div class="fmain">' +
          '<div class="ft">' + esc(r.name) + '<span class="tag">' +
            (r.control >= 0.5 ? '控股' : '参股') + '</span></div>' +
          '<div class="fl"><span class="lamp ' + r.lamp + '"></span>持股 ' +
            Math.round(r.stake * 100) + '% · 家底 ' + fmt(r.nav) + ' G' +
            /* 估值与家底**并列但分清**（§4.6）：家底是你按股比拿到的那部分，
               估值是“整家公司要卖，市场肯出多少”。两个数不一样，是故意的。 */
            (r.mine ? ' · 估值 ' + fmt(G.valuation(HUMAN)) + ' G' : '') + '</div>' +
        '</div>' +
        '<div class="fact">' +
          (r.control >= 0.5
            ? '<button class="btn p" data-enter="' + r.id + '">进入经营</button>' +
              /* §4.12：只在**自己主控**的那家公司上出现 —— “从公司拿钱”是股东与公司之间的事，
                 参股的公司轮不到你插手。拿的是借款、要还，所以身价不变。
                 ⚠ 用 data-act（不用自定义 data-*）：这样 wiring-check 会**自动验证**这颗按钮
                   真的接到了分派表上 —— 当年“工坊修不了”就是一颗没人接的死按钮。 */
              (r.mine ? '<button class="btn" data-act="take">从公司拿钱</button>' : '')
            /* §4.10 上市：发股份换现金。⚠ 只在**自己主控**的公司上出现。 */
            + (r.mine ? '<button class="btn" data-act="ipo">发股份募资</button>' : '')
            : '<button class="btn" disabled>只参股，不下手</button>') +
        '</div>' +
      '</div>').join('') + '</div>' +

    decisionBlock() +

    boardSection() +

    /* Z4 进店行（docs/20 §2.1）：低频重功能收口成一行，把屏幕让给 Z2。
       ⚠ 2026-10-08 玩家要求把 市场/情报/钱庄/拍卖/图鉴 从底栏**搬到总账** ——
         它们本来就是全局动作（行情 / 情报行 / 钱庄 / 拍卖会 / 图鉴），不是“这家公司的活”；
         挂在底栏会两头打架：底栏说“这家公司”，而那几屏与哪家公司无关。
       ⚠ 一律走 data-root：用 data-view 会把 ui.root 复位成二级，画面不变（R1 那个 bug 的成因），
         而且底栏会冒出农田/制造页签。
       ⚠ 拍卖那个红点原本在底栏页签上，跟着搬过来 —— 信号不因为搬家就丢掉。 */
    '<div class="shop">' +
      shopBtn('market', '市场') + shopBtn('intel', '情报') +
      shopBtn('bank', '钱庄') + shopBtn('auction', '拍卖', !!(G.s.auction && G.s.auction.phase !== 'done')) +
      shopBtn('codex', '图鉴') +
    '</div>' +

  '</div>';
  /* Z3「组合摘要」本批**故意不画**（code-reviewer 子代理扫出的 R4）：
     它当时只能写「名下合计 = 身价」，同一组数字在屏幕上挂了四个标签
     （顶栏大数字 / 身价 / 自公司卡家底 / 名下合计），正是 docs/20 §0
     “三个钱数不得同屏并列”要防的事。
     docs/20 §2.1 对 Z3 的定义是「组合总浮盈 + 今日/本季派红」——
     这两项都要等派红与行情落地才有数据，届时再画才是真信息。 */
}
/* 一级 · 信匣｜邮箱（docs/20 §2.1「信匣｜邮箱·会话列表」/ §7 第一批第 2 项）。
 *
 * 屏幕形态：会话式列表（发件人 · 摘要 · 时间 · 未读点 · [倒计时角标]）。
 * docs/20 §4 明说它「约 10 行、会话式列表天生适合窄屏，无需分页」——
 * 所以这里**不做分页**、不做搜索（430px 上都是浪费）。
 *
 * ⚠ 与告急带的分工（docs/20 §2.1）：
 *   告急带 = 「现在就必须看一眼」的 1~3 条，钉在总账顶部；
 *   信匣   = 全部来信（含不急的风声）。
 *   告急带的「还有 N 条」必须把人送到这里，否则那条路是断的 —— 见 ledgerBelt 的收尾。
 *
 * ⚠ 已读状态存在**引擎的 s.inbox**（m.read）上，不存在 ui 里：
 *   存 ui 的话一刷新就全变回未读，角标永远清不掉。
 *   反之，「正在看哪一封」是纯界面态，不该进存档 —— 所以它留在本文件作用域。
 *
 * ⚠ 导航一律 data-root（一级屏切换）。**不能用 data-view**：
 *   那条分支表示"二级公司层页签"，会把 ui.root 复位成二级（自己把自己踢出信匣）。
 */

/* 当前打开的信的 id；null = 看列表。 */
let mailOpenId = null;

/* 我的信：只取收件人是我的，新的在前（会话行按时间倒序，docs/20 §2.1）。 */
function mailBox() {
  const all = (G && G.s && Array.isArray(G.s.inbox)) ? G.s.inbox : [];
  return all.filter(m => m && m.to === G.s.humanId).slice().reverse();
}
function mailUnread() {
  return mailBox().filter(m => !m.read).length;
}
/* 未读里最快到期的那件（docs/20 §2.1「信匣角标含最近倒计时」）。
   角标如果不带"最急的那件还剩多久"，它就只是个装饰。 */
function mailUrgentT() {
  let best = null;
  for (const m of mailBox()) {
    if (m.read || m.deadlineT == null) continue;
    if (best == null || m.deadlineT < best) best = m.deadlineT;
  }
  return best;
}

/* 顶栏常驻印章（docs/20 §2.1：顶栏右侧常驻，带未读角标）。 */
function mailSeal() {
  const n = mailUnread();
  const left = mailUrgentT();
  /* 有未读且带时限时，角标旁边再跟一个秒数 —— 这是"必须回来处理"的钩子 */
  const soon = (n && left != null) ? '<span class="ssoon">' + secLeftTxt(left - G.s.t) + '</span>' : '';
  return '<button class="seal' + (n ? ' has' : '') + '" data-root="mail">✉' +
    (n ? '<span class="sbadge">' + (n > 99 ? '99+' : n) + '</span>' : '') +
    '</button>' + soon;
}

function mailGlyph(kind) {
  if (kind === 'deal') return '⚖';
  if (kind === 'rumor') return '〰';
  if (kind === 'vote') return '⚑';
  return '✉';
}
/* 会话行的时间：3 天局里只写 hh:mm 会分不清是哪天，所以带天号，但压到最短。 */
function mailTime(t) { return dayOf(t) + '·' + hhmm(t); }

function mailRow(m) {
  const dl = m.deadlineT != null
    ? '<span class="mdl' + (m.deadlineT - G.s.t <= 0 ? ' over' : '') + '">' + secLeftTxt(m.deadlineT - G.s.t) + '</span>'
    : '';
  return '<button class="mrow' + (m.read ? '' : ' unread') + '" data-mail="' + m.i + '">' +
    '<span class="mava ' + esc(m.kind || 'system') + '">' + mailGlyph(m.kind) + '</span>' +
    '<span class="mtxt">' +
      '<span class="mfrom">' + esc(m.from) + (m.read ? '' : '<span class="mdot"></span>') + dl + '</span>' +
      '<span class="msub">' + esc(m.subject) + '</span>' +
    '</span>' +
    '<span class="mtime">' + mailTime(m.t) + '</span>' +
  '</button>';
}

function viewMailDetail(m) {
  const dl = m.deadlineT != null
    ? '<div class="mdlg">剩 ' + secLeftTxt(m.deadlineT - G.s.t) + '</div>' : '';
  /* 信件里的可执行动作（docs/19 §4.9：答复 / 投票的入口就放在邮箱里）。
     目前只有 NPC 提案（合作请求 / 收购通知）走这条；票决的三按钮
     （赞成 / 反对 / 弃权）要等股东结构（持股% + 门槛 50%/66.7%）落地再接 ——
     但那时同样只需往 m.actions 里加值，这里不用改（所以按“动作表”渲染，不写死按钮）。 */
  return '<div class="ledger mail">' +
    '<button class="back" data-mailback="1">← 信匣</button>' +
    '<div class="md">' +
      '<div class="mdfrom">' + esc(m.from) + '<span class="mdtime">' + mailTime(m.t) + '</span></div>' +
      '<div class="mdsub">' + esc(m.subject) + '</div>' +
      dl +
      '<div class="mdbody">' + esc(m.body) + '</div>' +
      mailOffer(m) +
    '</div>' +
  '</div>';
}

/* 提案的答复区。
   ⚠ 能不能点、点了会怎样，全部由**引擎的 offer.status** 决定，UI 不自己猜 ——
     否则会出现“信上还说能答应、其实早过期了”的假按钮（本项目的死按钮坑）。 */
function mailOffer(m) {
  const s = G.s;
  const o = (Array.isArray(s.offers) ? s.offers : []).find(x => x.mailId === m.i);
  if (!o) return '';
  if (o.status !== 'open') {
    const done = { accepted: '你答应了，这件事已经办完。', declined: '你回绝了。',
                   lapsed: '过期了，对方把条件收了回去。' };
    return '<div class="mdec done">' + (done[o.status] || '这件事已经结束。') + '</div>';
  }
  if (s.t > o.deadlineT) return '<div class="mdec done">过期了，对方把条件收了回去。</div>';
  /* ⚠ 按钮文字必须跟着 **kind** 走，不能写死“借给他 / 卖给他” ——
     新增了 borrow / jv / invite 三类之后，写死会出现
     “明明是邀你入股，按钮却写着买货”（本项目的死按钮 / 错按钮坑）。 */
  const LABEL = {
    loan: ['借给他', '不借'],
    buy: ['卖给他', '不卖'],
    borrow: ['借给他', '不借'],
    jv: ['答应入股', '不入股'],
    invite: ['表个态', '不管'],
  };
  const lab = LABEL[o.kind] || ['答应', '不答应'];
  const yes = lab[0], no = lab[1];
  return '<div class="mdec">' +
    '<button class="btn p" data-offer="accept:' + o.i + '">' + yes + '</button>' +
    '<button class="btn" data-offer="decline:' + o.i + '">' + no + '</button>' +
  '</div>';
}

function viewMail() {
  if (mailOpenId != null) {
    const m = mailBox().find(x => x.i === mailOpenId);
    /* 信不见了（读档换局 / 被 200 封上限挤掉）→ 回列表，不要白屏 */
    if (m) return viewMailDetail(m);
    mailOpenId = null;
  }
  const list = mailBox(), un = mailUnread();
  return '<div class="ledger mail">' +
    '<div class="ct"><h3>信匣</h3><span class="sub">' +
      (list.length ? '共 ' + list.length + ' 封' + (un ? '，未读 ' + un : '') : '空的') +
    '</span></div>' +
    (list.length
      ? '<div class="mrows">' + list.map(mailRow).join('') + '</div>'
      : '<div class="empty">还没有人来信。<br>有公司来找你谈事、或者市面上有风声，会送到这里。</div>') +
  '</div>';
}

/* 打开一封 = 立即已读（写在引擎状态上，刷新不回退）。 */
function mailOpenBy(i) {
  mailOpenId = i;
  const m = mailBox().find(x => x.i === i);
  if (m && !m.read) m.read = true;
  render(true);
}
function mailClose() { mailOpenId = null; render(true); }
function render(force) {
  if (!G) return;
  const ae = document.activeElement;
  const keepId = ae && ae.id ? ae.id : null;
  const selS = ae && ae.selectionStart != null ? ae.selectionStart : null;

  renderTop(); renderTabs();
  const map = { farm: viewFarm, make: viewMake, market: viewMarket, intel: viewIntel, bank: viewBank, auction: viewAuction, codex: viewCodex, end: viewEnd };
  /* 一级屏（集团层）模式表：与上面 7 个二级页签是**两套屏幕**（docs/20 §3）。
     2026-10-08:市场/情报/钱庄/拍卖/图鉴 这 5 个面板从二级页签**搬进集团层** ——
     它们本来就是全局动作（行情 · 情报行 · 钱庄 · 拍卖会 · 图鉴），不是“这家公司的活”。
     ⚠ 新增一级屏只需在这张表加一行 + 在 15-events 的白名单加一项，层次不用动。 */
  const first = { ledger: viewLedger, mail: viewMail, market: viewMarket,
                  intel: viewIntel, bank: viewBank, auction: viewAuction, codex: viewCodex };

  /* ⚠ 玩家 2026-10-08 实测：「输入框疯狂闪动，我填购买/卖出个数的时候一直往回跳」。
     根因：#view 每 120ms 整体重写 innerHTML，里面的 <input> 是**被销毁重建**的。
     修法两半，各管一类视图：
       ① 内容没变就不碰 DOM（与 renderTabs 同一套做法）——
          农场/制造/情报/钱庄这类静态视图从此根本不重写，闪动直接消失；
       ② 市场/拍卖这类**每帧价格都在变**的视图，①拦不住。所以只要玩家正在
          #view 里的输入框打字，就这一帧不重写 #view。
          抢用户正在编辑的 DOM 才是病根，把值再写回去治不了。
          （代价：打字时价格最多冻一秒。交易按引擎实时价成交，不影响正确性。）
     ③ 只有真的重写了 DOM，才需要恢复焦点 —— 否则 el.focus() 会把
        玩家刚放好的光标又挪走（number 输入框还恢复不了选区）。 */
  const vw = $('#view');
  /* 一级根屏（集团总账）与二级公司工作台是**两套屏幕**（docs/20 §3）。
     ⚠ 不要把总账塞进 map 当第 9 个 view：那会把它和 7 个页签**平级**，
       而它是页签的**上级**（把爸爸塞进儿子班）。 */
  /* 一级屏是**模式下的一屏**：ui.root 存的是去哪张一级屏
     （'' / false = 二级公司工作台 | 'ledger' 总账 | 'mail' 信匣；docs/20 §3）。
     以后加行市/黄历只在这里多一个分支，不用再动层次。 */
  const html = ui.root ? (first[ui.root] || viewLedger)() : (map[view] || viewFarm)();
  const typing = ae && ae.tagName === 'INPUT' && vw.contains && vw.contains(ae);
  const rewrote = !typing && vw.innerHTML !== html;
  if (rewrote) vw.innerHTML = html;
  drawSparklines();

  /* 流水条：默认只留最近一条，点一下展开 5 条。
     开关不能做成 #feed 里的按钮 —— #feed 每 120ms 被重写，会复现「点页签没反应」同源的丢点击；
     所以整条 #feed 本身就是开关（见 handleAction），展开状态存在 ui.feedOpen 而不是 DOM 上。 */
  const fe = $('#feed');
  const rows = G.s.feed.slice(-(ui.feedOpen ? 5 : 1));
  const tail = '<span class="fmore">' + (ui.feedOpen ? '收起 ▴' : '全部 ▾') + '</span>';
  fe.innerHTML = rows.map((f, i) =>
    `<div class="lg ${f.kind}"><span class="lgt">${esc(f.text)}</span>${i === rows.length - 1 ? tail : ''}</div>`
  ).join('');
  fe.classList.toggle('open', !!ui.feedOpen);

  if (rewrote && keepId) {
    const el = document.getElementById(keepId);
    if (el) { el.focus(); try { if (selS != null) el.setSelectionRange(selS, selS); } catch (e) { /* number input */ } }
  }
  if (HUMAN.talentOffers) talentModal();
  else if (!$('#ovTalent').classList.contains('hide')) $('#ovTalent').classList.add('hide');
  if (G.s.over && !ui.recorded) {
    recordRun(); sfx.award();
    HUMAN_LAST_TALENT = HUMAN.talents[HUMAN.talents.length - 1] || null;
    const me = (G.s.settlement.rows || []).find(r => r.id === G.s.humanId) || {};
    finishSave({ died: !me.alive, ratio: me.ratio || 0, talentId: HUMAN_LAST_TALENT });
  }
  if (G.s.over && $('#ovEnd').classList.contains('hide')) {
    /* ⚠ 结算必须回到二级：否则 view='end' 与 ui.root=true 会**自相矛盾** ——
       renderTabs() 在 root 下早退清空页签，'end' 高亮永不出现；
       而下一帧 render() 又用 viewLedger() 把 #view 盖回总账。
       弹层遮着看不出来，但状态已经互相矛盾（后续读数/扩展页签会踩）。
       （code-reviewer 子代理扫出的 R2。） */
    ui.root = false;
    view = 'end';
    renderTabs(); $('#view').innerHTML = viewEnd();
    /* 颁奖礼背景：用顶部横幅而不是背景图。
       原因：这张插画的"上三分之一"是刻意留黑的（给界面文字压白字用），
       当背景图铺满整个弹层时，露出来的恰好就是那片空黑 —— 看起来跟纯色卡片一模一样。
       做成横幅就一定能看见奖台和奖杯。 */
    $('#ovEnd').innerHTML = '<div class="modal" style="padding-top:0;overflow:hidden">' +
      '<img class="hero" src="assets/bg-awards.webp" alt="" style="height:150px" onerror="this.remove()">' +
      viewEnd() + '</div>';
    $('#ovEnd').classList.remove('hide');
    $('#ovEnd').querySelector('#again').onclick = () => location.reload();
  }
}

/* ---------- 事件委托 ----------
   ⚠ 同一根源的坑已犯三次：render() 每 120ms 重写一次 #view/#tabs 的 innerHTML，
   而人手一次按压（mousedown→mouseup）常在 80~150ms，必然跨过一次重建。
   mousedown 的目标被移出文档后，浏览器计算“两个目标的共同祖先”得到空，
   于是 `click` 事件根本不会产生 —— 表现就是：
     ① 点页签没反应（已修）
     ② 用户 2026-10-08 反馈「按钮不灵，需要点击好几下才能生效（播种）」
   注意：原先那个“坐标命中测试”兜底只能救「click 已派发但目标错了」，
   救不了「根本未派发」—— 所以播种依然丢点击。

   根治：把动作绑在 **pointerup** 上，而不是 click。
     · pointerup 的目标是按“指针抬起位置”重新命中测试的，与 mousedown 目标无关 →
       重建后按钮还在原地，拿到的就是活着的新按钮；
     · 拖动滚屏时浏览器发的是 pointercancel 而非 pointerup → 不会误触发；
     · 松开位置不在按钮上就等于取消，保留了标准点击手感；
     · 键盘（Enter/Space）没有 pointerup，仍走 click。
   同一次按压会先后产生 pointerup 和 click，用时间戳抑制后者，避免动作执行两遍。
   （lastPointerUpAt 初值取 -1e9 而非 0：否则页面刚加载的 700ms 内
     会把 ui-smoke 直接调用的 onClick 误判为“已处理过”。） */
let lastPointerUpAt = -1e9;
function onPointerUp(e) {
  if (e.button != null && e.button !== 0) return;   // 只认左键 / 触摸抬起
  lastPointerUpAt = performance.now();
  handleAction(e);
}
function onClick(e) {
  if (performance.now() - lastPointerUpAt < 700) return;   // 这次按压已由 pointerup 处理
  handleAction(e);
}
function handleAction(e) {
  /* 流水条整条就是展开/收起的开关。
     fl.id === 'feed' 这层判断是必需的：ui-smoke 的 DOM 替身里 closest() 一律返回一个
     真值对象，不加这层守卫，测试里每一次点击都会被当成"点了流水条"而提前 return。 */
  const fl = e.target && e.target.closest ? e.target.closest('#feed') : null;
  if (fl && fl.id === 'feed') { ui.feedOpen = !ui.feedOpen; render(true); return; }

  let t = e.target.closest('button, [data-view]');
  /* 兜底：mousedown/mouseup 之间容器被重渲染过时，click 会落在共同祖先上，
     closest() 就拿不到按钮。用坐标做一次命中测试，把指针底下真正的按钮找回来。
     这条同时保护 #tabs 和每帧重写的 #view。 */
  if (!t && e.clientX != null && document.elementsFromPoint) {
    /* 只认最顶层那一个命中结果。
       原先遍历整条栈，会把“被浮层（toast 等）盖住的按钮”也捞出来执行 ——
       即按在浮层上却触发了下面按钮的动作。取 stack[0] 既够用（按钮就在指针正下方），
       又不会点到被遮住的元素。 */
    const top = (document.elementsFromPoint(e.clientX, e.clientY) || [])[0];
    const b = top && top.closest ? top.closest('button, [data-view]') : null;
    if (b) t = b;
  }
  if (!t || !G) return;
  const d = t.dataset;

  /* ⚠ 总账（ui.root）下也必须能切屏：d.view 分支排在 d.root/d.enter **之前**，
     而它只改 view、不复位 ui.root —— 于是 ui.root===true 时点告急带的
     「钱庄随时上门 / 拍卖进行中」，14-render 仍走 viewLedger()，画面一字不变，
     玩家看到的是“点了没反应”；而且 view 被悄悄改掉，下次点「进入经营」会进错屏。
     这是 code-reviewer 子代理扫出来的：属性名正确、分支也存在，
     所以 wiring-check 静态抓不到，ui-smoke 也没点过告急带 —— 正是守卫的盲区。 */
  if (d.view) { if (ui.root) ui.root = false; view = d.view; render(true); return; }
  /* 一级 ↔ 二级导航（docs/20 §2.3）。
     ⚠ 必须排在下一条 `if (d.corp || d.pace) return;` **之前**：
       那句话会把 data-corp 吞掉（开局浮层在用那个键），
       所以总账进公司用 data-enter、回根用 data-root，且优先分派。 */
  /* 信匣：打开一封 / 返回列表。已读写进引擎状态，空态则回列表（见 18-mail.js）。 */
  if (d.mail) { mailOpenBy(+d.mail); return; }
  if (d.mailback) { mailClose(); return; }
  /* 答复信里的提案（合作请求 / 收购通知）。
     走引擎动作 _a_acceptOffer / _a_declineOffer —— 钱货结算、流水、存档全在引擎
     那一侧完成，UI 只管把“谁答复了哪一条、接不接受”送进去。 */
  if (d.offer) {
    const [k, oid] = d.offer.split(':');
    A(k === 'accept' ? 'acceptOffer' : 'declineOffer', { id: +oid });
    render(true); return;
  }
  /* data-root：一级屏切换（docs/20 §3）。值 = 去哪张一级屏：
       'ledger'（默认，合并老存档里的 "1"） / 'mail'（顶栏信匣章）。
     ⚠ ui.root 因此从布尔变成**模式串**：布尔存不下“我有两张一级屏”，
       以后加行市/黄历还得再改一次。falsy 一律表示二级公司工作台。 */
  /* ⚠ 一级屏模式**必须白名单放行**：原来写的是 `d.root === 'mail' ? 'mail' : 'ledger'` 的两档写法，
   一级屏一旦多起来（现在 7 张），进店行的 5 个键会**全部塌成总账**（点了没反应 = 死按钮）。
   这与面包屑那次（信匣死胡同）是同一个坑的两面：**旧的两档假设**。
   白名单与 14-render 里的 first 表同源，改一处要一起改。
   顺手清 mailOpenId：从任意一级屏回总账，下次进信匣不该直接弹在上次那封信上。 */
if (d.root) {
       const FIRST_MODES = ['ledger', 'mail', 'market', 'intel', 'bank', 'auction', 'codex'];
       ui.root = FIRST_MODES.indexOf(d.root) >= 0 ? d.root : 'ledger';
       mailOpenId = null;
       render(true); return;
     }
  /* 回公司层时顺手关掉信匣详情：否则下次进信匣会直接弹在上次那封信上。 */
  if (d.enter) { ui.root = false; mailOpenId = null; view = 'farm'; render(true); return; }
  if (d.corp || d.pace) return;
  if (d.sp != null) { setSpeed(+d.sp); renderTop(); return; }
  if (d.view === 'end') return;

  if (d.pick) { ui.pick = d.pick; render(true); return; }
  if (d.plant != null) { A('plant', { crop: ui.pick, index: +d.plant }); return; }
  if (d.harvest != null) { A('harvest', { index: +d.harvest }); return; }
  if (d.auto != null) { A('buyAuto', { index: +d.auto }); return; }
  /* 高产地升级：引擎从第一天就有这个动作（_a_upgradePlot + BAL.plotUpgradeCost
     + 身价核算 07-metrics 里的 pl.upgraded），但 UI 从来没给过入口 ——
     是一样由 tools/wiring-check.cjs 的【反向检查】扫出来的。 */
  if (d.upgrade != null) { A('upgradePlot', { index: +d.upgrade }); return; }
  /* 「等着」按钮已删（2026-10-08）：它只弹一条和卡片上已写着的倒计时完全重复的 toast，
     零信息增量；而 docs/06 §6 的新手引导脚本里从未设计过这颗按钮（那里只要求
     「卡片显示进度条 + 还差 16 秒」和「成熟时闪绿边 + 吐司：熟了。割不割？」）——
     它是实现阶段留下的空壳。同时把「自动化 900」改成「自动收割 900G」：
     原文字没有告诉玩家“自动什么”，也没有货币单位，连策划本人（2026-10-08）都读不出来它是什么。 */

  if (d.act === 'plantAll') { A('plantAll', { crop: ui.pick }); return; }
  if (d.act === 'harvestAll') { A('harvestAll'); return; }
  if (d.act === 'expand') { A('expand', { use: d.use, district: d.district }); return; }
  if (d.act === 'upgradeStorage') { A('upgradeStorage'); return; }
  /* ⚠ 2026-10-08 玩家实测「工坊修不了，没法买」的**根因**：
     viewMake() 一直在渲染「再建一间作坊」这颗按钮，
     但分派表里从来没有这一支 —— 按钮是死的 ⇒ 作坊永远 0 间
     ⇒ _a_craft 里 `p.workshops <= 0` 直接拒绝、"开一批" 的启用条件
       `HUMAN.workshops > busy` 又恒为 `0 > 0` = false ⇒ 永久灰。
     **一颗死按钮同时造成"建不了（没法买）"和"开不了（修不了）"两个症状。**
     （这个类别由 tools/wiring-check.cjs 钉死：UI 渲染出的每个 data-act，
       必须在分派表里有对应的 `d.act === '…'` 分支。） */
  if (d.act === 'buildWorkshop') { A('buildWorkshop'); return; }
  /* §4.12 从公司拿钱：默认拿满（= 公司现金 × 持股 × 0.8 的上限）。
     它是**借款**、要还，所以身价当场不变 —— 拿钱不是印钞（见 `_a_take`）。 */
  if (d.act === 'take') { A('take', {}); return; }
  /* §4.13 股东会：提案与表决。三个按钮均走 data-act —— 于是 wiring-check 会替我验证
     它们真的接到了分派表上（这就是当年“工坊修不了”那颗死按钮留下的教训）。 */
  if (d.act === 'dividend') { A('propose', { kind: 'dividend', ratio: 0.5 }); return; }
  if (d.act === 'votefor') { A('vote', { id: +d.id, for: true }); return; }
  if (d.act === 'voteagainst') { A('vote', { id: +d.id, for: false }); return; }
  /* §4.10 上市募资：默认让出 25%（上限 35%，且不得掉到剩下一半以下）。 */
  if (d.act === 'ipo') { A('ipo', { give: 0.25 }); return; }
  /* §4.9 主动联系：借钱 / 邀他入股 / 请他议事。一颗按钮一件事，参数写在 data-* 上。 */
  if (d.act === 'contact') { A('contact', { toPid: d.to, kind: d.kind }); return; }

  if (d.qset) {
    const [cid, v] = d.qset.split(':');
    ui.qty[cid] = v === 'max' ? G.quote(HUMAN, cid, 1, 'buy').maxQty : +v;
    render(true); return;
  }
  /* §17.2 上门的买家 */
  if (d.sellto) { A('sellTo', { type: d.sellto }); return; }
  if (d.decline) { A('declineBuyer', { type: d.decline }); return; }
  if (d.buy) { A('buy', { crop: d.buy, qty: qtyOf(d.buy) }); return; }
  if (d.sell) { A('sell', { crop: d.sell, qty: qtyOf(d.sell) }); return; }
  if (d.buymax) { const q = G.quote(HUMAN, d.buymax, 1, 'buy').maxQty; A('buy', { crop: d.buymax, qty: q }); return; }
  if (d.limit) {
    const [cid, side] = d.limit.split(':');
    const p = parseFloat($('#lp_' + cid).value);
    A('limit', { crop: cid, side, qty: qtyOf(cid), price: p });
    return;
  }
  if (d.cancel) { A('cancelOrder', { id: +d.cancel }); return; }
  if (d.short) {
    const q = parseInt($('#sq_' + d.short).value, 10) || 10;
    A('short', { crop: d.short, qty: q });
    return;
  }
  if (d.cover) { A('cover', { crop: d.cover }); return; }

  if (d.craft) { A('craft', { product: d.craft }); return; }
  if (d.buyneed) {
    const pd = GG.PRODUCTS.find(x => x.id === d.buyneed);
    const need = pd.need - (HUMAN.storage[pd.from] || 0);
    if (need > 0) A('buy', { crop: pd.from, qty: need });
    return;
  }
  if (d.sellone) { A('sell', { crop: d.sellone, qty: HUMAN.storage[d.sellone] || 0 }); return; }
  if (d.deposit) { const v = parseInt($('#depAmt').value, 10) || 0; A('deposit', { amount: v }); return; }
  if (d.withdraw) { A('withdraw', { amount: Math.floor(HUMAN.deposit) }); return; }
  if (d.lend) {
    const el = $('#lend_' + d.lend);
    const v = parseInt(el ? el.value : '0', 10) || 0;
    A('lend', { pid: d.lend, amount: v });
    return;
  }
  if (d.intel) { const r = A('intel', { tier: d.intel }, true); if (r.ok) { ui.lastIntel = r.msg; toast(r.msg, 'info', 5000); render(true); } return; }
  if (d.sellintel) { A('sellIntel'); return; }
  if (d.rumor) { A('rumor', { crop: ui.pick, dir: d.rumor }); return; }

  if (d.loan) { const v = parseInt($('#loanAmt').value, 10) || 0; A('loan', { amount: v }); return; }
  if (d.repay) { A('repay', { amount: HUMAN.cash }); return; }
  if (d.shell === 'new') { A('shell'); return; }
  if (d.shell === 'cover') { A('shell', { cover: 1 }); return; }
  if (d.shell === 'toggle') { A('shellToggle', { on: !HUMAN.shell.on }); return; }

  if (d.bid) { const v = parseInt($('#bidAmt').value, 10) || 0; A('bid', { amount: v }); return; }

  if (d.talent) {
    const r = A('talent', { id: d.talent });
    if (r.ok) { $('#ovTalent').classList.add('hide'); toast('本领已生效', 'ok'); }
    return;
  }
  if (t.id === 'reroll') { A('reroll'); talentModal(); return; }
}
/* pointerup 为主（抗重渲染），click 兜底键盘与辅助技术 */
document.addEventListener('pointerup', onPointerUp, true);
document.addEventListener('click', onClick);
function qtyOf(cid) {
  const el = $('#q_' + cid);
  const v = el ? parseInt(el.value, 10) : NaN;
  return isNaN(v) || v <= 0 ? (ui.qty[cid] || 10) : v;
}

['input', 'change'].forEach(ev => document.addEventListener(ev, e => {
  const t = e.target;
  if (t.dataset && t.dataset.qin) { const v = parseInt(t.value, 10); if (!isNaN(v)) ui.qty[t.dataset.qin] = v; }
}));

/* ---------- 主循环 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.4, (now - last) / 1000); last = now;
  if (G) {
    if (!G.s.over) G.advanceReal(dt);
    // 新日志 → 吐司（只提示重要类型，避免刷屏）
    const feed = G.s.feed;
    for (let i = ui.seen; i < feed.length; i++) {
      const f = feed[i];
      /* 升级 / 点亮天赋（★ 开头）只进流水条，不弹提示。
         这是噪声最大的来源：一次开局就能攒出十几条 NPC 升级 + 天赋，全弹出来就是盖满整屏
         （见 toast() 的注释）。玩家自己升级有天赋弹窗，不会漏。 */
      if (f.text.charAt(0) === '★') continue;
      if (['event', 'auction', 'bad', 'good'].includes(f.kind)) {
        if (!(f.kind === 'good' && f.text.indexOf('收成') >= 0)) toast(f.text, f.kind === 'bad' ? 'err' : f.kind === 'good' ? 'ok' : 'info', 3000);
      }
    }
    ui.seen = feed.length;
    if (now - ui.lastRender > 120) { render(); ui.lastRender = now; }
    if (!G.s.over && now - (ui.lastSave || 0) > 10000) { ui.lastSave = now; autosave(); }
    // 重要事件的音效（日志里出现就响一次）
    if (!ui.lastEventText && G.s.activeEvents.length) { sfx.event(); ui.lastEventText = 1; }
    if (!G.s.activeEvents.length) ui.lastEventText = 0;
  }
  raf = requestAnimationFrame(frame);
}

/* ---------- 启动 ---------- */
/* URL 预设：?auto=1&corp=trade&view=market&warm=180&pace=8
   便于把某一局的具体状态做成可分享的链接，也用于自动截图。 */
(function bootPreset() {
  let q = null;
  try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
  if (!q || !q.get('auto')) { renderStart(); return; }
  start(q.get('corp') || 'trade', q.get('seed') || undefined, parseFloat(q.get('pace') || '8'));
  if (q.get('plant')) G.act(G.s.humanId, 'plantAll', { crop: q.get('plant') });
  const warm = parseFloat(q.get('warm') || '0');
  if (warm > 0) G.advanceGame(warm);           // warm 单位是"游戏分钟"
  setSpeed(q.get('speed') != null ? parseFloat(q.get('speed')) : 0);   // 截图默认暂停
  if (q.get('view')) { view = q.get('view'); }
  render(true);
})();
raf = requestAnimationFrame(frame);
/* 无头测试钩子：让 tools/ui-smoke.cjs 能在没有真实浏览器的情况下
   驱动同一套渲染与点击逻辑，确认每个视图都不抛错。 */
window.__GG_DEBUG = {
  get G() { return G; }, get human() { return HUMAN; },
  start, render, onClick,
  toast,   // 让无头测试能直接验证「同屏最多 3 条 + 溢出汇总」这条上限
  setView(v) { view = v; render(true); },
  ev(dataset) { return { target: { closest: () => ({ dataset, id: dataset.__id || '' }) } }; },
  get viewHtml() { return $('#view').innerHTML; },
  get tabHtml() { return $('#tabs').innerHTML; },
  get topHtml() { return $('#clock').innerHTML + '|' + $('#navbig').innerHTML + '|' + $('#phasetag').textContent; },
  __autosave: autosave,
  __save: () => GG.save(G),
  __continue: continueSave,
  __startMeta: () => ({ canContinue: !!store.get(LS.save, null), label: (document.getElementById('cont') || {}).textContent }),
};
})();

</script>
</body>
