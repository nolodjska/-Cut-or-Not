  if (typeof this.s.inboxSeq !== 'number') this.s.inboxSeq = 0;
  const m = {
    i: ++this.s.inboxSeq, t: Math.round(this.s.t), to: pid,
    kind, from, subject, body: body || '',
    read: false,
    key: o.key || null,                     /* 去重键（派生式信件必需，见 _mailTick） */
    deadlineT: typeof o.deadlineT === 'number' ? o.deadlineT : null,
    actions: o.actions || null,             /* 留给票决的三按钮（赞成/反对/弃权） */
  };
  this.s.inbox.push(m);
  if (this.s.inbox.length > 200) this.s.inbox.shift();
  if (!o.silent) this._log('mail', '✉ ' + from + ' 来信：' + subject, pid);
  return m;
};

/* 从**已有状态**派生该寄的信。
   ⚠ 为什么不直接在各系统的事件点上插一行 _mail：
     ① 事件点散在 04 / 05 / 09 / 11 / 15 五个 part，插一行就要动五处、逐个重对锚点；
     ② 事件点是“发生的那一瞬”，而信是“**要你处理的事**” —— 同一件事会在状态里
        持续成立（拍卖进行中、现金为负、有人在囤货），派生天然覆盖
        “我读档回来时它还在”，插点做不到。
   ⚠ 必须幂等：_flush 每次 act / tick 都跑，靠 key 去重；否则一场拍卖能寄出几百封。
   ⚠ 本批只覆盖**引擎已存在**的信号。NPC 提案（合作请求 / 收购通知 / 决议）
     需要决议数据模型，是下一刀 —— 这里**不伪造**。 */
Game.prototype._mailTick = function () {
  const s = this.s;
  if (!s || !Array.isArray(s.players)) return;
  if (!Array.isArray(s.inbox)) s.inbox = [];
  const me = s.players.find(p => p.id === s.humanId);
  if (!me) return;
  const has = k => s.inbox.some(m => m.key === k);
  const post = (key, kind, from, subject, body, opts) => {
    if (has(key)) return;
    this._mail(me.id, kind, from, subject, body, Object.assign({ key }, opts || {}));
  };

  /* ① 拍卖会进行中 —— 有时限，错过就没了，所以是最该寄的一封 */
  const a = s.auction;
  if (a && a.phase !== 'done') {
    const end = a.phase === 'sealed' ? a.sealedEndT : a.openEndT;
    post('auction:' + s.auctionCount, 'deal', '拍卖行', '开槌了，场上有货',
      end ? '现在能出价，剩 ' + Math.max(0, Math.round(end - s.t)) + ' 秒截止。过了这一场，下一场不知道什么时候。' :
            '现在能出价，抓紧。',
      { deadlineT: end || null });
  }

  /* ② 欠的账快赶上家底（与 08-chrome 的 warnBox、总账的健康灯同一杆标尺 × 1.5）*/
  let sheet = null;
  try { sheet = this.consolidated(me); } catch (e) { sheet = null; }
  if (sheet) {
    if (sheet.debt > 0 && sheet.nav < sheet.debt * BAL.maintRatio * 1.5) {
      post('maint', 'system', '钱庄', '你欠的账快赶上家底了',
        '再往下走，债主可能会上门拿地、拿货、拿公司抵债。先去“钱庄”把钱还上或把货卖掉。');
    }
  }

  /* ③ 现金为负（追保窗口已经开了）*/
  if (me.cash < 0) {
    post('cashneg', 'system', '钱庄', '你手上的现金已经是负的',
      '现金为负时会被记债。卖掉点货，或者去“钱庄”借一笔把洞堵上。');
  }

  /* ④ 有人在囤某种货（垄断倒计时）—— 风声，不是命令，所以写得像传闻 */
  const cd = s.countdown;
  if (cd && cd.crop && s.crops[cd.crop]) {
    post('mono:' + s.auctionCount + ':' + cd.crop, 'rumor', '市场上的风声',
      '有人在扫 ' + s.crops[cd.crop].name,
      '市面上开始有人大量收 ' + s.crops[cd.crop].name + '，价格已经在动了。要不要跟着做，你自己定。');
  }
};

/* ---- 3.9c NPC 提案（docs/19 §4.9：合作请求 / 收购通知 由对方主动发起，投进信匣）----------
   ⚠ 为什么用**独立随机流**（hash32(seed,'offers')）：一旦借用 this.rng.npc / main，
     就会挪动其它系统共用的随机序列 —— 660 局仿真的结果会整体变样。
     那不是“改对了”，是“换了个游戏”，而且 15 项守卫里没一项能告诉你“仿真变了是因为谁”。
   ⚠ 提案本身**不改任何状态**，只在答复时结算（见 _decideOffer）。
     否则仿真里会凭空多出钱货，而人一次点击就能把不变量撞坏。
   ⚠ 提案只发给玩家（humanId）：NPC 之间不走信匣。 */
Game.prototype._offerRng = function () {
  /* 懒建 + 不进存档：它只由 seed 决定，读档后重建即得同一条流。 */
  if (!this._offRng) this._offRng = new Rng(hash32(this.s.seed, 'offers'));
  return this._offRng;
};

Game.prototype._offerTick = function () {
  const s = this.s;
  if (!s || !Array.isArray(s.players)) return;
  if (!Array.isArray(s.offers)) s.offers = [];
  if (!Array.isArray(s.inbox)) s.inbox = [];
  if (typeof s.offersSeq !== 'number') s.offersSeq = 0;
  if (typeof s.offerSlot !== 'number') s.offerSlot = 0;
  const me = s.players.find(p => p.id === s.humanId);
  if (!me || !me.alive) return;

  /* 过期：提案有寿命。超时不是“没发生”，而是“对方把这个条件收回了”。 */
  for (const o of s.offers) if (o.status === 'open' && s.t > o.deadlineT) o.status = 'lapsed';

  /* ---- 第二段：**你发出去的**提议，NPC 那边给回音 ----
     ⚠ 这段必须放在下面那几个 early return **之前**：
       那些 return 是“NPC 主动来找你”的频率限制，不该把“别人回你的话”一起卡掉。
     ⚠ 延迟 3 游戏小时再回：秒回的话，“联系别人”看起来像按开关，
       而且那段时间玩家看不到“正在等回话”（docs/19 §4.9）。 */
  for (const o of s.offers) {
    if (!o.outbound || o.status !== 'open' || o.answered) continue;
    const to = s.players.find(x => x.id === o.to);
    if (!to || !to.alive) { o.status = 'lapsed'; continue; }
    if (to.isHuman) continue;                 /* 真人自己决定，引擎不代答 */
    if (s.t < o.t + 180) continue;
    o.answered = true;
    this._npcAnswer(o);
  }

  /* 前 6 个游戏小时是新手引导期，不打扰；之后每满 8 小时看一眼有没有人来谈事。 */
  if (s.t < 6 * 60) return;
  const slot = Math.floor(s.t / (8 * 60));
  if (slot <= s.offerSlot) return;
  s.offerSlot = slot;

  if (s.offers.filter(o => o.status === 'open').length >= 2) return;   /* 最多两件事等你答复 */
  const r = this._offerRng();
  if (!r.chance(0.55)) return;
  const others = s.players.filter(p => p.id !== s.humanId && p.alive);
  if (!others.length) return;
  const npc = others[Math.min(others.length - 1, Math.floor(r.next() * others.length))];

  /* 两选一：他要借你的钱 / 他要按溢价收你仓库里的货。只挑真做得成的那个。 */
  const lendable = Math.round(me.cash * 0.3 / 100) * 100;
  const canLoan = lendable >= 800;
  /* ⚠ 仓库（storage）里不只放作物，还放**加工品** —— 是同一个筐。
     所以这里必须按“它在 s.crops 或 s.products 里有没有价”来筛。
     我第一版只筛了“数量 > 0”，于是制造线一进到这里就崩：
       s.crops['萝卜干'].price → Cannot read properties of undefined
     660 局仿真里正是这样报出 48 条异常的（其余策略 0 条 —— 它们的仓库里只有作物）。 */
  const held = Object.keys(me.storage || {}).filter(k =>
    (s.crops[k] || s.products[k]) && Math.floor(me.storage[k] || 0) > 0);
  const canBuy = held.length > 0;
  if (!canLoan && !canBuy) return;
  const kind = (canLoan && canBuy) ? (r.chance(0.5) ? 'loan' : 'buy') : (canLoan ? 'loan' : 'buy');

  const deadlineT = s.t + 1440;                    /* 一天内答复 */
  const o = {
    i: ++s.offersSeq, t: Math.round(s.t), from: npc.id, fromName: npc.name,
    kind, status: 'open', deadlineT, mailId: null,
  };
  let subject, body;
  if (kind === 'loan') {
    o.amount = clamp(lendable, 800, 8000);
    o.rateDay = round2(BAL.loanRateDay * (1.6 + r.range(0, 0.9)));
    o.dueT = s.t + 2 * 1440;
    subject = npc.name + ' 想借 ' + money(o.amount) + ' G';
    body = npc.name + ' 手头周转不开，想跟你借 ' + money(o.amount) + ' G，' +
      '按每天 ' + (o.rateDay * 100).toFixed(1) + '% 计息，两天内还本付息。\n' +
      '你答应的话，钱当场从你账上划走；到期他不还，这笔就烂在你手里。';
  } else {
    const cid = held[Math.min(held.length - 1, Math.floor(r.next() * held.length))];
    const c = s.crops[cid] || s.products[cid];
    o.crop = cid;
    o.qty = Math.floor(me.storage[cid] || 0);
    o.mult = round2(1.12 + r.range(0, 0.23));      /* 溢价 12% ~ 35% */
    o.price = round2(c.price * o.mult);
    subject = npc.name + ' 出价要你手里的 ' + c.name;
    body = npc.name + ' 想一次把你手上的 ' + c.name + ' 全买走（' + o.qty + ' 单位），' +
      '开价 ' + o.price + ' G/单位，比眼下市价高 ' + Math.round((o.mult - 1) * 100) + '%。\n' +
      '这是场外交易，价格不会因此被压下去。答应就当场交割。';
  }
  o.mailId = this._mail(me.id, kind === 'loan' ? 'coop' : 'buyout', npc.name, subject, body,
    { deadlineT, actions: ['accept', 'decline'] }).i;
  s.offers.push(o);
};

/* 答复一份提案。**只有这里会改变状态**（提案本身只读，见 _offerTick 的注释）。
   p = 答复的人（目前只有玩家会走到这）。accept = 接受 / 拒绝。 */
Game.prototype._decideOffer = function (p, id, accept) {
  const s = this.s;
  if (!Array.isArray(s.offers)) s.offers = [];
  const o = s.offers.find(x => x.i === id);
  if (!o) return { ok: false, msg: '这封信已经不在了' };
  if (o.status !== 'open') return { ok: false, msg: '这件事你已经答复过了' };
  if (s.t > o.deadlineT) { o.status = 'lapsed'; return { ok: false, msg: '答复时间已经过了' }; }
  const npc = s.players.find(x => x.id === o.from);
  if (!accept) {
    o.status = 'declined';
    return { ok: true, msg: '已回绝。' };
  }
  /* ↓ 新增的方向：由**你**发起、对方点头（docs/19 §4.9）。
     老的两支（loan / buy）是“NPC 求你”，这两支是“你求别人”，共用同一份 s.offers。 */
  if (o.kind === 'jv' || o.kind === 'invite' || o.kind === 'borrow') {
    return this._settleNew(p, o, accept);
  }
  if (o.kind === 'loan') {
    if (p.cash < o.amount) return { ok: false, msg: '你手上的现金不够借给他' };
    p.cash -= o.amount;
    /* 字段形状与 13-talent.js:131 的放贷一致，到期由 04-ticks 的到期钩子收本息 / 认坏账。 */
    p.loansOut.push({ toPid: o.from, principal: o.amount, rateDay: o.rateDay, dueT: o.dueT });
    if (npc) npc.cash += o.amount;
    o.status = 'accepted';
    this._log('money', p.name + ' 借给 ' + (npc ? npc.name : '某人') + ' ' + money(o.amount) +
      ' G（每天 ' + (o.rateDay * 100).toFixed(1) + '% 计息）', p.id);
    return { ok: true, msg: '钱已经划给他了，到期自动收本息。' };
  }
  /* buy：场外交割。不动盘面（这正是对方能给溢价的理由）。 */
  const have = Math.floor(p.storage[o.crop] || 0);
  const qty = Math.min(o.qty, have);
  if (qty <= 0) {
    o.status = 'lapsed';
    return { ok: false, msg: '你手上已经没有这种货了' };
  }
  const gross = qty * o.price;
  const book = p.avgCost[o.crop] || { q: 0, c: 0 };
  const profit = gross - qty * book.c;        /* 成本口径与 06-trade.js:106 的成交一致 */
  p.storage[o.crop] = have - qty;
  if (p.avgCost[o.crop]) p.avgCost[o.crop].q = Math.max(0, book.q - qty);
  p.cash += gross;
  p.realized += profit;
  p.m.realized += profit;
  if (npc) npc.cash -= gross;
  o.status = 'accepted';
  const gname = (s.crops[o.crop] || s.products[o.crop] || {}).name || o.crop;
  this._log('trade', p.name + ' 把手上的 ' + gname + ' 一次卖给 ' +
    (npc ? npc.name : '某人') + '（' + qty + ' 单位 @' + o.price + '）', p.id);
  return { ok: true, msg: '已交割，钱到账。' };
};

/* 动作入口：Game.prototype.act 是按 `_a_` + name 反射查找的，
   所以新增动作只需加方法，**不用去改任何分派表**（也就不会踩到别人正在改的那段）。 */
Game.prototype._a_acceptOffer = function (p, d) { return this._decideOffer(p, +d.id, true); };
Game.prototype._a_declineOffer = function (p, d) { return this._decideOffer(p, +d.id, false); };

/* ---- 3.9e 主动联系：由**你**向别人发提案（docs/19 §4.9）------------------
   三种：借钱 / 入股（合资）/ 拉人议事。
   ⚠ “合资创办公司”在本作落成**入股你现有的公司**（对方出钱换股份）——
     “创办一家全新公司”需要公司实体 id（见 docs/19 §4.13 的架构阻断记录），
     而入股在现有模型里能做到真持股、真分红、真表决（名册里会真的多出一条）。
   ⚠ 你自己发出的提议**不进你的信匣**（信是“要你处理的事”，不该把你自己发的东西塞回来），
     只在流水条上留一条。对方是真人时才寄信给他。 */
Game.prototype._a_contact = function (p, d) {
  const s = this.s;
  if (!Array.isArray(s.offers)) s.offers = [];
  if (typeof s.offersSeq !== 'number') s.offersSeq = 0;
  const to = s.players.find(x => x.id === d.toPid);
  if (!to || !to.alive) return { ok: false, msg: '找不到这个人' };
  if (to.id === p.id) return { ok: false, msg: '不用跟自己谈' };
  const open = s.offers.filter(o => o.status === 'open' && o.from === p.id).length;
  if (open >= 3) return { ok: false, msg: '你手上还有几件没回音的，先等人家回话' };

  const kind = d.kind || 'borrow';
  const deadlineT = s.t + 1440;               /* 一天内答复（与 NPC 提案同口径） */
  const o = {
    i: ++s.offersSeq, t: Math.round(s.t), from: p.id, fromName: p.name,
    to: to.id, kind, status: 'open', deadlineT, mailId: null, outbound: true,
  };
  let subject, body, mailKind;
  if (kind === 'borrow') {
    o.amount = Math.floor(d.amount == null ? 3000 : d.amount);
    if (!(o.amount > 0)) return { ok: false, msg: '要借多少得说个数' };
    /* ⚠ 默认开的息必须**高于**市面利率（BAL.loanRateDay）——
       照市面利率开，NPC 的判定（≥ 市面×1.1）永远不通过，
       “借钱”那颗一键按钮就变成了一颗必然失败的按钮。 */
    o.rateDay = clamp(d.rateDay == null ? BAL.loanRateDay * 1.25 : d.rateDay, 0, 0.2);
    o.dueT = s.t + 2 * 1440;
    subject = p.name + ' 想跟你借 ' + money(o.amount) + ' G';
    body = p.name + ' 手头周转不开，想跟你借 ' + money(o.amount) + ' G，按每天 ' +
      (o.rateDay * 100).toFixed(1) + '% 计息，两天内还本付息。\n' +
      '答应的话，钱当场从你账上划给他；到期他不还，这笔就烂在你手里。';
    mailKind = 'coop';
  } else if (kind === 'jv') {
    /* 标的 = **这位持股人**（一人一公司），不是“哪家公司” —— 见 rofrHolder 的注释。 */
    const target = to;
    const own = (target.holdings || []).find(h => h.corpId === target.corp);
    const cur = own && own.stake != null ? own.stake : 1;
    o.give = clamp(d.give == null ? 0.2 : d.give, 0, Math.max(0, cur - 0.05));
    if (!(o.give > 0)) return { ok: false, msg: '他手上的股份已经很分散，先谈不动' };
    const after = cur - o.give;
    /* 控制权溢价（§4.14 A）：现实惯例 20~40%，本作默认 30%。
       这一笔之后他不再控股 ⇒ 你买的是“说了算”，所以贵三成。 */
    const cross = cur > 0.5 && after <= 0.5;
    o.controlMult = cross ? 1.3 : 1;
    o.price = Math.round(this.stakePrice(target, o.give) * o.controlMult);
    if (!(o.price > 0)) return { ok: false, msg: '这家公司现在估值太低，开不了价' };
    subject = p.name + ' 要买你公司 ' + Math.round(o.give * 100) + '% 的股份';
    body = p.name + ' 出价 ' + money(o.price) + ' G，要买你手上 ' +
      Math.round(o.give * 100) + '% 的股份' +
      (cross ? '（买完这家公司他说了算）' : '') + '。\n' +
      '钱进你公司的账。这笔要<b>先问过其他股东</b> —— 他们可以按同样的条件先拿。';
    mailKind = 'deal';
  } else if (kind === 'invite') {
    const dec = (s.decisions || []).find(x => x.status === 'open' && x.ownerPid === p.id);
    if (!dec) return { ok: false, msg: '你现在没有在议的事 —— 先去股东会提一件' };
    o.decId = dec.id;
    subject = p.name + ' 请你对「' + dec.label + '」表个态';
    body = p.name + ' 想请你对「' + dec.label + '」表个态 —— 回一声你的意见。';
    mailKind = 'vote';
  } else {
    return { ok: false, msg: '没有这种事' };
  }
  if (to.isHuman) {
    o.mailId = this._mail(to.id, mailKind, p.name, subject, body,
      { deadlineT, actions: ['accept', 'decline'] }).i;
  }
  s.offers.push(o);
  this._log('mail', '✉ 你给 ' + to.name + ' 发了件事：' + subject, p.id);
  return { ok: true, msg: '发出去等回话，一天内他不回就算这事收回了' };
};

/* 新方向提案的结算（借钱 / 入股 / 拉人议事）。accepter = 点头的那个人。
   ⚠ 记账必须**两边成对**：一方减的一方必须加，否则仿真里会凭空多出钱货
     （这是 _decideOffer 注释里警告过的事，新分支同样适用）。 */
Game.prototype._settleNew = function (p, o, accept) {
  const s = this.s;
  const other = s.players.find(x => x.id === (o.from === p.id ? o.to : o.from));
  if (!other || !other.alive) { o.status = 'lapsed'; return { ok: false, msg: '对方已经不在了' }; }
  if (!accept) { o.status = 'declined'; return { ok: true, msg: '你回绝了。' }; }

  if (o.kind === 'borrow') {
    /* p = 出钱的一方（借出人），other = 借钱的一方 */
    if (p.cash < o.amount) return { ok: false, msg: '你手上的现金不够借出去' };
    p.cash -= o.amount; other.cash += o.amount;
    other.debt += o.amount;
    if (!Array.isArray(p.loansOut)) p.loansOut = [];
    p.loansOut.push({ toPid: other.id, principal: o.amount, rateDay: o.rateDay, dueT: o.dueT });
    o.status = 'accepted';
    this._log('money', p.name + ' 借给 ' + other.name + ' ' + money(o.amount) +
      ' G（每天 ' + (o.rateDay * 100).toFixed(1) + '% 计息）', p.id);
    return { ok: true, msg: '钱已经划出去了，到期自动收本息。' };
  }

  if (o.kind === 'jv') {
    /* ⚠ 方向必须按**提议本身**定，不能按“谁答复”定：
         发起人 = 买方（from）、被问的人 = 卖方（to）。
         我第一版把付款方写成 p（答复者），于是「你买 NPC 的股份」会变成 NPC 付钱给你 ——
         买卖反了，而且表面上还“成交”了，静默错账。
       ⚠ 钱进**卖方公司账**（增资口径）：卖方老板的并表身价因此不变，
         他把股份换成等额现金，两边都不吃亏（buyer test B6 锁这条）。 */
    const buyer = s.players.find(x => x.id === o.from);
    const seller = s.players.find(x => x.id === o.to);
    if (!buyer || !buyer.alive || !seller || !seller.alive) {
      o.status = 'lapsed'; return { ok: false, msg: '有一方已经不在了' };
    }
    const ownH = (seller.holdings || []).find(h => h.corpId === seller.corp);
    if (!ownH) { o.status = 'lapsed'; return { ok: false, msg: '这家公司已经不在了' }; }
    const cur = ownH.stake == null ? 1 : ownH.stake;
    const give = Math.min(o.give, cur);
    if (!(give > 0)) { o.status = 'lapsed'; return { ok: false, msg: '卖方手里没有可让的股份' }; }
    /* 钱不够就买不成（不做“付一部分、拿全部”的错账） */
    if (buyer.cash < o.price) { o.status = 'lapsed'; return { ok: false, msg: '买方现在拿不出这笔钱' }; }
    const price = o.price;
    const round4 = x => Math.round(x * 10000) / 10000;
    const deliver = (holder) => {
      holder.cash -= price;                              /* 买方付钱 */
      seller.cash += price;                              /* 钱进卖方**公司账**，不进老板口袋 */
      ownH.stake = round4(cur - give);
      if (!Array.isArray(holder.stakes)) holder.stakes = [];
      holder.stakes.push({ targetPid: seller.id, stake: give, price, t: Math.round(s.t) });
      o.status = 'accepted';
    };
    const rofr = this.rofrHolder(seller, buyer.id, price);
    if (rofr && rofr.pid !== buyer.id) {
      const hp = s.players.find(x => x.id === rofr.pid);
      deliver(hp);
      o.rofr = hp.id;
      buyer.memory = buyer.memory || {};
      if (!buyer.memory.grudge) buyer.memory.grudge = {};
      buyer.memory.grudge[hp.id] = (buyer.memory.grudge[hp.id] || 0) + 1;
      this._log('deal', seller.name + ' 的股份被 ' + hp.name + ' 按优先权先拿走了 —— ' +
        buyer.name + ' 白跑一趟', buyer.id);
      return { ok: true, msg: '按规矩，其他股东可以同价先拿 —— ' + hp.name +
        ' 把它拿走了。这价你买不到了。' };
    }
    deliver(buyer);
    const ctrl = ownH.stake <= 0.5;
    this._log('deal', buyer.name + ' 买下了 ' + seller.name + ' 公司 ' + Math.round(give * 100) +
      '% 的股份（出 ' + money(price) + ' G）' + (ctrl ? ' —— 这家公司他说了算' : ''), buyer.id);
    return { ok: true, msg: '成交：你拿下 ' + Math.round(give * 100) + '% 的股份 —— ' +
      (ctrl ? '这家公司现在你说了算。' : '以后分钱有你一份。') };
  }

  if (o.kind === 'invite') {
    const dec = (s.decisions || []).find(x => x.id === o.decId && x.status === 'open');
    if (!dec) { o.status = 'lapsed'; return { ok: false, msg: '那件事已经结束了' }; }
    /* ⚠ 只是被拉来表态**不算股东**：capTable 里没他，这一票在结算时不进分母。
       真正的股东身份只能靠入股拿到（那时名册里会真的多出一条）。
       写清楚这一条，是为了避免“应付一句就等于有了股份”的错觉。 */
    dec.voters[p.id] = 'for';
    o.status = 'accepted';
    this._log('event', p.name + ' 对「' + dec.label + '」表了态：同意', p.id);
    return { ok: true, msg: '已经替你表了态：同意。' };
  }

  o.status = 'lapsed';
  return { ok: false, msg: '这种事不会办' };
};

/* 你发出去的提议，NPC 给的回音。判定规则要“看得懂”（不是黑箱概率）：
     · 借钱：他手上有钱、且你给得起息（不低于市面利率）才借
     · 入股：他现金够、且价钱不吃亏（不高于公允价）才入
     · 议事：他有空就表个态
   ⚠ 用 _offerRng（独立流），不能借 this.rng.main —— 那会把 660 局仿真整体挪位，
     而没有任何一条守卫能告诉你“仿真变了是因为谁”。 */
Game.prototype._npcAnswer = function (o) {
  const s = this.s;
  const to = s.players.find(x => x.id === o.to);
  const me = s.players.find(x => x.id === o.from);
  if (!to || !to.alive || !me) { o.status = 'lapsed'; return; }
  const r = this._offerRng();
  if (o.kind === 'borrow') {
    const ok = to.cash >= o.amount && o.rateDay >= BAL.loanRateDay * 1.1;
    if (!ok) {
      o.status = 'declined';
      this._log('mail', '✉ ' + to.name + ' 回话：这笔钱他现在拿不出来', to.id);
      return;
    }
    this._settleNew(to, o, true);
    return;
  }
  if (o.kind === 'jv') {
    /* ⚠ 卖的是**他的**公司 ⇒ 公允价必须按**卖方**算；
       能不能成交要看**买方**付不付得起。
       我第一版两处都写反了（拿买方的估值、又去查卖方的现金）——
       结果是“他钱不够所以不卖你”，而卖的人根本不付钱。 */
    const fair = this.stakePrice(to, o.give);
    const ok = me.cash >= o.price && o.price >= fair * 0.98;
    if (!ok) {
      o.status = 'declined';
      this._log('mail', '✉ ' + to.name + ' 回话：这个价他不卖', to.id);
      return;
    }
    this._settleNew(to, o, true);
    return;
  }
  if (o.kind === 'invite') {
    if (!r.chance(0.6)) {
      o.status = 'declined';
      this._log('mail', '✉ ' + to.name + ' 回话：这事他不想掺和', to.id);
      return;
    }
    this._settleNew(to, o, true);
    return;
  }
  o.status = 'lapsed';
};

Game.prototype._flush = function () {
  /* 派生式信件与 NPC 提案的唯一入口。放在 listeners 之前：这样订阅者（UI）拿到的 s
     已经包含本帧新到的东西，不会出现“预览图有信、信匣里没有”的错位。 */
  this._mailTick();
  this._offerTick();
  for (const fn of this.listeners) fn(this.s);
};

/* ---------------------------------------------------------------------------
 * 4. 结算：叙事颁奖礼
 * -------------------------------------------------------------------------*/
Game.prototype.settle = function () {
  const s = this.s;
  const ps = s.players.filter(p => p.isHuman || true);
  const initNav = BAL.startCash +
    (BAL.startPlots + (CORPS.find(c => c.id === 'grow').start.plots)) * 0 +
    BAL.startPlots * BAL.plotCost; // 基准 = 10000
  ps.forEach(p => {
    p.sNav = this.nav(p);
    p.sRatio = p.sNav / (p.initNav || 10000);     // 相对自己的开局，而不是硬编码 10000
  });

  const out = { seed: s.seed, reason: s.overReason, rows: [], chief: null, tiers: [], nominations: [] };

  // --- C 垄断
  const cRank = ps.filter(p => p.alive && this.debtRatio(p) <= BAL.monoMaxDebtRatio).map(p => {
    const m = this.monoProx(p);
    return { p, prox: m.prox, ctrl: m.ctrl, crop: m.crop };
  }).sort((a, b) => b.prox - a.prox);

  // --- A 财富
  const aRank = ps.slice().sort((x, y) => y.sNav - x.sNav);
  /* A 门槛：原案写 3.0 倍，但 40 种子 × 9 策略共 360 局实测，最高只有 2.65 倍，
     3.0 倍从未达成 —— 等于把"农业大亨"这条胜利路径做成了死代码。
     改为 2.5 倍（实测最强策略约 3~5% 能达成，符合"可达但不轻松"）。
     这条改动是集成时的判断，已列入 docs/09 与待决问题 Q-TIME-01。 */
  /* 门槛跟着实测走：关掉"往返套利印钞机"之后，全场的真实天花板降到 ~2.1 倍
     （20 种子 × 11 打法实测：最高 2.09，2.5 倍零达成）。所以从 2.5 再降到 2.0 ——
     "可达但不轻松"。这条数字的变动史本身就是证据：**原来的 1.7~1.8 倍交易收益里有很大
     一部分其实是那台印钞机贡献的**，修掉之后市场的超额收益消失了（详见 docs/09 §2.12）。 */
  const A_THRESHOLD = 2.0;
  const aAchieved = aRank.filter(r => r.sRatio >= A_THRESHOLD && r.alive);

  // --- B 生存
  /* 原案只要"活着且负债率低"就发不倒翁，结果 4 人局里 3 个人都拿到 —— 称号立刻贬值。
     加两道闸：① 资产不能比开局还少；② 这一局必须真的存在过威胁
     （有人出局，或你自己经历过现金流断裂），"活下来"才配叫胜利。 */
  const anyoneDied = ps.some(p => !p.alive);
  const bAlive = ps
    .filter(p => p.alive && this.debtRatio(p) < 0.30 && p.sRatio >= 1.05 && (anyoneDied || p.m.pressure))
    .sort((a, b) => b.sRatio - a.sRatio)
    .slice(0, 2);

  // --- D 综合
  const maxOf = f => Math.max(1e-6, ...ps.map(f));
  const mG = maxOf(p => p.m.harvestedValue), mT = maxOf(p => Math.max(0, p.m.realized)),
        mA = maxOf(p => p.m.acquiredValue + p.m.auctionSpend), mB = maxOf(p => p.m.auctionSpend);
  for (const p of ps) {
    const farm = p.m.harvestedValue / mG;
    const trade = Math.max(0, p.m.realized) / mT;
    const acq = (p.m.acquiredValue + p.m.auctionSpend) / mA;
    const auc = p.m.auctionSpend / mB;
    p.dScore = 0.25 * farm + 0.35 * trade + 0.40 * acq;
    p.dParts = { farm, trade, acq, auc };
    p.dMin = Math.min(farm, trade, acq);
  }
  const dRank = ps.slice().sort((x, y) => y.dScore - x.dScore);

  // --- 首席
  let chief = null, chiefTitle = null, chiefWhy = '';
  if (cRank.length && cRank[0].prox >= 1) {
    chief = cRank[0].p; chiefTitle = '市场霸主';
    chiefWhy = '控制 ' + s.crops[cRank[0].crop].name + ' ' + (cRank[0].ctrl * 100).toFixed(1) +
      '% 流通量，超过 ' + (s.crops[cRank[0].crop].mono * 100) + '% 的垄断门槛';
  } else if (cRank.length && cRank[0].prox > 0.8) {
    chief = cRank[0].p; chiefTitle = '准市场霸主';
    chiefWhy = '最接近垄断：' + s.crops[cRank[0].crop].name + ' 控制度 ' + (cRank[0].prox * 100).toFixed(0) + '% 门槛';
  } else if (aAchieved.length) {
    chief = aAchieved[0]; chiefTitle = '农业大亨';
    chiefWhy = '净资产达到初始的 ' + aAchieved[0].sRatio.toFixed(2) + ' 倍';
  } else {
    chief = aRank[0]; chiefTitle = '全场领先者';
    chiefWhy = '净资产 ' + money(aRank[0].sNav) + ' G（' + aRank[0].sRatio.toFixed(2) + '× 初始）最高，但没人达成垄断或财富门槛';
  }
  out.chief = { pid: chief.id, name: chief.name, title: chiefTitle, why: chiefWhy };

  // --- 次级称号
  for (const r of aAchieved) if (r !== chief) out.tiers.push({ pid: r.id, name: r.name, title: '农业大亨', why: '净资产 ' + r.sRatio.toFixed(2) + '× 初始' });
  for (const p of bAlive) if (p !== chief) out.tiers.push({
    pid: p.id, name: p.name, title: '不倒翁',
    why: '在有人出局的乱局里活到最后，负债率只有 ' + (this.debtRatio(p) * 100).toFixed(0) +
         '%，净资产还有 ' + p.sRatio.toFixed(2) + ' 倍'
  });
  if (dRank[0] !== chief && dRank[0].dScore >= 0.5) out.tiers.push({ pid: dRank[0].p ? dRank[0].p.id : dRank[0].id, name: (dRank[0].p || dRank[0]).name, title: '全能商人', why: '综合得分 ' + dRank[0].dScore.toFixed(2) + ' 最高' });

  // --- 提名（10 项）
  const N = [];
  const top = (arr, key, cmp) => arr.slice().sort((a, b) => cmp(a[key], b[key]));
  const maxv = key => Math.max(...ps.map(p => key(p)));

  // 1 市场搅局者
  {
    const cand = ps.slice().sort((a, b) => b.m.volContrib - a.m.volContrib)[0];
    if (cand && cand.m.volContrib > 0 && cand.m.realized <= 0)
      N.push({ title: '市场搅局者', pid: cand.id, name: cand.name, why: '制造了全场最大的价格波动（' + money(cand.m.volContrib) + ' G 冲击），自己却没赚到钱',
        text: '你的存在让市场哀嚎。在你的操盘下，没有赢家。这是你愿意看到的局面吗？' });
  }
  // 2 经济命运共同体
  {
    const ranked = ps.slice().sort((a, b) => b.m.blessCredit - a.m.blessCredit);
    const cand = ranked[0];
    /* 门槛从 500 提到 5000：原来 360 局里触发了 353 次（98%），等于人人有份的参与奖。
       2026-10-08 再改：660 局实测提到 5000 后**仍触发 606/660（92%）** —— 5000 还是太低。
       所以除绝对下限外，再加一条**断层**要求（必须 ≥2× 第二名）。
       断层是**尺度无关**的：不会像绝对值那样“换个平衡就又失效”。 */
    const BLESS_FLOOR = 5000, BLESS_GAP = 1.6;
    const second = ranked[1] ? (ranked[1].m.blessCredit || 0) : 0;
    if (cand && cand.m.blessCredit > BLESS_FLOOR && cand.m.blessCredit >= second * BLESS_GAP)
      N.push({ title: '经济命运共同体', pid: cand.id, name: cand.name, why: '你的买入与托市让别人的持仓增值了 ' + money(cand.m.blessCredit) + ' G',
        text: '你的每一次买入，都在替别人的库存抬价。你建起了一座繁荣的城市，虽然租金不是你的。' });
  }
  // 3 隐形操盘手
  {
    const cand = ps.filter(p => p.shell.owned > 0).sort((a, b) => b.m.shellTrades - a.m.shellTrades)[0];
    if (cand && cand.m.shellTrades > 0)
      N.push({ title: '隐形操盘手', pid: cand.id, name: cand.name, why: '所有交易都走看不见的通道，成交 ' + cand.m.shellTrades + ' 次仍未被识破',
        text: '没有人知道你是谁。但市场记得你的每一次出手。' });
  }
  // 4 泡沫制造机
  {
    const cand = ps.slice().sort((a, b) => (b.m.bubble || 0) - (a.m.bubble || 0))[0];
    if (cand && (cand.m.bubble || 0) >= 0.20)
      N.push({ title: '泡沫制造机', pid: cand.id, name: cand.name, why: '把价格顶到基本面上方 ' + ((cand.m.bubble || 0) * 100).toFixed(0) + '%，并且在破裂前跑掉了',
        text: '你吹起了泡沫，又在破裂前离场。你是天才，还是骗子？' });
  }
  // 5 最悲情退场者
  {
    const cand = ps.filter(p => !p.alive).sort((a, b) => b.m.bankruptProx - a.m.bankruptProx)[0];
    if (cand)
      N.push({ title: '最悲情退场者', pid: cand.id, name: cand.name, why: '出局时垄断度已到门槛的 ' + (cand.m.bankruptProx * 100).toFixed(0) + '%',
        text: '你差一点就赢了。差一点。' });
  }
  // 6 定海神针
  {
    /* 2026-10-08：原条件（全程没砸盘 + NAV≥1.15）实测触发 531/660（80%）。
       NPC 本来就大多不砸盘，所以“没砸过盘”几乎是默认状态，不构成区分。
       改法：提高 NAV 底线 + 加“断层”（≥1.1× 第二名）。 */
    const stillRanked = ps.filter(p => p.alive && p.m.aggression <= 0 && p.sRatio >= 1.15).sort((a, b) => b.sRatio - a.sRatio);
    const cand = stillRanked[0];
    const STILL_NAV = 1.40, STILL_GAP = 1.20;
    const stillSecond = stillRanked[1] ? stillRanked[1].sRatio : 0;
    if (cand && cand.sRatio >= STILL_NAV && cand.sRatio >= stillSecond * STILL_GAP)
      N.push({ title: '定海神针', pid: cand.id, name: cand.name, why: '全程没有砸过盘、没有放过消息、没有看跌，净资产还有 ' + cand.sRatio.toFixed(2) + ' 倍',
        text: '你是这个疯狂市场里唯一清醒的人。' });
  }
  // 7 最佳线报商
  {
    const cand = ps.filter(p => p.m.intelSold > 0).sort((a, b) => (b.m.intelCorrect / Math.max(1, b.m.intelSold)) - (a.m.intelCorrect / Math.max(1, a.m.intelSold)))[0];
    if (cand)
      N.push({ title: '最佳线报商', pid: cand.id, name: cand.name, why: '卖出的情报准确率 ' + Math.round(cand.m.intelCorrect / Math.max(1, cand.m.intelSold) * 100) + '%，共 ' + cand.m.intelSold + ' 条',
        text: '你卖的不是消息，是别人的命运。' });
  }
  // 8 产业链之王：有加工产值的优先（从种子到成品，这才是真正的纵向整合）
  {
    const crafters = ps.filter(p => (p.m.craftedUnits || 0) > 0).sort((a, b) => (b.m.craftedValue || 0) - (a.m.craftedValue || 0));
    const cand = crafters[0] || ps.filter(p => p.m.harvestedUnits > 0 && Object.keys(p.m.cropTraded).length >= 3)
      .sort((a, b) => (b.storage ? Object.keys(b.storage).length : 0) - (a.storage ? Object.keys(a.storage).length : 0))[0];
    /* 稀少性门槛（2026-10-08 加）：原来只有 `if (cand)`，等于“只要有人种过地就发”——
       660 局实测触发 629/660（95%），是参与奖不是区分奖（`00` §12.1 要的是“被看见”，不是“人人有份”）。
       改法两条路取一：① 加工深度过线**且明显领先第二名**；② 经营的作物种类是**全场唯一**的深。
       ①里的 GAP 是尺度无关的；FLOOR/KINDS 先用经验值，待 sim 标定后微调。 */
    const CRAFT_FLOOR = 1200, CRAFT_GAP = 2.0, CROP_KINDS = 5;
    const deepKinds = p => Object.keys(p.m.cropTraded).length >= CROP_KINDS;
    const second = crafters[1] ? (crafters[1].m.craftedValue || 0) : 0;
    const worthy = !!cand && (
      (cand.m.craftedValue || 0) >= Math.max(CRAFT_FLOOR, second * CRAFT_GAP) ||
      (deepKinds(cand) && ps.filter(deepKinds).length === 1)
    );
    if (worthy) {
      const crafted = (cand.m.craftedUnits || 0) > 0;
      N.push({
        title: '产业链之王', pid: cand.id, name: cand.name,
        why: crafted
          ? '亲手加工了 ' + cand.m.craftedUnits + ' 件成品（产值 ' + money(cand.m.craftedValue) + ' G），品牌值 ' + Math.round(cand.brand || 0)
          : '同时经营 ' + Object.keys(cand.m.cropTraded).length + ' 种作物，从种子到成交一条龙',
        text: crafted ? '你控制了从种子到餐桌的每一段路 —— 而且你是自己动手的那一个。'
                      : '你控制了从种子到餐桌的每一段路。',
      });
    }
  }
  // 9 价差收割机
  {
    /* 2026-10-08：原门槛只有 harvestCredit > 500，实测触发 625/660（95%）——
       比“经济命运共同体”还像参与奖。加“断层”（≥2× 第二名）让它成为真荣誉。 */
    const hvRanked = ps.slice().sort((a, b) => b.m.harvestCredit - a.m.harvestCredit);
    const cand = hvRanked[0];
    const HARVEST_FLOOR = 500, HARVEST_GAP = 1.5;
    const hvSecond = hvRanked[1] ? (hvRanked[1].m.harvestCredit || 0) : 0;
    if (cand && cand.m.harvestCredit > HARVEST_FLOOR && cand.m.harvestCredit >= hvSecond * HARVEST_GAP)
      N.push({ title: '价差收割机', pid: cand.id, name: cand.name, why: '你的抛售让别人的持仓缩水了 ' + money(cand.m.harvestCredit) + ' G',
        text: '你收割了所有人。但下一个被收割的，会不会是你？' });
  }
  // 10 城市奠基人
  {
    /* 2026-10-08：原条件没有门槛（“最高”必然存在一个人），实测触发 448/660（68%）。
       加“断层”（≥1.5× 第二名）+ 绝对下限。 */
    const cityVal = p => (p.m.harvestedValue + p.m.volume);
    const cityRanked = ps.slice().sort((a, b) => cityVal(b) - cityVal(a));
    const cand = cityRanked[0];
    const CITY_FLOOR = 3000, CITY_GAP = 1.5;
    const citySecond = cityRanked[1] ? cityVal(cityRanked[1]) : 0;
    if (cand && cityVal(cand) > CITY_FLOOR && cityVal(cand) >= citySecond * CITY_GAP)
      N.push({ title: '城市奠基人', pid: cand.id, name: cand.name, why: '累计生产与交易总额 ' + money(cand.m.harvestedValue + cand.m.volume) + ' G，全场最高',
        text: '你建起了这座城市。虽然没人记得你的名字。' });
  }

  // 配额：每人最多 2 条（首席 3 条）
  const count = {};
  const finalN = [];
  for (const n of N) {
    const isChief = n.pid === chief.id;
    const cap = isChief ? 3 : 2;
    count[n.pid] = count[n.pid] || 0;
    if (count[n.pid] >= cap) continue;
    count[n.pid]++;
    finalN.push(n);
  }
  out.nominations = finalN;
  out.rows = ps.map(p => ({
    id: p.id, name: p.name, isHuman: p.isHuman, corpName: p.corpName, alive: p.alive,
    nav: Math.round(p.sNav), ratio: p.sRatio, debtRatio: this.debtRatio(p),
    dScore: p.dScore, monoProx: this.monoProx(p).prox, monoCrop: this.monoProx(p).crop,
    talents: p.talents.slice(), level: p.level,
    crafted: Math.round(p.m.craftedValue || 0), brand: Math.round(p.brand || 0),
    avenger: !!p.isAvenger,
    real: Math.round(p.m.realized), harvest: Math.round(p.m.harvestedValue), volume: Math.round(p.m.volume),
    nominCount: count[p.id] || 0,
  })).sort((a, b) => b.nav - a.nav);
  out.log = s.feed.slice(-60);
  return out;
};

/* ---------------------------------------------------------------------------
 * 5. 导出
 * -------------------------------------------------------------------------*/
return {
  BAL, CROPS, CROP_IDS, CORPS, TALENTS, EVENT_POOL, LOT_POOL,
  PRODUCTS, PRODUCT_IDS, PRODUCT_MARGIN, INPUTS, INPUT_IDS, MARKET_GOODS,
  Game, Rng, hash32, makeSeed, money, clamp, round2,
  newGame: opts => new Game(opts),
  /* 存档：把整个状态序列化成字符串 / 反序列化回一个可继续跑的 Game
     （引擎本来就是纯逻辑 + 可 JSON 状态，所以这层很薄；
       读档后必须重建 PRNG，否则随机流会从种子头开始，与存档前的走势分叉） */
  save: g => JSON.stringify({
    v: 1, seed: g.s.seed, secPerGameHour: g.s.secPerGameHour,
    rngState: g.s.rngState, state: g.s,
  }),
  load: str => {
    const raw = JSON.parse(str);
    const g = new Game({ seed: raw.seed, secPerGameHour: raw.secPerGameHour, npcs: 0, hintFirstEvent: false });
    g.s = raw.state;
    g.s.rngState = raw.rngState;
    g._buildRngs();
    return g;
  },
};
});

</script>
<script>
/* ============================================================================
 * 《割不割》Demo UI 层
 * ----------------------------------------------------------------------------
 * 只做三件事：读 engine 的 state、渲染、把点击翻译成 GG.act()。
 * 任何数值计算都问引擎（quote / nav / creditLimit / monoShare），UI 不自己算。
 *
 * 文案规则（docs/07 §2.8.3 红线词表）：玩家可见文案里不出现
 * 投资/收益/理财/提现/充值/股票/K线/做空/杠杆/保证金/爆仓/割韭菜 等词。
 * 统一替换为：本钱/进账/走势/看跌/押金/被动清盘/价差收割。
 * ==========================================================================*/
(function () {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Math.round(n).toLocaleString('zh-CN');
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString('zh-CN');

let G = null, HUMAN = null, view = 'farm', raf = null;

/* ============ 本地持久化（docs/07 定的 Demo 形态：单文件 H5 + localStorage，无后端） ============ */
const LS = { save: 'gg.save.v1', codex: 'gg.codex.v1', mute: 'gg.mute.v1' };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 隐私模式等，忽略 */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } },
};

/* 图鉴：跨局只保留"广度"，不保留"强度"（docs/04 的硬约束 —— 任何跨局因素对单局净资产的加成 ≤ +5%） */
function emptyCodex() {
  return { games: 0, wins: 0, bestRatio: 0, dead: 0, crops: {}, corps: {}, talents: {}, noms: {}, seeds: {} };
}
function codex() { return Object.assign(emptyCodex(), store.get(LS.codex, {})); }
function bump(obj, key) { if (key) obj[key] = (obj[key] || 0) + 1; }
function recordRun() {
  if (!G || !G.s.settlement || ui.recorded) return;
  ui.recorded = true;
  const st = G.s.settlement, c = codex();
  c.games++;
  const me = st.rows.find(r => r.id === G.s.humanId);
  if (me) {
    if (st.chief.pid === G.s.humanId) c.wins++;
    if (!me.alive) c.dead++;
    if (me.ratio > c.bestRatio) c.bestRatio = Math.round(me.ratio * 100) / 100;
  }
  for (const cid of Object.keys(HUMAN.m.cropTraded)) bump(c.crops, cid);
  for (const cid in HUMAN.storage) bump(c.crops, cid);
  for (const t of HUMAN.talents) bump(c.talents, t);
  bump(c.corps, HUMAN.corp);
  for (const n of st.nominations) if (n.pid === G.s.humanId) bump(c.noms, n.title);
  c.seeds[G.s.seed] = 1;
  store.set(LS.codex, c);
}

/* 音效：全部用 WebAudio 现场合成，不依赖任何音频文件（单文件交付的前提） */
const sfx = (() => {
  let ctx = null;
  const on = () => { try { return localStorage.getItem(LS.mute) !== '1'; } catch (e) { return true; } };
  function tone(freq, dur, type, gain, delay) {
    if (!on()) return;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      const t0 = ctx.currentTime + (delay || 0);
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || 0.06, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* 用户还没交互过，浏览器会拒绝，忽略即可 */ }
  }
  return {
    ok: () => tone(660, 0.10, 'triangle', 0.05),
    err: () => tone(180, 0.16, 'sawtooth', 0.04),
    money: () => { tone(880, 0.09, 'triangle', 0.05); tone(1320, 0.10, 'triangle', 0.04, 0.07); },
    harvest: () => tone(520, 0.12, 'sine', 0.05),
    event: () => { tone(300, 0.20, 'sine', 0.05); tone(420, 0.24, 'sine', 0.04, 0.12); },
    alert: () => { tone(220, 0.22, 'square', 0.05); tone(180, 0.26, 'square', 0.04, 0.14); },
    award: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.34, 'triangle', 0.05, i * 0.13)); },
    bid: () => tone(760, 0.12, 'square', 0.045),
    toggle() {
      const m = !on();
      try { localStorage.setItem(LS.mute, m ? '0' : '1'); } catch (e) { }
      return m;
    },
    isOn: on,
  };
})();
const ui = {
  qty: {}, pick: 'radish', seen: 0, lastRender: 0, pace: 8,   // 默认萝卜：新手第一个闭环只要 16 秒
  lastIntel: null, intelOpen: false, warnShown: false, talentFor: 0, tabDot: {},
  feedOpen: false, toastOverflow: 0,
  /* 一级（集团总账）还是二级（公司工作台），docs/20 §3 两级导航。
     初值取 false：docs/20 §1.1 说总账是“默认落点”，但新手引导（docs/06）
     要求开赛后直奔农田 —— 两者还没定就取保守值（行为零变化），
     由顶栏 🏠 进总账。要不要改成 true，等策划定。 */
  root: false,
};

/* 有美术就用美术，没有就退回 emoji（单文件不带头图也能玩） */
const ICON_FILE = { radish:'radish', chili:'chili', ginseng:'ginseng' };
const EV_ART = { drought:'drought' };
function icon(id, size) {
  const g = G.good(id) || {};
  const emoji = g.icon || '❓';
  const px = size || 22;
  const file = ICON_FILE[id];
  const style = `width:${px}px;height:${px}px;font-size:${px * 0.8}px`;
  if (!file) return `<span class="icwrap noart" style="${style}"><em>${emoji}</em></span>`;
  return `<span class="icwrap" style="${style}">
    <img src="assets/icon-${file}.webp" alt="" loading="lazy"
         onerror="this.closest('.icwrap').classList.add('noart')">
    <em>${emoji}</em></span>`;
}

/* ---------- 时间 / 文案 ---------- */
function dayOf(t) { return Math.floor(t / 1440) + 1; }
function hhmm(t) {
  const m = Math.floor(t % 1440);
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0');
}
function phaseText() {
  const s = G.s, d = dayOf(s.t);
  if (s.countdown) {
    const h = (s.countdown.until - s.t) / 60;
    return '⚑ 终局倒计时 ' + secLeftTxt(s.countdown.until - s.t) + '：' + G._pidName(s.countdown.pid) + ' 正在锁死 ' +
      s.crops[s.countdown.crop].name + '，去打断他';
  }
  if (s.auction && s.auction.phase !== 'done') {
    const a = s.auction;
    const end = a.phase === 'sealed' ? a.sealedEndT : a.openEndT;
    return '🔨 拍卖会进行中（' + (a.phase === 'sealed' ? '暗标' : '明标') + '，剩 ' +
      secLeftTxt(end - s.t) + '）';
  }
  if (d === 1) return '拓荒期：先让地里有东西，再谈别的';
  if (d === 2) return '分化期：有人开始动手了，今天有拍卖会';
  return '决战期：最后一天，算总账';
}

/* 把游戏时间换算成"人话"的倒计时：拍卖窗口这类同步事件按真实秒算，
   世界进程按游戏小时算。不换算的话，标准局里明标只剩 2.7 秒，玩家看不到也反应不过来。 */
function secLeftTxt(gameMin) {
  if (!G) return '—';
  const real = G.realSecLeft(gameMin);
  if (real < 120) return real.toFixed(0) + ' 秒';
  return (gameMin / 60).toFixed(1) + ' 游戏小时';
}

/* ---------- 吐司 ----------
   上限 3 条 + 溢出汇总成「还有 N 条」。
   旧实现只是 appendChild + setTimeout 删除，**没有任何上限**；而引擎有 40+ 处 _log()，
   日结批处理 / NPC 升级 / 事件 / 拍卖会在同一帧吐出十几条，主循环又对每条新流水都弹一个
   （见 frame()）。实测一次开局能同屏叠 19 条、栈顶冲到 y=-52px —— 整屏连同底部页签栏
   全被盖住，玩家在关键节奏点上看不见也点不了任何东西。
   口径：同屏最多 3 条；同文本同类型去重（只把计时往后推）；超出的丢掉最旧一条并累加计数。 */
const TOAST_MAX = 3;
function toast(msg, kind, ms) {
  if (kind === 'ok') sfx.ok(); else if (kind === 'err') sfx.err();
  const box = $('#toasts');
  if (!box) return;
  const k = kind || 'info';
  const life = ms || 2200;

  const liveNodes = () => [...box.children].filter(n => n.classList.contains('toast') && !n.classList.contains('more'));

  /* 同文本去重：一连串「XX 的挂单成交」只占一格，而不是叠成一堵墙 */
  const same = liveNodes().find(n => n.dataset.msg === msg && n.dataset.kind === k);
  if (same) {
    clearTimeout(same._t1); clearTimeout(same._t2);
    same._t1 = setTimeout(() => { same.style.opacity = '0'; same.style.transition = 'opacity .3s'; }, life);
    same._t2 = setTimeout(() => { same.remove(); clearMore(); }, life + 350);
    return;
  }

  const el = document.createElement('div');
  el.className = 'toast ' + k;
  el.textContent = msg;
  el.dataset.msg = msg;
  el.dataset.kind = k;
  el._t1 = setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, life);
  el._t2 = setTimeout(() => { el.remove(); clearMore(); }, life + 350);
  box.appendChild(el);

  /* 硬上限：每次插入后都裁一遍，所以无论上游怎么爆发，同屏都不会超过 TOAST_MAX 条 */
  const live = liveNodes();
  if (live.length > TOAST_MAX) {
    live.slice(0, live.length - TOAST_MAX).forEach(n => {
      clearTimeout(n._t1); clearTimeout(n._t2);
      n.remove();
      ui.toastOverflow++;
    });
  }
  renderMore();
}

/* 「还有 N 条」汇总条：只在确实丢过提示时出现，挂在栈顶（代表更早、已被折叠的那些） */
function moreNode() {
  const box = $('#toasts');
  if (!box) return null;
  // 用 children 查而不是 querySelector：ui-smoke 的 DOM 替身没有实现 querySelector，
  // 走 querySelector 会在测试里每弹一条就新建一个汇总条，越积越多。
  let n = [...box.children].find(x => x.classList && x.classList.contains('more'));
  if (!n) {
    n = document.createElement('div');
    n.className = 'toast more';
    if (box.firstChild) box.insertBefore(n, box.firstChild); else box.appendChild(n);
  }
  return n;
}
function renderMore() {
  const n = moreNode();
  if (!n) return;
  if (ui.toastOverflow > 0) { n.textContent = '还有 ' + ui.toastOverflow + ' 条'; n.style.display = ''; }
  else n.style.display = 'none';
}
/* 一条都不剩时把计数清零，避免下一轮开局直接带着上一轮的残留数字 */
function clearMore() {
  const box = $('#toasts');
  if (!box) return;
  /* ⚠ box.children 是 HTMLCollection，没有 .some() —— 必须先用展开运算符转成数组。
     ui-smoke 的 DOM 替身把 children 做成了数组，所以这条在测试里不会报，只会在真机炸；
     症状是顶栏下方常驻一行「脚本出错: Uncaught TypeError: box.children.some is not a function」。 */
  if ([...box.children].some(n => n.classList.contains('toast') && !n.classList.contains('more'))) return;
  ui.toastOverflow = 0;
  [...box.children].forEach(n => { if (n.classList.contains('more')) n.remove(); });
}

/* ---------- 动作包装 ---------- */
function A(name, payload, quiet) {
  const r = G.act(G.s.humanId, name, payload || {});
  if (!r.ok) toast(r.msg || '这个操作不行', 'err');
  else if (r.msg && !quiet) toast(r.msg, 'ok');
  render(true);
  return r;
}

/* ---------- 存档 ---------- */
function autosave() {
  if (!G || G.s.over) return;
  const nav = G.nav(HUMAN), ratio = nav / (HUMAN.initNav || 10000);
  store.set(LS.save, {
    v: 1, at: Date.now(), over: false,
    summary: {
      seed: G.s.seed, corp: HUMAN.corp, corpName: HUMAN.corpName,
      t: Math.round(G.s.t), day: dayOf(G.s.t), nav: Math.round(nav),
      ratio: Math.round(ratio * 100) / 100, died: false,
    },
    blob: GG.save(G),
  });
}
function finishSave(sum) {
  const prev = store.get(LS.save, {});
  store.set(LS.save, Object.assign({}, prev, { over: true, summary: Object.assign({}, prev.summary, sum || {}) }));
}
function continueSave() {
  const sv = store.get(LS.save, null);
  if (!sv || !sv.blob) { toast('没有找到存档', 'err'); return false; }
  try {
    G = GG.load(sv.blob);
    HUMAN = G.s.players.find(p => p.id === G.s.humanId);
    ui.seen = G.s.feed.length; ui.qty = {}; ui.recorded = false;
    $('#ovStart').classList.add('hide'); $('#ovEnd').classList.add('hide');
    $('#corp').textContent = HUMAN.corpName;
    setSpeed(G.s.over ? 0 : 1);
    view = G.s.over ? 'end' : 'farm';
    toast('接着上局继续（第 ' + dayOf(G.s.t) + ' 天）', 'info', 2600);
    render(true);
    return true;
  } catch (e) { toast('存档读不出来：' + e.message, 'err', 4000); return false; }
}
function clearSave() { store.del(LS.save); }

/* ---------- 开局 ---------- */

/* 公司星级（docs/19 §2）：稳定 / 利润 / 上手，满星五颗。
   为什么画成**一行**而不是三行：三行 × 6 张卡 = 多 18 行，浮层直接撑爆；
   一行小字才装得下。星级本身不参与玩法计算，只是给玩家的选人依据。 */
const starTxt = n => '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n));

function renderStart() {
  const CORPS = GG.CORPS;
  let corp = 'grow';
  /* 三档节奏统一由引擎的 BAL.paces 给（见 01-data.js 的注释：
     原来硬编码在这里，于是“整局多长”这条最基本的数值没任何守卫能测到）。 */
  const paces = GG.BAL.paces;
  let pace = GG.BAL.paceDefault;
  const sv = store.get(LS.save, null);
  const canContinue = !!(sv && sv.blob && !sv.over);
  /* 复仇开局：上一局被清算过，就可以带着遗产回来（docs/04 的结论：
     遗产 = 上局净值 12%、上限 300 G + 自选一个已点天赋；NPC 对你更狠） */
  const canRevenge = !!(sv && sv.summary && sv.summary.died);
  let revenge = false;
  const seed = GG.makeSeed(new GG.Rng(GG.hash32('ui', Date.now() % 100000)));
  const paint = () => {
    $('#ovStart').innerHTML = `
      <div class="modal" style="padding-top:0">
        <div class="mbody">
        <img class="hero" src="assets/bg-share.webp" alt="" onerror="this.remove()">
        <h2 style="margin-top:12px">割不割</h2>
        <div class="lead">种地是入场券，市场是绞肉机，拍卖是屠宰场，结算是一场颁奖礼。<br>
        你是这一带的金融巨鳄——<b>你持有公司，不是亲手种地</b>。<br>
        先挑一家作为起点。第一步：进「农田」种一茬、收一茬，再拉到「市场」卖掉。<br>
        3 个游戏天里把它做大；全场只有一个首席，但人人都有称号。</div>
        ${canContinue ? `<button class="btn p wide" id="cont" style="margin-bottom:10px">
          继续上局（第 ${sv.summary.day} 天 · ${esc(sv.summary.corpName)} · 净资产 ${fmt(sv.summary.nav)} G）</button>` : ''}
        ${canRevenge ? `<button class="corp ${revenge ? 'on' : ''}" data-revenge="1" style="margin-bottom:10px">
          <div class="t">复仇开局<span class="tag">上一局你被清算了</span></div>
          <div class="ds">带走上局净值的 12%（上限 300 G）和上一个天赋重新开始。
            代价：第 1 天全场都看得见你的标记，NPC 会重点照顾你。</div></button>` : ''}
        <div class="ct"><h3>选你的第一家公司</h3></div>
        <div class="corps">
          ${CORPS.map(c => `<button class="corp ${c.id === corp ? 'on' : ''}" data-corp="${c.id}">
            <div class="t">${esc(c.name)}<span class="tag">${esc(c.tag)}</span></div>
            <div class="ds">${esc(c.desc)}</div>
            <div class="starrow">稳定 ${starTxt(c.stars.stab)} · 利润 ${starTxt(c.stars.profit)} · 上手 ${starTxt(c.stars.ease)}</div></button>`).join('')}
        </div>
        <div class="ct"><h3>节奏</h3><span class="sub" id="paceDesc">${paces.find(x => x.id === pace).d}</span></div>
        <div class="pacerow">
          ${paces.map(p => `<button class="corp ${p.id === pace ? 'on' : ''}" data-pace="${p.id}">
            <div class="t" style="font-size:12px">${p.n}</div></button>`).join('')}
        </div>
        <div class="ct"><h3>世界种子</h3><span class="sub">同一个种子 = 同一个世界，可以和朋友对局</span></div>
        <div class="seedin">
          <input id="seedin" value="${esc(seed)}">
          <button class="btn" id="reseed">换一个</button>
        </div>
        <div class="hint" style="margin-top:9px">纯娱乐。局内没有真钱往来，也没有任何东西能换回真钱。价格由供需、事件和其他玩家一起决定。</div>
        </div><!-- /.mbody 以上可滚动；以下才是真正的固定页脚 -->
        <div class="goFoot"><button class="btn p wide" id="go">开始赛季</button></div>
      </div>`;
    /* 选中态一律「就地改 class」，不再重建 innerHTML。
       原因（用户 2026-10-08 反馈「选公司会重载/闪动」）：重建 innerHTML 会
         ① 让 .modal 的入场动画每点一次就重播一遍 → 肉眼就是闪动；
         ② 把浮层滚动位置弹回顶部；
         ③ 把用户手输/粘贴的世界种子冲回默认值（渲染的是闭包里的旧 seed）。
       sync() 只做 class 切换 + 更新节奏说明，三件事一并解决。 */
    const sync = () => {
      const box = $('#ovStart');
      box.querySelectorAll('[data-corp]').forEach(b => b.classList.toggle('on', b.dataset.corp === corp));
      box.querySelectorAll('[data-pace]').forEach(b => b.classList.toggle('on', +b.dataset.pace === pace));
      box.querySelectorAll('[data-revenge]').forEach(b => b.classList.toggle('on', revenge));
      const pd = box.querySelector('#paceDesc');
      if (pd) pd.textContent = paces.find(x => x.id === pace).d;
    };
    $('#ovStart').querySelectorAll('[data-corp]').forEach(b => b.onclick = () => { corp = b.dataset.corp; sync(); });
    $('#ovStart').querySelectorAll('[data-revenge]').forEach(b => b.onclick = () => { revenge = !revenge; sync(); });
    const cont = $('#cont'); if (cont) cont.onclick = () => continueSave();
    $('#ovStart').querySelectorAll('[data-pace]').forEach(b => b.onclick = () => { pace = +b.dataset.pace; sync(); });
    $('#reseed').onclick = () => {
      $('#seedin').value = GG.makeSeed(new GG.Rng(GG.hash32('ui', (Date.now() ^ (Math.random() * 1e6)) >>> 0)));
    };
    $('#go').onclick = () => {
      if (revenge && sv && sv.summary) {
        start(corp, $('#seedin').value.trim() || undefined, pace, {
          nav: sv.summary.nav, talentId: (store.get(LS.save, {}).summary || {}).talentId || HUMAN_LAST_TALENT,
        });
      } else start(corp, $('#seedin').value.trim() || undefined, pace);
    };
  };
  paint();
  $('#ovStart').classList.remove('hide');
}

let HUMAN_LAST_TALENT = null;   // 复仇开局时默认带走上一个天赋
function start(corp, seed, pace, inheritance) {
  ui.pace = pace;
  G = new GG.Game({ seed, corp, npcs: 3, secPerGameHour: pace, inheritance });
  HUMAN = G.s.players.find(p => p.id === G.s.humanId);
  ui.seen = 0; ui.qty = {}; ui.talentFor = 0; ui.warnShown = false; ui.recorded = false;
  if (!inheritance) clearSave();
  $('#ovStart').classList.add('hide');
  $('#corp').textContent = HUMAN.corpName;
  setSpeed(1);
  // 只播引擎那条开局日志，避免同一条消息弹两次（试玩时发现的重复）
  toast('赛季 ' + G.s.seed + ' 开始。本局规矩：' + G._ruleText(), 'info', 4600);
  render(true);
}

/* ---------- 速度 ---------- */
function setSpeed(mult) {
  if (!G) return;
  G.s.speed = mult;
  G.s.paused = mult === 0;
  document.querySelectorAll('.sbtn').forEach(b => b.classList.toggle('on', +b.dataset.sp === mult));
}

/* ---------- 顶栏 ---------- */
function renderTop() {
  const s = G.s;
  /* 顶栏永远是“我”（集团），底栏永远是“这家公司”（docs/20 §2.3）。
     · 一级（总账）：crumb 显示 🏠 总账，**不出现公司名**；
     · 二级（公司工作台）：crumb 变成「← 集团」，回根入口恒在左上角，
       不用滚到页顶去找。
     ⚠ crumb 必须走事件委托（data-root），不能绑 onclick：
       #clock 每 120ms 被重写一次，绑在节点上的 handler 会跟着节点一起销毁 ——
       那就是“按钮不灵、要点好几下”那个老坑。 */
  /* 面包屑（docs/20 §2.3）：左上角恒有“回上一层”的路。
     ⚠ 一级屏从布尔变模式串之后，这里必须**按模式分档**：
       原来只有“ui.root 假=二级 / 真=总账”两档，于是进了信匣之后左上角
       变成不可点的 <b>🏠 总账</b> —— 既写错了“你现在在哪”，又**没有出路**
       （信匣成了死胡同，只能刷新页面逃出来）。2026-10-08 真机截图看出来的。
     ⚠ 二级那一档的 data-root 从 "1" 改成 "ledger"：两个值都能用（分派里
       非 'mail' 一律当作 'ledger'），但写明白才不会让下一个人以为是随便填的。
     ⚠ 一律写成 `!== 'ledger'`：一级屏现在有 7 张（总账/信匣/市场/情报/钱庄/拍卖/图鉴），
       但凡不是总账本身，左上角都得有回总账的路 —— 上一版把信匣写成死胡同，就是这个坑。
     ⚠ 本注释块被写坏过**两次**：我先把注释的收尾符写在了中间（后面几行落到注释外），
       接着“说明这件事”的那行又把收尾符原样写了进去 —— 于是注释在那一行就断了，
       后面的说明文字全变成代码，ui.js 报 “Unexpected identifier”。
       ⇒ 结论：**注释里永远不要出现注释收尾符的那两个字符**，要说它就写“注释收尾符”。 */
  const crumb = !ui.root
    ? '<button class="crumb" data-root="ledger">← 集团</button>'
    : (ui.root !== 'ledger'
      ? '<button class="crumb" data-root="ledger">← 总账</button>'
      : '<b class="crumb on">🏠 总账</b>');
  $('#clock').innerHTML = crumb + '第 <b>' + dayOf(s.t) + '</b> 天 <b>' + hhmm(s.t) + '</b>' +
    (ui.root ? '' : ' · ' + esc(HUMAN.corpName)) + mailSeal();
  /* ⚠ 顶栏最大字必须是【身价】（集团层并表），不是单一公司的净资产
     （docs/20 §0 三个钱数永不同屏并列 / §2.1 的 Z0 定就是身价）。
     单人公司时两个数相等，所以这个错一直看不见；一旦手里有第二家公司
     （参股 / 控股），顶栏就会开始说谎 —— 而它是玩家判断“我值多少”的唯一大字。
     ⚠ 必须与 index.html 的 #navlab 文案同步（那里原本写的是「净资产」）。 */
  $('#navbig').innerHTML = fmt(G.consolidated(HUMAN).nav) + '<small>G</small>';
  const invV = G.inventoryValue(HUMAN), debt = HUMAN.debt + G.shortLiability(HUMAN);
  /* 四个指标压进一行：净资产在左（大字号），现金/库存/欠款在右。
     改造前 #navmeta 用 <br> 排成两行、净资产再独占一行，#top 一共 145px（占手机 17% 屏高）。
     间距交给 #navmeta 的 flex gap，所以这里只输出三个 span。 */
  /* ⚠ 2026-10-08（第 2 轮试玩）：试玩员看不懂两件事，都出在这一行：
     ① 「G 是什么的单位？」—— 三个小指标原本**连单位都没有**，而大字号那边写「10,000 G」，
        两者贴着出现，玩家「连这是不是钱都定不下来」。现在三个都补上 G。
     ② 「库存 319 是怎么来的？6 块地为什么是 319？」—— 因为这里显示的是
        `inventoryValue`（**货值，钱的数额**），不是**件数**。
        原来叫「库存」，与“件数”混淆。改为「货值」。
        （货 = 手头上还没卖掉的存货，这个说法在农田/市场页已经出现过，不是新词。） */
  $('#navmeta').innerHTML =
    '<span>现金 <b class="mono">' + fmt(HUMAN.cash) + ' G</b></span>' +
    '<span>货值 <b class="mono">' + fmt(invV) + ' G</b></span>' +
    '<span>欠款 <b class="mono ' + (debt > 0 ? 'down' : '') + '">' + fmt(debt) + ' G</b></span>';
  $('#dayfill').style.width = Math.min(100, (s.t / (GG.BAL.days * 1440)) * 100) + '%';
  /* 倒计时 / 拍卖这类时效信息加粗染红；平时的阶段句保持淡色小字 */
  const pt = $('#phasetag');
  pt.textContent = s.over ? '赛季已结束' : phaseText();
  if (!s.over && (s.countdown || (s.auction && s.auction.phase !== 'done'))) pt.dataset.urgent = '1';
  else delete pt.dataset.urgent;
  /* 高亮"当前档"这一个按钮。
     原来写的是 `+b.dataset.sp === s.paused ? 0 : s.speed`：因为 === 优先级高于 ?:，
     实际等价于 `(+b.dataset.sp === s.paused) ? 0 : s.speed`，而数字 === 布尔值恒为 false，
     于是永远传 s.speed —— 运行时 4 个键全亮、暂停时全灭。而且 renderTop() 每 120ms 跑一次。
     现在与 setSpeed() 里的口径统一：暂停看 data-sp=0，否则看 data-sp=speed。 */
  const cur = s.paused ? 0 : s.speed;
  document.querySelectorAll('.sbtn').forEach(b => b.classList.toggle('on', +b.dataset.sp === cur));
}

/* ---------- 标签 ---------- */
function renderTabs() {
  /* 一级根屏**没有 tab**（docs/20 §2.1 Z5）：tab 属于二级公司层，
     两套导航同屏必打架（430px 下互抢空间，层级也错位）。 */
  if (ui.root) {
    const b = $('#tabs');
    if (b.innerHTML !== '') b.innerHTML = '';
    return;
  }
  const s = G.s;
  /* ⚠ 只剩两个：市场/情报/钱庄/拍卖/图鉴 已**搬进集团层**（docs/20 §2.1 Z4「进店行」）。
     它们本来就是全局动作（行情 · 情报行 · 钱庄 · 拍卖会 · 图鉴），不是“这家公司的活”。
     留在底栏会两头打架：底栏说“这是这家公司”，而那几屏其实与哪家公司无关。 */
  const tabs = [
    ['farm', '农田'], ['make', '制造'], ['end', '结算'],
  ];
  const dot = {};
  /* ⚠ “拍卖会进行中”那个红点跟着拍卖一起搬去进店行了（见 17-ledger 的 Z4）——
     留在这里会指向一个不存在的页签，变成永远看不见的死代码。 */
  if (HUMAN.talentOffers) dot.farm = 1;
  if (HUMAN.craftJobs.length) dot.make = 1;
  if (s.over) dot.end = 1;
  const html = tabs.map(([k, n]) => {
    if (k === 'end' && !s.over) return '';
    return `<button class="tab ${view === k ? 'on' : ''}" data-view="${k}">${n}${dot[k] ? '<span class="dot"></span>' : ''}</button>`;
  }).join('');
  /* 内容没变就别碰 DOM。
     以前这里是无脑 innerHTML = ...，而 render() 每 120ms 跑一次：
     一次人手点击的 mousedown→mouseup 常在 80~150ms，正好会跨过一次重建，
     此时浏览器把 click 派发到共同祖先 #tabs（它没有 data-view），
     事件委托里 e.target.closest('button,[data-view]') 拿到 null，点击被静默吞掉 ——
     表现就是“点标签没反应”。 */
  const box = $('#tabs');
  if (box.innerHTML === html) return;
  box.innerHTML = html;
}

/* ---------- 视图：农田 ---------- */
function warnBox() {
  const out = [];
  if (HUMAN.cash < 0) out.push('现金已经是负的。卖掉点货或者去钱庄借，' + GG.BAL.graceHours + ' 小时内没补上，就要拿地、货、公司抵债。');
  /* 只给现象，不给术语（docs/13 §16）：玩家看到的是“欠的账快赶上家底了”，
     不是“维持线”“百分比”。1.5 倍阈值只为提前预警，界面上不出现任何口径数字。 */
  const _sheet = G.consolidated(HUMAN);
  if (_sheet.debt > 0 && _sheet.nav < _sheet.debt * GG.BAL.maintRatio * 1.5) {
    out.push('你欠的账（' + fmt(_sheet.debt) + ' G）快赶上手里的家底（' + fmt(_sheet.nav) + ' G）了 —— 债主随时可能上门。');
  }
  const rent = HUMAN.plots.length * GG.BAL.plotRentPerDay;
  if (HUMAN.cash < rent * 1.2) out.push('你的现金快付不起地租了（' + rent + ' G/天）。');
  if (!out.length) return '';
  return out.map(t => '<div class="warn">⚠ ' + t + '</div>').join('');
}

function viewFarm() {
  const s = G.s;
  const plots = HUMAN.plots.map((pl, i) => {
    const badges = [
      pl.auto ? '<span class="badge auto">自动</span>' : '',
      pl.upgraded ? '<span class="badge up">高产</span>' : '',
    ].join('');
    if (!pl.crop) {
      return `<div class="plot empty"><div class="ic">＋</div><div class="nm">空地</div>
        <div class="meta">选好种子点下面一键播种</div>${badges}
        <div class="acts"><button class="btn sm" data-plant="${i}">种这里</button>${!pl.upgraded ? `<button class="btn sm" data-upgrade="${i}" title="把这块地改成高产地：单产 ×${GG.BAL.plotUpgradeMult}，永久生效">高产地 ${GG.BAL.plotUpgradeCost}G</button>` : ''}</div></div>`;
    }
    const c = s.crops[pl.crop];
    const total = pl.matureT - pl.plantedT;
    const done = Math.min(1, (s.t - pl.plantedT) / Math.max(1, total));
    const left = Math.max(0, (pl.matureT - s.t) / 60);
    return `<div class="plot ${pl.ready ? 'ready' : ''}">${badges}
      <div class="ic">${icon(pl.crop, 30)}</div><div class="nm">${esc(c.name)}</div>
      <div class="meta">${pl.ready ? '<span class="up">可以收割了</span>' : '还差 ' + left.toFixed(1) + ' 小时'}
        · 约 ${Math.round(c.yld * HUMAN.mods.yieldMult * (pl.upgraded ? GG.BAL.plotUpgradeMult : 1))} 单位</div>
      <div class="bar"><i style="width:${(done * 100).toFixed(0)}%"></i></div>
      <div class="acts">
        ${pl.ready ? `<button class="btn sm g" data-harvest="${i}">收割</button>` : ''}
        ${!pl.auto ? `<button class="btn sm" data-auto="${i}" title="永久买断这块地：之后自动收割，不用再点（按成本 70% 计入身价）">自动收割 ${GG.BAL.autoPlotCost}G</button>` : ''}
        ${!pl.upgraded ? `<button class="btn sm" data-upgrade="${i}" title="把这块地改成高产地：单产 ×${GG.BAL.plotUpgradeMult}，永久生效（当前作物也适用）">高产地 ${GG.BAL.plotUpgradeCost}G</button>` : ''}
      </div></div>`;
  }).join('');

  const seedCost = cid => Math.round(s.crops[cid].seed * GG.CORPS.find(x => x.id === HUMAN.corp).seedDiscount * (s.rules.doubleLandRent ? 1.25 : 1));
  const expandN = HUMAN.plots.length - GG.BAL.startPlots;
  /* ⚠ 取价必须和引擎 _a_expand 同口径。那里是 `clamp(n, 0, len-1)` —— **有下界**；
     这里原先是裸 `Math.min(expandN, len-1)`，**下界缺失**：
     贸易/金融这类“开局地块数少于 BAL.startPlots”的公司，expandN 为负
     ⇒ 取到 undefined ⇒ 按钮上印出 `扩一块地 (NaNG)`。
     引擎实际扣费是对的（它有 clamp），**只有预览价成了 NaN**。
     2026-10-08 浏览器实测发现 —— 这类 bug 静态检查、仿真、闸门全都看不见，
     只有“把页面打开看一眼”才会报出来。 */
  const expandIdx = Math.max(0, Math.min(expandN, GG.BAL.plotExpandCost.length - 1));
  const expandCost = GG.BAL.plotExpandCost[expandIdx] * (s.rules.doubleLandRent ? 1.3 : 1);

  const ev = s.activeEvents[0];
  const evPool = ev ? GG.EVENT_POOL.find(e => e.id === ev.id) : null;
  const evArt = ev && EV_ART[ev.id];
  const evBanner = ev ? `<div class="evcard">
      ${evArt ? `<img src="assets/ev-${evArt}.webp" alt="" onerror="this.remove()">` : ''}
      <div class="evtxt"><div class="evname">${esc(evPool ? evPool.name : ev.id)}${ev.crop ? ' · ' + esc(s.crops[ev.crop].name) : ' · 全场'}</div>
        ${esc(evPool ? evPool.text : '')}</div></div>` : '';

  return `
    ${warnBox()}
    ${evBanner}
    <div class="card">
      <div class="ct"><h3>选种子</h3><span class="sub">点一下就播种</span></div>
      <div class="btnrow" style="margin-bottom:8px">
        ${GG.CROP_IDS.map(cid => {
          const c = s.crops[cid];
          /* 成熟时间必须乘上「催芽」天赋的 growMult —— 否则玩家被自己的卡片告知 8 小时，
             而农田倒计时从 6.8 小时开始走，同一屏两个数（2026-10-08 审计拓到）。 */
          const gh = c.growH * (HUMAN.mods.growMult || 1);
          return `<button class="chip ${ui.pick === cid ? 'on' : ''}" data-pick="${cid}">
            ${c.icon}${esc(c.name)} · ${seedCost(cid)}G · ${gh.toFixed(1)} 小时
            <span class="dim">（约 ${Math.round(gh * (G.s.secPerGameHour || 8))} 秒）</span></button>`;
        }).join('')}
      </div>
      <div class="btnrow">
        <button class="btn p" data-act="plantAll">一键播种（${esc(s.crops[ui.pick].name)}）</button>
        <button class="btn g" data-act="harvestAll">一键收割</button>
      </div>
      <div class="hint">${esc(s.crops[ui.pick].note)}</div>
    </div>

    <div class="card">
      <div class="ct"><h3>我的地（${HUMAN.plots.length}/${GG.BAL.maxPlots}）</h3>
        <span class="sub">仓储 ${G.storageUsed(HUMAN)}/${G.storageMax(HUMAN)}</span></div>
      <div id="plots">${plots}</div>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn" data-act="expand" ${HUMAN.plots.length >= GG.BAL.maxPlots ? 'disabled' : ''}>
          扩一块地 ${HUMAN.plots.length >= GG.BAL.maxPlots ? '' : '(' + fmt(expandCost) + 'G)'}</button>
        <button class="btn" data-act="upgradeStorage">仓储 +${GG.BAL.storageUpgradeStep}（${fmt(Math.round(GG.BAL.storageUpgradeCost * (G.s.rules.doubleStoragePrice ? 1.5 : 1)))}G）</button>
      </div>
      <div class="hint">地租每块 ${GG.BAL.plotRentPerDay} G/天，用现金付 —— 占地越多，每天睁眼就欠得越多。</div>
    </div>

    <div class="card">
      <div class="ct"><h3>我的仓库</h3><span class="sub">按估值价计</span></div>
      ${Object.keys(HUMAN.storage).length ? Object.keys(HUMAN.storage).map(cid => {
        const c = G.good(cid) || {};
        return `<div class="line"><span class="k">${icon(cid, 18)} ${esc(c.name || cid)} × ${HUMAN.storage[cid]}</span>
          <span class="v mono">${fmt(HUMAN.storage[cid] * G.valuePrice(cid))} G</span></div>`;
      }).join('') : '<div class="empty">仓库是空的。<br>没有货，就没有话语权。</div>'}
    </div>`;
}

/* ---------- 视图：市场 ---------- */
function spark(cid) {
  const c = G.good(cid);          // 加工品也有走势图
  if (!c) return '';
  const h = c.hist || [];
  if (h.length < 2) return '';
  const w = 300, ht = 34, base = c.base;
  const ps = h.map(x => x.p);
  const lo = Math.min(...ps, base), hi = Math.max(...ps, base);
  const span = Math.max(0.01, hi - lo);
  const pt = (x, i) => [(i / (ps.length - 1)) * w, ht - ((x - lo) / span) * ht];
  const d = ps.map((x, i) => (i ? 'L' : 'M') + pt(x, i).map(v => v.toFixed(1)).join(' ')).join(' ');
  const yb = ht - ((base - lo) / span) * ht;
  const up = ps[ps.length - 1] >= ps[0];
  /* 走势图现在画在纸底行情卡上（v3），不再用给深底设计的荧光绿/红 ——
     改成与全站一致的「墨版」语义色，在米色纸上对比度才够。 */
  const col = up ? '#1a6b42' : '#9e2f28';
  return `<canvas width="${w}" height="${ht}" data-spark="${cid}" data-d="${d}" data-base="${yb.toFixed(1)}" data-col="${col}" data-w="${w}" data-h="${ht}"></canvas>`;
}
function drawSparklines() {
  document.querySelectorAll('canvas[data-spark]').forEach(cv => {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    c.strokeStyle = 'rgba(125,108,80,.5)'; c.setLineDash([3, 3]); c.lineWidth = 1;
    const yb = +cv.dataset.base;
    c.beginPath(); c.moveTo(0, yb); c.lineTo(cv.width, yb); c.stroke();
    c.setLineDash([]);
    const col = cv.dataset.col;
    c.strokeStyle = col; c.lineWidth = 1.6; c.lineJoin = 'round';
    const p = new Path2D(cv.dataset.d);
    c.stroke(p);
    c.globalAlpha = .12; c.fillStyle = col;
    c.lineTo(cv.width, cv.height); c.lineTo(0, cv.height); c.closePath(); c.fill();
    c.globalAlpha = 1;
  });
}

/* §17.1 ① 收货商 —— 界面身份：一个常年在收货的人（有名字、有头像）。
   ⚠ 术语红线（§17.1 明令）：绝不允许出现「做市商 / 库存偏离 / 保留价 /
     逆向选择 / 流动性 / mmInv / 报价价差」。lint-copy 会查。
   ⚠ 为何只对作物显示：收货商 = 产地收购站 / 粮商，收的是**作物**；
     成品的下家是 docs/13 §17.2「上门的买家」那一套（街坊 / 作坊主 / 豪客）。 */
const DEALER = { name: '老赵', icon: '🧺' };

/* 他摊上的那块牌子 —— 牌子 = 他的**可见状态**（docs/13 §17.5 通用法则 1：一个角色 = 一个人 + 一块会变的牌子）。
   刻意**不新增 CSS 类**：这段文字放进已有的 .quote 里继承现成配色，
   避免踩 docs/12 §17 的「深色作用域」坑（新增深底容器不同步名单 → 文字隐形，已犯过两次）。 */
function dealerBoard(p, cid) {
  const quota = G.dealerQuota(cid);
  if (!quota) return '';
  const left = Math.max(0, quota - G.dealerSoldToday(p, cid));
  /* ⚠ 文案三条规则，每一条都来自 2026-10-08 试玩员的实测反馈：
     ① **不说「明天再来」**——他并不拒绝成交。写着“明天再来”却能卖，
        试玩员原话：“让我觉得规则在骗我”。
     ② 主语写清是**他**的胃口、而且**只算你自己**卖的量——
        否则玩家看不出这个数字该归谁（原话：“看不出主语是谁”）。
     ③ 收满时要明说“**还卖得动**”，把因果关系说完整。 */
  return left > 0
    ? `${DEALER.icon} ${DEALER.name}的收货摊：今天还能收 <b>${left}</b> 单位 <span class="dim">（只算你卖的 · 天亮回满）</span>`
    : `${DEALER.icon} ${DEALER.name}的收货摊：<b class="down">今天收够了</b> <span class="dim">（还卖得动，但他会往死里压价 · 天亮回满）</span>`;
}

/* §17.2 ② 上门的买家 —— 「市场不是背景，是有人在外面等我」（§17.2 的设计意图）。
   ⚠ 复用已有的 .crop 类（它在 docs/12 §17 的「深色作用域」名单里），
     **不新增深底容器** —— 否则内部 var(--ink*) 在米色纸上变近白 → 文字隐形（已犯过两次：#feed、.crop）。
   ⚠ 零术语（§17.2 明令）：不说 需求曲线/价格弹性/派生需求/边际消费倾向/饱和/需求侧。 */
function buyerPanel() {
  const rows = Object.keys(GG.BAL.buyers).map(type => {
    const cfg = GG.BAL.buyers[type];
    const off = G.buyerOffer(HUMAN, type);
    if (!off) return '';
    const g = G.good(off.cid);
    const ratio = Math.round(off.price / g.price * 100);
    return `<div class="crop">
      <div class="hd">
        <div class="ic" style="font-size:30px">${cfg.icon}</div>
        <div class="p">
          <div class="row between">
            <div><b>${esc(cfg.name)}</b> 上门来买 <b>${off.qty}</b> 单位${esc(g.name)}</div>
            <div class="px mono">${fmt1(off.price)}<span class="dim" style="font-size:11px"> G</span></div>
          </div>
          <div class="dl dim">${cfg.blurb}</div>
          <div class="dl dim">他出的是行价的 ${ratio}% · ${off.met === 0 ? '头一回见你' : '见过你 ' + off.met + ' 次'}${
            off.regular ? '（<b class="gold">回头客</b>，出价更高）' : ''}${
            off.boughtToday > 0 ? ' · 今天已经买走 ' + off.boughtToday + ' 单位' : ''}</div>
          <div class="dl dim">他买走的货直接拉走，<b>不会把行价砸下来</b></div>
        </div>
      </div>
      <div class="btnrow">
        <button class="btn p" data-sellto="${type}">卖给他 · 到手 ${fmt(off.qty * off.price)} G</button>
        <button class="btn" data-decline="${type}">今天不了</button>
      </div>
    </div>`;
  }).join('');
  return rows ? `<div class="dl dim" style="margin:2px 0 6px">🚪 门口有人在等 —— 卖给他不会砸价</div>${rows}` : '';
}

/* §4.16 地皮 —— 四种“使用”里只暴露**三种**，因为只有它们有真差别：
     · 粮田：便宜、单产基准（= 原来的地）
     · 经济作物地：贵一些、单产更高
     · 设施用地：最贵、单产更低，但适合放自动化（放置化）
   ⚠ **地段暂不上**：它目前只影响地价、不影响任何玩法，
     放上来就是让玩家花真钱做一个假选择 —— 宁可少一个按钮。
   ⚠ 价钱读的是 G.landPrice，与记账/引擎**同一个函数**（不许两处各算一遍）。 */
function landSection() {
  const rows = (GG.BAL.landUses || []).map(use => {
    const cost = G.landPrice(HUMAN, { use });
    const nm = (GG.BAL.landUseName || {})[use] || use;
    const yld = (GG.BAL.landUseYield || {})[use];
    const tag = yld == null ? '' : (yld >= 1 ? ' · 收成 ×' + yld : ' · 收成 ×' + yld);
    return `<button class="chip${HUMAN.cash >= cost ? '' : ' off'}" data-act="expand" data-use="${use}">` +
      `${esc(nm)} ${fmt(cost)}${tag}</button>`;
  }).join('');
  return `<div class="dl dim" style="margin:2px 0 6px">🏞 地皮 —— 不同的地用不同的价，收成也不一样</div>` +
    `<div class="chips" style="flex-wrap:wrap">${rows}</div>`;
}

function viewMake() {
  const s = G.s;
  const corp = GG.CORPS.find(c => c.id === HUMAN.corp);
  const busy = HUMAN.craftJobs.length;
  const jobs = HUMAN.craftJobs.map(j => {
    const pd = s.products[j.pid];
    const total = j.doneT - j.startedT, done = Math.min(1, (s.t - j.startedT) / Math.max(1, total));
    return `<div class="line" style="flex-direction:column;align-items:stretch;gap:5px">
      <div class="row between"><span>${pd.icon} ${esc(pd.name)} × ${j.out}</span>
        <span class="mono dim">还差 ${Math.max(0, (j.doneT - s.t) / 60).toFixed(1)} 游戏小时</span></div>
      <div class="bar" style="height:5px;background:#0d131a;border-radius:3px;overflow:hidden">
        <i style="display:block;height:100%;width:${(done * 100).toFixed(0)}%;background:linear-gradient(90deg,#4aa8ff,#35d07f)"></i></div>
    </div>`;
  }).join('');

  const recipes = GG.PRODUCTS.map(pd => {
    const crop = s.crops[pd.from];
    const have = HUMAN.storage[pd.from] || 0;
    const inCost = pd.need * G.valuePrice(pd.from);
    const outVal = pd.out * G.valuePrice(pd.id) * (1 + 0.30 * Math.pow(HUMAN.brand / 100, 1.5));
    const margin = outVal - inCost;
    const hours = pd.hours * (corp.craftSpeed || 1);
    const can = HUMAN.workshops > busy && have >= pd.need && HUMAN.cash >= 20;
    return `<div class="card" style="background:var(--panel2);margin-bottom:8px">
      <div class="ct"><h3>${pd.icon} ${esc(pd.name)}</h3>

      <div class="hint">${esc(pd.note)}</div>

      <div class="line"><span class="k">成品估值${HUMAN.brand > 0 ? '（含品牌溢价）' : ''}</span><span class="v mono">${fmt(outVal)} G</span></div>
      <div class="line"><span class="k">一批毛利</span><span class="v mono ${margin >= 0 ? 'up' : 'down'}">${margin >= 0 ? '+' : ''}${fmt(margin)} G</span></div>
      <div class="line"><span class="k">你的原料</span><span class="v mono ${have >= pd.need ? 'up' : 'down'}">${have} / ${pd.need}</span></div>

      </div>
    </div>`;

  const prods = GG.PRODUCT_IDS.filter(id => (HUMAN.storage[id] || 0) > 0).map(id => {
    const pd = s.products[id], n = HUMAN.storage[id];
    const q = G.quote(HUMAN, id, n, 'sell');
    return `<div class="line"><span class="k">${pd.icon} ${esc(pd.name)} × ${n}</span>
      <span><span class="v mono">${fmt(q.total)} G</span>
      <button class="btn sm g" data-sellone="${id}" style="margin-left:6px">全卖</button></span></div>`;
  }).join('');

  return `
    ${warnBox()}
    <div class="card">
      <div class="ct"><h3>作坊</h3><span class="sub">${busy}/${HUMAN.workshops} 条产线在跑</span></div>
      <div class="line"><span class="k">作坊数量</span><span class="v mono">${HUMAN.workshops}</span></div>
      <div class="line"><span class="k">品牌值</span><span class="v mono gold">${Math.round(HUMAN.brand)} / 100</span></div>
      <div class="bar" style="height:6px;background:#0d131a;border-radius:3px;overflow:hidden;margin:6px 0">
        <i style="display:block;height:100%;width:${HUMAN.brand}%;background:linear-gradient(90deg,#f5c451,#ff9d5c)"></i></div>
      <div class="hint">品牌值来自"出货量"，每出货一件涨一点。品牌越高，成品卖价越高（最高 +30%）。
        ${corp.brandGrowthMult ? '你的公司品牌涨得更快。' : ''}</div>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn" data-act="buildWorkshop">
          再建一间作坊（${HUMAN.workshops === 0 ? GG.BAL.workshopCost : GG.BAL.workshopCost2} G）</button>
      </div>
      ${jobs ? '<div style="margin-top:8px">' + jobs + '</div>' : '<div class="empty">产线空着。空着的作坊不赚钱。</div>'}
    </div>

    <div class="card">
      <div class="ct"><h3>配方</h3><span class="sub">把原料变成值钱的东西</span></div>
      ${recipes}
      <div class="hint">加工品有自己的市场，价格跟着原料的估值价走 ——
        原料涨，成品的基本面就涨。下游每天能吃下的量是有限的，卖不进去就得等。</div>
    </div>

    ${prods ? `<div class="card"><div class="ct"><h3>成品仓库</h3><span class="sub">按估值价 + 品牌溢价计</span></div>${prods}</div>` : ''}`;
}

/* ---------- 视图：拍卖 ---------- */
function viewAuction() {
  const s = G.s, a = s.auction;
  if (!a) {
    const nexts = [
      { d: 2, h: 6 }, { d: 3, h: 6 },
    ].filter(x => s.t < ((x.d - 1) * 24 + x.h) * 60);
    const nx = nexts[0];
    /* 倒计时必须换算成“人话”。
       修的是 2026-10-08 试玩反馈：这里原来直接印 `1222 游戏分钟后`，
       而同一份文件里种子卡写「2 小时（约 16 秒）」—— 同一屏两种口径，
       玩家没法判断“要不要等”。统一成「先给游戏小时，再括号补真实时长」：
       先给游戏小时，再括号补真实时长。 */
    let when = '本局拍卖已经全部结束了。';
    if (nx) {
      const leftMin = ((nx.d - 1) * 24 + nx.h) * 60 - s.t;
      const real = G.realSecLeft(leftMin);
      when = '下一场在第 ' + nx.d + ' 天 ' + nx.h + ':00，大约 ' + (leftMin / 60).toFixed(1) +
        ' 游戏小时后（约 ' + (real < 120 ? Math.round(real) + ' 秒' : (real / 60).toFixed(1) + ' 分钟') + '）。';
    }
    return `<div class="empty">现在没有拍卖会。<br>
      ${when}<br><br>
      拍卖是唯一能一次拿到"规则级优势"的地方：<br>免税凭证、独家出口权、高产地契、绝密情报、债务包。</div>`;
  }
  const end = a.phase === 'sealed' ? a.sealedEndT : a.openEndT;
  const leftTxt = secLeftTxt(end - s.t);
  const mySealed = a.entries.find(e => e.pid === s.humanId);
  const isFinalist = (a.finalists || []).includes(s.humanId);
  const leader = a.high ? G._pidName(a.high.pid) : '—';
  return `
    <div class="card">
      <div class="ct"><h3>🔨 ${esc(a.lot.name)}</h3><span class="sub">${a.phase === 'sealed' ? '暗标阶段' : a.phase === 'open' ? '明标阶段' : '已结束'}</span></div>
      <div class="hint">${esc(a.lot.desc)}</div>
      <div class="line" style="margin-top:6px"><span class="k">这个标的的估值</span><span class="v mono">约 ${fmt(a.lot.value)} G</span></div>
      <div class="line"><span class="k">本阶段剩余</span><span class="v mono gold">${leftTxt}</span></div>
      ${a.phase === 'open' ? `<div class="line"><span class="k">当前领先</span><span class="v">${esc(leader)} @ ${fmt(a.high ? a.high.amount : 0)} G</span></div>
        <div class="line"><span class="k">最低出价</span><span class="v mono gold">${fmt(a.nextBid || a.startPrice)} G</span></div>` : ''}
      ${a.phase === 'done' ? `<div class="line"><span class="k">结果</span><span class="v gold">${esc(a.result || '')}</span></div>` : ''}

      ${a.phase === 'open' ? `
        <div class="hint" style="margin:8px 0 6px">${isFinalist ? '<b class="up">你入围了，可以出价。</b>' : '你没进明标名单 —— 暗标投得太低了，只能看着。'}</div>

    </div>`;
}

/* ---------- 主渲染 ---------- */
/* 一级 · 集团层根屏「总账」（docs/20 §1.1 / §2.1 / §7 第一批）。
 *
 * 为什么先做它：一级屏定义「集团 ↔ 公司」的**唯一接口**（docs/19 §4.5 的公司卡）。
 * 没有它，后面每个面板都得自己猜层级。
 *
 * 本批只做「读」（docs/19 §6：骨架先只读不交易）：
 *   一屏看清「我值多少 / 手里有什么 / 有什么要出事」。
 *
 * ⚠ 三个钱数永不同屏并列（docs/20 §0）：
 *     本屏只出现【身价】（集团层并表 G.consolidated）；
 *     公司净资产只进公司卡；市值只该出现在「行市」（尚未落地）。
 * ⚠ 术语不上屏（docs/20 §6 双名制）：只说现象人话。
 * ⚠ 导航键一律用 data-root / data-enter，**不能用 data-corp**
 *     （15-events 里 `if (d.corp || d.pace) return;` 会把它吞掉）。
 */

/* 告急带（Z1）：把「会出事」的提到眼前。
   资产不会自己少，但决议会超时、要约会过期、杠杆会被强平 —— 所以它排在资产列表之上。
   ⚠ 本批只能取引擎已有的来源：现金转负 / 追保（并表负债逼近家底）/ 拍卖进行中。
     决议倒计时、要约到期、评估过期要等对应系统落地；返回空数组时整条不占屏。
   ⚠ 这里直接返回**拼好的 HTML**，而不是「{文字, 视图名} 数据」。
     tools/wiring-check.cjs 的【页签 → 视图函数】检查是**静态扫源码**的，
     它只认得属性值当场写成字面量的那种（如 bank / auction）；一旦把变量拼进去，
     它就解析不出来，报“map 里没这个视图、点了会回落 viewFarm”。
     ——而这个警告是对的：那个变量的值**没有任何东西能静态保证**，写错就是静默回落。
     ⚠ 这段注释本身也不能出现那个属性的“赋值形态”字面量：
       它是盲扫正则、注释也照扫（我已因此把“反面示例”照抄一遍而报假错）。 */
function ledgerBelt() {
  const out = [];
  const sheet = G.consolidated(HUMAN);
  if (HUMAN.cash < 0) {
    out.push('<button class="alert" data-root="bank">⚠ 现金已经是负的（' + fmt(HUMAN.cash) + ' G），钱庄随时上门</button>');
  }
  if (sheet.debt > 0 && sheet.nav < sheet.debt * GG.BAL.maintRatio * 1.5) {
    out.push('<button class="alert" data-root="bank">⚠ 欠的账快赶上手里的家底了</button>');
  }
  const a = G.s.auction;
  if (a && a.phase !== 'done') {
    const end = a.phase === 'sealed' ? a.sealedEndT : a.openEndT;
    out.push('<button class="alert" data-root="auction">⚠ 拍卖会进行中，剩 ' + secLeftTxt(end - G.s.t) + '</button>');
  }
  /* 收尾：待读的信也缀在告急带尾部（docs/20 §2.1 把“告急带 → 信匣”定成一条路）。
     没有这行，信匣就只能靠顶栏那颗小印章发现 —— 新手根本不会去点。
     ⚠ 走 data-root（一级屏切换），不能用 data-view：后者会把 ui.root 复位成二级。 */
  const un = mailUnread();
  if (un) out.push('<button class="alert" data-root="mail">✉ ' + un + ' 封没读的信</button>');
  return out;
}

/* 健康度灯：不写字，只看「欠的钱 ÷ 家底」落在哪一档。
   阈值与 08-chrome 的 warnBox 同一口径（maintRatio × 1.5），避免两处说法打架。 */
function ledgerLamp(sheet) {
  if (sheet.debt <= 0) return 'ok';
  if (sheet.nav <= 0) return 'bad';
  const ratio = sheet.debt / sheet.nav;
  if (ratio >= 1 / (GG.BAL.maintRatio * 1.5)) return 'bad';
  if (ratio >= 0.5) return 'mid';
  return 'ok';
}

/* 持股名册：把 holdings 摊平成「一张卡一家公司」。
   ⚠ 不能只画主控公司：docs/19 §4.5 的参股也要有卡（参股卡只读、不进 route UI）。
   旧存档兼容口径与 05-firm.js 的 consolidated() 保持一致（没有 holdings 时只有自己一家）。 */
function ledgerBook() {
  const rows = [];
  const hs = (Array.isArray(HUMAN.holdings) && HUMAN.holdings.length)
    ? HUMAN.holdings.filter(h => !h.bankrupt)
    : [{ corpId: HUMAN.corp, stake: 1, control: 1, debt: 0 }];
  for (const h of hs) {
    const mine = h.corpId === HUMAN.corp;
    const c = GG.CORPS.find(x => x.id === h.corpId) || {};
    const sheet = mine
      ? { nav: G.nav(HUMAN), debt: (HUMAN.debt || 0) + G.shortLiability(HUMAN) }
      : { nav: h.navSnapshot || 0, debt: h.debt || 0 };
    const control = h.control == null ? 1 : h.control;
    rows.push({
      id: h.corpId,
      name: mine ? HUMAN.corpName : (c.name || h.corpId),
      stake: h.stake == null ? 1 : h.stake,
      control,
      mine,
      nav: sheet.nav,
      debt: sheet.debt,
      lamp: ledgerLamp(sheet),
    });
  }
  return rows;
}

/* Z3 股东会（docs/19 §4.13）：提案 + 表决。
   ⚠ 只在**自己主控**的公司上出现 —— 参股的公司轮不到你提案（§4.13 明写）。
   ⚠ “还没表态 / 同意 / 不同意”必须分开写：同一个按钮点过之后要看得出来已记下了。 */
function decisionBlock() {
  const s = G.s;
  const decs = (s.decisions || []).filter(x => x.corpId === HUMAN.corp && x.status === 'open');
  if (!decs.length) {
    return '<div class="ct"><h3>股东会</h3><span class="sub">没在议的事</span></div>' +
