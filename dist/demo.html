  rows.sort((a, b) => b.stake - a.stake);
  return { rows, total: 1 };
};

/* 决议类型（docs/19 §4.14 四类里先落两类 —— 董事会与一致同意等真正用到时再加）
     · 普通决议：出席过半数；出席率不够算“没人理”
     · 特别决议：出席 2/3（改章程 / 合并分立 / 解散这类大事） */
const DEC_KINDS = {
  dividend: { type: 'ordinary', label: '分钱（利润分配）', quorum: 0.5, pass: 0.5 },
  charter:  { type: 'special',  label: '改章程',           quorum: 0.5, pass: 2 / 3 },
};

/* 提案：持股 ≥10% 才有提案权（docs/19 §4.13） */
Game.prototype._a_propose = function (p, d) {
  const kind = d.kind || 'dividend';
  const spec = DEC_KINDS[kind];
  if (!spec) return { ok: false, msg: '没有这种提案' };
  const corpId = p.corp;
  const cap = this.capTable(p, corpId);
  const mine = cap.rows.find(r => r.pid === p.id);
  if (!mine || mine.stake / cap.total < 0.10) {
    return { ok: false, msg: '手上股份不到一成，提案没人接' };
  }
  const open = (this.s.decisions || []).find(x => x.corpId === corpId && x.status === 'open');
  if (open) return { ok: false, msg: '上一件事还没表态完，一件一件来' };
  const dec = {
    id: ++this.s.decisionSeq, corpId, ownerPid: p.id, kind, type: spec.type, label: spec.label,
    openT: this.s.t, dueT: this.s.t + BAL.decisionHours * 60,
    ratio: kind === 'dividend' ? clamp(d.ratio == null ? 0.5 : d.ratio, 0, 1) : 0,
    voters: {}, status: 'open', turnout: 0, yes: 0, no: 0, reason: '',
  };
  this.s.decisions.push(dec);
  this._log('event', '⚑ 有人提了一件事：' + spec.label + '。股东们要在 ' +
    BAL.decisionHours + ' 游戏小时内表个态。', null);
  return { ok: true, msg: '提案已发出：' + spec.label + '（' + BAL.decisionHours + ' 游戏小时内表态）' };
};

/* 表态 */
Game.prototype._a_vote = function (p, d) {
  const dec = (this.s.decisions || []).find(x => x.id === d.id && x.status === 'open');
  if (!dec) return { ok: false, msg: '这件事已经结束了' };
  /* 只有这家公司的**控制人**（现阶段名册里唯一的股东）能表态。 */
  const owner = this.s.players.find(x => x.id === (dec.ownerPid || ''));
  if (!owner || owner.id !== p.id) return { ok: false, msg: '你不是这家公司的股东' };
  const cap = this.capTable(owner, dec.corpId);
  if (!cap.rows.some(r => r.pid === p.id)) return { ok: false, msg: '你不是这家公司的股东' };
  if (dec.voters[p.id]) return { ok: false, msg: '你已经表过态了' };
  dec.voters[p.id] = d.for === false ? 'against' : 'for';
  return { ok: true, msg: d.for === false ? '记下了：你不同意' : '记下了：你同意' };
};

/* 票决结算：到期才结 —— 四态必须分开（docs/19 §4.14）
     「没人理」（出席率不够）与「顶上」（多数反对）**不是同一件事**：
     前者是可以重提的沉默，后者是明确的否决，混在一起玩家就看不懂为什么被拒。 */
Game.prototype._decisionTick = function () {
  const s = this.s;
  const decs = s.decisions || [];
  if (!decs.length) return;
  for (const dec of decs) {
    if (dec.status !== 'open') continue;
    const owner = s.players.find(x => x.id === dec.ownerPid);
    const cap = this.capTable(owner, dec.corpId);
    const spec = DEC_KINDS[dec.kind] || { quorum: 0.5, pass: 0.5 };
    let yes = 0, no = 0, cast = 0;
    for (const row of cap.rows) {
      const v = dec.voters[row.pid];
      if (v === 'for') { yes += row.stake; cast += row.stake; }
      else if (v === 'against') { no += row.stake; cast += row.stake; }
    }
    dec.turnout = cast / cap.total; dec.yes = yes / cap.total; dec.no = no / cap.total;
    if (s.t < dec.dueT) continue;
    if (dec.turnout < spec.quorum) { dec.status = 'nobody'; dec.reason = '表态的人太少'; }
    else if (yes / Math.max(1e-9, cast) >= spec.pass) { dec.status = 'pass'; }
    else { dec.status = 'votedown'; dec.reason = '摇头的人更多'; }
    if (dec.status === 'pass' && dec.kind === 'dividend') this._payDividend(dec.corpId, dec.ratio, cap);
    if (dec.status === 'pass') this._log('event', '✔ 那件事过了：' + dec.label, null);
    else if (dec.status === 'votedown') this._log('event', '✘ 那件事没过：' + dec.label + '（' + dec.reason + '）', null);
    else this._log('event', '· 那件事没人理：' + dec.label, null);
  }
  if (decs.length > 20) s.decisions = decs.slice(-20);
};

/* 分钱（docs/19 §4.13 法定顺序）——
   ① 先弥补亏损：本作没有累计亏损表，用“净资产 ≤ 0 就不许分”作为等价闸门；
   ② 提 10% 法定公积金：不建独立科目，就地表现为“少分 10%”（留在公司里）；
   ③ 余额才按股比分。
   ⚠ 为什么必须走这个顺序：跳过它，“分红”就变成股东自己给自己发钱的旋钮。 */
Game.prototype._payDividend = function (corpId, ratio, cap) {
  const s = this.s;
  for (const row of cap.rows) {
    const holder = s.players.find(x => x.id === row.pid);
    if (!holder || !holder.alive) continue;
    if (holder.corp !== corpId) continue;   // 只有主控公司走 p.cash；参股公司按快照，暂不分配
    if (this.nav(holder) <= 0) return;      // 第①步：净资产为负，不许分
    const pool = Math.max(0, Math.floor(holder.cash * ratio));
    const reserve = Math.floor(pool * 0.10);      // 第②步：法定公积金（留在公司）
    const distributable = pool - reserve;
    if (distributable <= 0) return;
    const mineShare = Math.floor(distributable * (row.stake / cap.total));
    holder.cash -= distributable;
    holder.personal = (holder.personal || 0) + mineShare;
    this._log('trade', '公司分钱：拿出 ' + money(distributable) + ' G 按股比发下去，' +
      holder.name + '自己拿到 ' + money(mineShare) + ' G', holder.id);
  }
};

/* ---- 4.6b 公司名录与实时名次（docs/19 §4.6）------------------------- */
/* 全场公司一条一行的名录 + 名次。一次算完，UI 与守卫共用同一份 ——
   ⚠ 榜必须用**同一口径**算所有人：统一用 consolidated()。
     若“自己的身价按并表、NPC 的按单体”，名次就不可比了 —— 那是个假榜。 */
Game.prototype.standings = function () {
  const rows = [];
  for (const p of this.s.players) {
    if (!p.alive) continue;
    let nav = 0, debt = 0;
    try {
      const sheet = this.consolidated(p);
      nav = sheet.nav; debt = sheet.debt;
    } catch (e) { nav = 0; debt = 0; }
    const c = CORPS.find(x => x.id === p.corp) || {};
    rows.push({
      pid: p.id, name: p.name, corpId: p.corp, corpName: c.name || p.corp,
      nav: Math.round(nav), debt: Math.round(debt), isHuman: !!p.isHuman,
    });
  }
  rows.sort((a, b) => b.nav - a.nav);
  for (let i = 0; i < rows.length; i++) rows[i].rank = i + 1;
  return rows;
};

/* 让出 give 比例股份的**公允价**（docs/19 §4.6 pre-money / post-money）。
   为什么不是 val × give：那样等于按出让前的估值卖新产生的股份，
   出让方恒亏一截（IPO 初版就是这么写的，V3 那条守卫只是“涨了才算印钞”而没抓住“恒亏”）。
   正确式子：P = val × g / (1 − g) ⇒ 成交后双方身价都刚好不变（乘数为 1 时）。 */
Game.prototype.stakePrice = function (p, give) {
  const g = clamp(give, 0, 0.999);
  return Math.max(0, Math.floor(this.valuation(p) * g / (1 - g)));
};

/* ---- 4.14 股份转让：优先购买权（ROFR）· 4.11 B 持股门槛 ------------------
   ⚠ 先纠一个**我自己写错的假设**：我曾把“并购”记成架构阻断，说要先引入“公司实体 id”。
     错了。标的从来不是“哪家公司”，而是“**哪个持股人**”（一人一公司）。
     所以“收购老陈的公司”= 从老陈手里买到 >50%，而这靠 stakes[] 就能做 —— 不需要实体 id。
   ⚠ 现实里最容易被漏、张力最大的一条（docs/19 §4.14 B）：
     向**股东以外的人**转让股权，须先问其他股东要不要同价先买。
     没有这条，“谁出价高谁拿走”就成了唯一路径，谈判张力全丢。 */
Game.prototype.rofrHolder = function (owner, buyerPid, price) {
  const s = this.s;
  if (!owner) return null;
  const cap = this.capTable(owner, owner.corp);
  /* 买方本来就是股东 ⇒ 不是“外人”，不问。 */
  if (cap.rows.some(r => r.pid === buyerPid)) return null;
  const cand = cap.rows.filter(r => r.pid !== owner.id && r.pid !== buyerPid);
  if (!cand.length) return null;
  /* 按现实惯例：先问持股最多的那位（他最有动机守门）。
     “不同意的股东应当购买”——但要买得起；买不起就放行（本作简化，写在注释里） */
  const top = cand[0];
  const hp = s.players.find(x => x.id === top.pid);
  if (!hp || !hp.alive) return null;
  if (hp.cash < price) return null;
  return top;
};

/* §4.11 B 持股门槛表：把“多少股 = 什么权”集中成一处，UI 与守卫共读。
   ⚠ 现实里“收购不是点一下就成，是一串门槛”——每个节点都要能对玩家说清楚。 */
Game.prototype.rights = function (p, targetPid) {
  const tgt = targetPid == null ? p : this.s.players.find(x => x.id === targetPid);
  if (!tgt) return { stake: 0, list: [], next: null };
  const cap = this.capTable(tgt, tgt.corp);
  const row = cap.rows.find(r => r.pid === p.id);
  const stake = row ? row.stake : 0;
  const T = [
    [0.667, '特别决议（改章程 / 增资 / 卖公司）'],
    [0.5, '控股（普通决议你说了算）'],
    [0.3, '要约收购义务（要买得公开出价）'],
    [0.2, '可提名董事（能看这家公司的细节）'],
    [0.1, '可发起决议'],
    [0.05, '举牌（必须公告，藏不住了）'],
    [0.03, '可提交议题'],
  ];
  const list = T.filter(x => stake >= x[0]).map(x => x[1]);
  const above = T.filter(x => stake < x[0]);      // T 是降序 ⇒ 最后一个就是“最近的下一道”
  const next = above.length ? { at: above[above.length - 1][0], label: above[above.length - 1][1] } : null;
  return { stake, list, next };
};

/* 追保与破产（docs/13 §4.3）——「负债 ≠ 破产」的落点。
   判据只有两条，**欠了多少钱本身不算**：
     ① 资不抵债：净资产 / 总负债 < maintRatio（维持线 0.30）
     ② 付不出钱：现金 < 0
   任一成立 → 发【追保通知】，给 graceHours 小时窗口自救（补钱 / 卖货 / 质押 / 借钱 / 等着被收购）；
   逾期未补 → 破产清算。
   旧口径 `p.cash < 0 || p.arrears > arrearsLimit` 已废：它把“欠款多”直接当死因，
   与用户 2026-10-08 的定义（负债 ≠ 破产）直接冲突。 */
Game.prototype._bankruptcyTick = function () {
  const s = this.s;
  for (const p of s.players) {
    if (!p.alive) continue;
    const sheet = this.consolidated(p);
    const insolvent = sheet.debt > 0 && sheet.nav < sheet.debt * BAL.maintRatio;
    const illiquid = p.cash < 0;
    if (insolvent || illiquid) {
      p.m.pressure = 1;
      if (!p.negativeSince) p.negativeSince = s.t;          // 追保窗口起点
      const held = (s.t - p.negativeSince) / 60;
      if (held >= BAL.graceHours) {
        /* ⚠ 日志是玩家可见字符串（lint-copy 会查），所以这里只能用「现象」，
           不许出现“维持线/追保/资不抵债”这类术语。内部判据仍然叫 maintRatio。 */
        this._bankrupt(p, insolvent
          ? '手里的家底（' + money(sheet.nav) + ' G）已经抵不过欠账（' + money(sheet.debt) + ' G），债主上门也没能补上'
          : '现金转负，债主上门也没能补上');
      } else if (!p._warnedNeg) {
        p._warnedNeg = true;
        const left = (BAL.graceHours - held).toFixed(1);
        this._log('bad', '⚠ 有人上门催债：' + p.name + (insolvent
            ? '手里的家底（' + money(sheet.nav) + ' G）已经不够还欠的账（' + money(sheet.debt) + ' G）'
            : '手上的现金已经是负的') +
          '，还有 ' + left + ' 游戏小时（卖货、借钱、或者等人接手），过了这一线就得拿地、货、公司抵债', p.id);
      }
    /* ⚠ p.m.pressure 在这里**故意不清**（2026-10-08，holdings 验收测试 T4）：
       它是【历史标记】而不是【当前状态】。全项目唯一读取点是结算的 B 生存门槛
       `(anyoneDied || p.m.pressure)`（约 L2261），语义是"这一局你**经历过**现金流断裂"。
       UI 不读它，所以不会出现"钱还清了界面还挂着催债"。
       ⚠ 若将来要在界面上显示"当前正被催债"，**必须另加一个会复位的字段**，
         不要复用 pressure —— 否则一旦被催过债，B 门槛会永久对这人成立。 */
    } else { p.negativeSince = null; p._warnedNeg = false; p._warnedArrears = false; }
  }
};

/* NAV 采样 */
Game.prototype._navTick = function (dt) {
  const s = this.s;
  if (s.t - (s._lastNavT || -1) < 60) return;
  s._lastNavT = s.t;
  for (const p of s.players) {
    const nav = this.nav(p);
    p.m.navHist.push([Math.round(s.t), Math.round(nav)]);
    if (p.m.navHist.length > 200) p.m.navHist.shift();
    p.m.peakNav = Math.max(p.m.peakNav, nav);
    const mono = this.monoShare(p);
    p.m.monoPeak = Math.max(p.m.monoPeak || 0, mono);
  }
};

/* 终局倒计时（docs/05：垄断不立即结算） */
Game.prototype._countdownTick = function () {
  const s = this.s;
  if (!s.countdown) {
    for (const p of s.players) {
      if (!p.alive) continue;
      const crop = this.monoCrop(p);
      const share = this.monoShare(p, crop);
      const need = s.crops[crop].mono;
      // 破产边缘的人锁不住市场：欠一屁股债的控盘不算赢（否则会出现"首席是全场最穷的人"）
      if (this.debtRatio(p) > BAL.monoMaxDebtRatio) continue;
      if (share >= need) {
        s.countdown = { pid: p.id, until: s.t + BAL.monoCountdownH * 60, crop, need };
        s.stats.monopolist = p.id;
        this._log('bad', '⚑ ' + p.name + ' 控制 ' + s.crops[crop].name + ' ' +
          (share * 100).toFixed(1) + '% 流通量，触发终局倒计时（' + BAL.monoCountdownH +
          ' 游戏小时）。所有人还有机会打断他——只要他手里的货掉到门槛以下。', null);
        break;
      }
    }
  } else {
    const holder = s.players.find(p => p.id === s.countdown.pid);
    if (!holder || !holder.alive) { s.countdown = null; return; }
    const share = this.monoShare(holder, s.countdown.crop);
    if (share < s.countdown.need) {
      this._log('event', '⚑ ' + holder.name + ' 在' + s.crops[s.countdown.crop].name +
        '上的控制度跌回 ' + (share * 100).toFixed(1) + '%，垄断被打破，倒计时取消。', null);
      s.countdown = null; return;
    }
    if (s.t >= s.countdown.until) this._end(holder.name + ' 垄断 ' + s.crops[s.countdown.crop].name + ' 锁定首席');
  }
};

Game.prototype._end = function (reason) {
  this.s.over = true;
  this.s.overReason = reason;
  this.s.settlement = this.settle();
  this._log('system', '赛季结束：' + reason, null);
};

/* ---- 3.3 交易核心 -------------------------------------------------------*/
/* 冲击饱和：价格偏离锚越远，边际冲击越小（越涨越有人卖、越跌越有人接）。
   没有这一项，一个有钱玩家可以把价格无限推高，并把 NAV 与授信额度一起吹起来。 */
Game.prototype._impact = function (p, cid, qty, side) {
  const c = this.good(cid);
  const m = p.mods;
  let mult = side === 'buy' ? m.buyImpactMult : m.sellImpactMult;
  if (side === 'sell' && m.dumpBonus) mult *= m.dumpBonus;
  if (p.exportUntil > this.s.t && side === 'sell') mult *= 0.6;
  /* §17.1 收货商：他已经收满今天的量 → 再卖就要吃他的脸色。
     这是“他摊上的那块牌子”背后的机制，也是玩家能自己推出来的规则之一。
     ⚠ 只算作物：收货商 = 产地收购站/粮商，收的是**作物**；
        成品的下家是 §17.2「上门的买家」（街坊/作坊主/豪客），不走这一套。
     ⚠ **按玩家计**（不是全市场）：牌子必须能由玩家自己的行为解释。 */
  if (side === 'sell' && !this.isProduct(cid) && this.dealerSoldToday(p, cid) >= this.dealerQuota(cid)) {
    mult *= BAL.dealerFullMult;
  }
  let imp = c.eta * (qty / c.depth) * mult;
  const dev = c.price / c.anchor - 1;
  if (side === 'buy' && dev > 0) imp *= 1 / (1 + dev * 5);
  if (side === 'sell' && dev < 0) imp *= 1 / (1 + (-dev) * 5);
  return imp;
};

/**
 * 一笔成交。side: 'buy' | 'sell'
 * 返回 { ok, msg, price, gross, fee, impact }
 */
Game.prototype._trade = function (p, cid, qty, side, priceOverride, isLimit, bypassStock) {
  const s = this.s, c = this.good(cid);
  if (!p.alive) return { ok: false, msg: '你已经出局了' };
  qty = Math.floor(qty);
  if (!qty || qty <= 0) return { ok: false, msg: '数量不对' };

  /* 执行价 = 冲击在整个数量上的**积分均值**，而不是"成交前那一瞬间的价格"。
     这是本引擎最严重的漏洞的修法：原来整笔按成交前价格结算、冲击只改下一笔的报价，
     于是"买满 → 立刻卖出"会把价格推高再砸回来，市场状态逐位复原、现金却凭空变多 ——
     实测 200 轮往返净赚 123,231 G，全程没有推进任何游戏时间。
     改用均值后，同规模往返恰好零净额（只剩手续费）。
       买入：∫₀^Q P₀·e^(ηq/depth)dq / Q = P₀·(e^imp − 1)/imp
       卖出：P(q)=P₀·e^(−kq)，均值 = P₀·(1 − e^(−imp))/imp（注意是 1−factor，不是 1−1/factor）*/
  const mktPrice = c.price;
  const imp = this._impact(p, cid, qty, side);
  const factor = Math.exp(side === 'buy' ? imp : -imp);
  let price0 = Math.abs(imp) < 1e-9
    ? mktPrice
    : (side === 'buy' ? mktPrice * (factor - 1) / imp : mktPrice * (1 - factor) / imp);
  /* 限价单的成交价被自己的限价夹住（买单不比限价贵、卖单不比限价便宜）。
     限价单只在价格穿过挂价时成交，所以夹住之后不会优于市价，不产生套利。 */
  if (priceOverride) {
    price0 = side === 'buy' ? Math.min(priceOverride, price0) : Math.max(priceOverride, price0);
  }
  // 品牌溢价：成品卖出时按品牌值加成（最高 +30%），原料不享受
  if (this.isProduct(cid) && side === 'sell' && p.brand > 0) {
    price0 *= 1 + 0.30 * Math.pow(p.brand / 100, 1.5);
  }
  const feeMult = (c.policyMult || 1) * p.mods.feeMult *
    (CORPS.find(x => x.id === p.corp).feeMod || 1) *
    (p.taxfreeUntil > s.t ? 0 : 1);

  if (side === 'buy') {
    // 可买量受做市商库存限制（逼仓时就是把对手盘买空）
    const avail = Math.max(0, Math.floor(c.mmInv));
    if (!bypassStock && !isLimit && qty > avail) return { ok: false, msg: '市场只挂得出 ' + avail + ' 单位，剩下的人都在抢' };
  } else if (this.isProduct(cid) && c.mmInv >= c.mmInvMax) {
    // 加工品有真实的下游需求上限：吃不下就是吃不下（这是加工流不能无限放大的原因）
    return { ok: false, msg: '下游暂时吃不下这么多，等他们把库存消化掉（现有 ' + Math.floor(c.mmInv) + ' / 上限 ' + c.mmInvMax + '）' };
  } else {
    if (!bypassStock && (p.storage[cid] || 0) < qty) return { ok: false, msg: '库存不足（你有 ' + (p.storage[cid] || 0) + ' 单位）' };
  }

  const gross = qty * price0;
  const fee = gross * BAL.marketFee * feeMult;

  if (side === 'buy') {
    if (p.cash < gross + fee) return { ok: false, msg: '现金不足（需要 ' + money(gross + fee) + ' G）' };
    if (!bypassStock && this.storageUsed(p) + qty > this.storageMax(p)) return { ok: false, msg: '仓库放不下了' };
    p.cash -= (gross + fee);
    if (!bypassStock) {
      p.storage[cid] = (p.storage[cid] || 0) + qty;
      const prevQty = (p.avgCost[cid] && p.avgCost[cid].q) || 0;
      const prevAmt = prevQty * ((p.avgCost[cid] && p.avgCost[cid].c) || price0);
      p.avgCost[cid] = { q: prevQty + qty, c: (prevAmt + gross) / (prevQty + qty) };
    }
    c.mmInv -= qty;
  } else {
    const book = p.avgCost[cid] || { q: 0, c: price0 };
    const cost = (book.c || price0) * qty;
    p.cash += (gross - fee);
    if (!bypassStock) {
      const held = p.storage[cid] || 0;
      if (held < qty) {
        /* 上面已经校验过一次，走到这里说明有路径绕过了校验。
           不静默吞掉：clamp 到 0 防止状态被污染，同时把上下文打出来（回归测试里出现过一次
           「钱串儿 库存 radish = -27」，单独复现不出来，所以留一个自己会报案的哨兵）。 */
        p.m.stockLeak = (p.m.stockLeak || 0) + 1;
        this._log('system', '⚠ 内部校验漏了一次：' + p.name + ' 卖出 ' + qty + ' ' + c.name +
          ' 但库存只有 ' + held + '（已按实际库存结算）', p.id);
        qty = held;  // 按实际库存成交
        p.storage[cid] = 0;
        delete p.storage[cid];
      } else {
        p.storage[cid] = held - qty;
        if (p.storage[cid] <= 0) delete p.storage[cid];
      }
    }
    const realized = bypassStock ? 0 : (gross - fee - cost);
    p.realized += realized;
    p.m.realized += realized;
    c.mmInv += qty;
    /* §17.1 收货商：只记**你自己**的（理由见 player.dealerSold 的注释）。
       ⚠ 这里**故意不再累加 c.absorbedToday** —— 那是全市场口径，
          会被 NPC 卖掉，让牌子变成玩家看不见的原因。 */
    if (!this.isProduct(cid)) {
      const today = Math.floor(this.s.t / 1440);
      if (p.dealerSoldDay !== today) { p.dealerSold = {}; p.dealerSoldDay = today; }
      p.dealerSold[cid] = (p.dealerSold[cid] || 0) + qty;
    }
  }
  p.m.feePaid += fee;
  p.m.volume += gross;
  p.m.cropTraded[cid] = (p.m.cropTraded[cid] || 0) + 1;
  p.m.publicTrades += 1;
  s.stats.trades += 1;

  // 价格冲击（imp/factor 已在结算前算好）
  const priceBefore = c.price;
  c.price = Math.max(0.5, c.price * factor);
  c.anchor = Math.max(0.5, c.anchor * Math.pow(factor, c.anchorImpactShare || BAL.anchorImpactShare));
  const dP = c.price - priceBefore;

  p.m.volContrib += Math.abs(dP / priceBefore) * gross;
  if (side === 'sell') p.m.dumpImpactMax = Math.max(p.m.dumpImpactMax, -dP / priceBefore);
  if (side === 'buy' && !bypassStock) {
    const lvl = c.price / c.anchor - 1;
    if (lvl > 0.15) {
      p.m.bubbleArm = {
        crop: cid,
        level: Math.max(lvl, (p.m.bubbleArm && p.m.bubbleArm.crop === cid ? p.m.bubbleArm.level : 0)),
        qty: p.storage[cid] || 0,
        peak: c.price,
      };
    }
  }

  // 结算埋点：收割信用 / 命运共同体信用
  let lost = 0, gained = 0;
  for (const q of s.players) {
    if (q === p || !q.alive) continue;
    const inv = q.storage[cid] || 0;
    if (inv > 0) { if (dP < 0) lost += inv * (-dP); else gained += inv * dP; }
  }
  if (lost > 0) { p.m.harvestCredit += lost; }
  if (gained > 0) { p.m.blessCredit += gained; }
  p.m.creditsGiven += gained;
  p.m.creditsTaken += lost;

  this._addCp(p, gross * BAL.cpPerTradeVolume);
  // 成交必须回话：玩家最想知道"我到手多少"，以及"我这一单把价格推了多远"
  const msg = side === 'buy'
    ? '买入 ' + qty + ' ' + c.name + ' @' + round2(price0) + '，花了 ' + money(gross + fee) + ' G'
    : '卖出 ' + qty + ' ' + c.name + ' @' + round2(price0) + '，到手 ' + money(gross - fee) + ' G';
  return { ok: true, msg, price: price0, gross, fee, impact: imp, qty, side };
};

/* 报价：给 UI 用。不做状态变更，纯计算。
   返回该笔成交的预计均价、总额、手续费、价格冲击、以及"最多能做多少"。 */
Game.prototype.quote = function (p, cid, qty, side) {
  const c = this.good(cid);
  qty = Math.max(0, Math.floor(qty || 0));
  /* 投入品（牌价、无冲击）：照实回一个固定价的报价，
     避免 UI 或别处误用通用报价时算出 NaN（本项目 NAV 被 NaN 污染过一次）。 */
  if (this.isInput(cid)) {
    const corp = CORPS.find(x => x.id === p.corp);
    const unit = c.base * (c.kind === 'seed' ? (corp.seedDiscount || 1) : 1);
    const fm = (p.mods.feeMult || 1) * (corp.feeMod || 1);
    const fr = BAL.marketFee * fm;
    const fee = unit * qty * fr;
    const room = this.storageMax(p) - this.storageUsed(p);
    const maxQty = side === 'buy'
      ? Math.max(0, Math.floor(Math.min(p.cash / Math.max(0.01, unit * (1 + fr)), room)))
      : 0;
    return { qty, avgPrice: unit, gross: unit * qty, fee, total: unit * qty + fee,
             impactPct: 0, priceAfter: unit, maxQty, feeRate: fr, fixed: true };
  }
  const feeMult = (c.policyMult || 1) * p.mods.feeMult *
    (CORPS.find(x => x.id === p.corp).feeMod || 1) * (p.taxfreeUntil > this.s.t ? 0 : 1);
  const imp = this._impact(p, cid, qty, side);
  const factor = Math.exp(side === 'buy' ? imp : -imp);
  /* 必须和 _trade 用同一个公式，否则面板报的价和实际成交价系统性不一致
     （审核实测：面板 2,321.9 G vs 实际 2,170.0） */
  const avg = Math.abs(imp) < 1e-9
    ? c.price
    : (side === 'buy' ? c.price * (factor - 1) / imp : c.price * (1 - factor) / imp);
  const gross = qty * avg;
  const fee = gross * BAL.marketFee * feeMult;
  let maxQty = Infinity;
  if (side === 'buy') {
    const afford = p.cash / Math.max(0.01, avg * (1 + BAL.marketFee * feeMult));
    const room = this.storageMax(p) - this.storageUsed(p);
    maxQty = Math.max(0, Math.floor(Math.min(afford, room, Math.max(0, c.mmInv))));
  } else {
    maxQty = Math.max(0, Math.floor(p.storage[cid] || 0));
  }
  return {
    qty, avgPrice: avg, gross, fee, total: side === 'buy' ? gross + fee : gross - fee,
    impactPct: (factor - 1) * 100, priceAfter: c.price * factor, maxQty,
    feeRate: BAL.marketFee * feeMult,
  };
};

Game.prototype.buy = function (p, cid, qty) {
  if (this.isInput(cid)) return this._buyInput(p, cid, qty);
  return this._trade(p, cid, qty, 'buy');
};
/* 投入品**只能买、不能卖**（docs/19 §4.15）：买来是为了用，倒手炒农资不是本作玩法。 */
Game.prototype.sell = function (p, cid, qty) {
  if (this.isInput(cid)) return { ok: false, msg: '这一档东西买来就是为了用，不能倒手卖。' };
  return this._trade(p, cid, qty, 'sell');
};

/* ---- 投入品：固定牌价的买入通道（docs/19 §4.15）-------------------------
   为什么不复用 _trade：_trade 深依赖 mmInv / depth / anchorImpactShare 算价格冲击
   与可买量，而投入品**没有这些字段也不该有**（牌价不该被买上去）。
   与其在通用路径里到处加 if（每加一处都是一个 NaN 风险点），不如给它一条窄通道：
     ① 校验现金与仓位 ② 按牌价扣款 ③ 入库并更新均价。
   代价：投入品不进 m.cropTraded / 收货商 / 垄断统计 —— 本来也不该进。 */
Game.prototype._buyInput = function (p, id, qty) {
  const g = this.s.inputs && this.s.inputs[id];
  if (!g) return { ok: false, msg: '没有这种东西' };
  qty = Math.max(0, Math.floor(qty || 0));
  if (qty <= 0) return { ok: false, msg: '数量要大于 0' };
  /* 种子按公司折扣计价（docs/19 §4.15-D）：种植公司的 8 折从“播种时打折”
     挪到“买入时打折”——同一笔钱，但账要记在**买**这一步，不然播种的账是虚的。 */
  const corp = CORPS.find(x => x.id === p.corp);
  const unit = g.base * (g.kind === 'seed' ? (corp.seedDiscount || 1) : 1);
  const feeMult = (p.mods.feeMult || 1) * (corp.feeMod || 1);
  const fee = unit * qty * BAL.marketFee * feeMult;
  const total = unit * qty + fee;
  const room = this.storageMax(p) - this.storageUsed(p);
  if (qty > room) return { ok: false, msg: '仓里放不下了（还能放 ' + room + ' 单位）' };
  if (p.cash < total) return { ok: false, msg: '现金不够（要 ' + Math.round(total) + ' G）' };
  p.cash -= total;
  const prevQty = p.storage[id] || 0;
  const prevAmt = prevQty * ((p.avgCost[id] && p.avgCost[id].c) || unit);
  p.storage[id] = prevQty + qty;
  p.avgCost[id] = { q: prevQty + qty, c: (prevAmt + unit * qty) / (prevQty + qty) };
  p.m.feePaid += fee;
  p.m.volume += unit * qty;
  return { ok: true, msg: '买了 ' + qty + ' ' + g.name + '，花了 ' + money(total) + ' G', qty, gross: unit * qty, fee };
};

/* ---- 3.4 库存 / 估值 ---------------------------------------------------*/
/* 统一的"货"访问器：作物（crops）与加工品（products）共享交易/库存/估值代码。
   垄断判定仍然只算作物 —— 加工品不参与控盘，否则会出现"垄断辣酱"这种怪东西。 */
/* 统一的“货”访问器：作物 / 加工品 / 投入品 共享交易与库存代码。
   ⚠ this.s.inputs 在旧存档里不存在 → 必须带兜底，否则 good() 抛 TypeError。 */
Game.prototype.good = function (id) {
  return this.s.crops[id] || this.s.products[id] || (this.s.inputs && this.s.inputs[id]);
};
Game.prototype.isProduct = function (id) { return !!this.s.products[id]; };
/* 投入品：只能买、不能卖（docs/19 §4.15）。用于把“可卖”语义从“非加工品”收窄成“作物”。 */
Game.prototype.isInput = function (id) { return !!(this.s.inputs && this.s.inputs[id]); };
Game.prototype.isCrop = function (id) { return !!this.s.crops[id]; };
Game.prototype.storageMax = function (p) { return p.storageCap + p.mods.storageBonus; };
Game.prototype.storageUsed = function (p) {
  let n = 0; for (const k in p.storage) n += p.storage[k]; return n;
};
/* 估值价：统一用 TWAP，而不是现货。
   原因（P0）：现货可被自己买上去，若用现货估 NAV，就能"自己抬价→NAV 涨→授信涨→再抬价"。
   结算、净资产、垄断摊牌全部用 twap。 */
Game.prototype.valuePrice = function (id) {
  const g = this.good(id);
  return g ? g.twap : 0;
};
/* 垄断溢价：手里握着某作物 35% 以上流通量时，这批货是能定价的，
   估值给到最高 1.4 倍。没有这一项，"控制市场"在账面上反而等于自残——
   逼仓的人会破产，而他是全场唯一控盘的人（已修）。 */
Game.prototype.controlMult = function (p, cid) {
  if (!this.s.crops[cid]) return 1;        // 加工品不享受垄断溢价
  const share = this.monoShare(p, cid);
  if (share <= 0.35) return 1;
  return 1 + Math.min(0.40, (share - 0.35) * (0.40 / 0.25));
};
Game.prototype.inventoryValue = function (p) {
  let v = 0;
  for (const k in p.storage) v += p.storage[k] * this.valuePrice(k) * this.controlMult(p, k);
  return v;
};
/* 库存成本法估值（授信用，彻底切断自我参照） */
Game.prototype.inventoryCost = function (p) {
  let v = 0;
  for (const k in p.storage) {
    const book = p.avgCost[k];
    const unit = (book && book.c) ? Math.min(book.c, this.valuePrice(k)) : this.valuePrice(k);
    v += p.storage[k] * unit;
  }
  return v;
};
/* 授信额度：成本法资产 ×50%，且有绝对上限。不用 NAV（自我参照会被玩坏） */
Game.prototype.creditLimit = function (p) {
  const corp = CORPS.find(c => c.id === p.corp) || CORPS[0];
  const base = p.cash + p.deposit + this.inventoryCost(p) * 0.8 + this.fixedAssets(p) * 0.8;
  // 金融公司自己就是钱庄：额度上限也按倍数放大（否则 2.5 倍只是个摆设）
  const cap = BAL.maxLoanAbs * (corp.creditMult || 1);
  return Math.max(0, Math.min(base * 0.5 * (corp.creditMult || 1), cap) - p.debt);
};
Game.prototype.loanRateOf = function (p) {
  const corp = CORPS.find(c => c.id === p.corp) || CORPS[0];
  return BAL.loanRateDay * (corp.loanRateMult || 1);
};
/* 固定资产：地块 + 高产地溢价 + 自动化设施 + 仓储扩容。
   必须计入 NAV，否则花钱买自动化/仓储会直接把自己的身家打下去，
   玩家会被系统惩罚"建设"（这是个会计 bug，不是设计选择）。 */
Game.prototype.fixedAssets = function (p) {
  let v = p.plots.reduce((a, pl) => a + BAL.plotCost * (pl.upgraded ? 1.6 : 1), 0);
  const autos = p.plots.filter(pl => pl.auto).length;
  v += autos * BAL.autoPlotCost * 0.70;
  v += (p.workshops || 0) * BAL.workshopCost * 0.80;   // 建好的作坊是能卖钱的厂房
  const extraStorage = Math.max(0, p.storageCap - BAL.storageCap);
  v += (extraStorage / BAL.storageUpgradeStep) * BAL.storageUpgradeCost * 0.6;
  return v;
};
/* 应收贷款（放出去的账）按 ×0.9 计入资产。
   不计的话"放贷"在账面上等于立刻自残：放 2,000 → 净资产掉 2,000。 */
Game.prototype.receivables = function (p) {
  let v = 0;
  for (const ln of (p.loansOut || [])) v += ln.principal * 0.9;
  /* 股东欠公司的部分（§4.12）：这是**公司**的资产（公司对股东的债权）。
     它必须计入，否则“从公司拿钱”会在账面上凭空少掉一笔 ——
     个人钱包 +100、公司现金 −100、公司债权 +100，三者相抵才是“身价不变”。
     最初漏了这一条，是 finance.test 的 F2 当场报的（所以它是不可省的）。 */
  v += (p.shareholderLoan || 0);
  return v;
};
Game.prototype.nav = function (p) {
  let shortLiab = 0;
  for (const cid in p.shorts) {
    const pos = p.shorts[cid];
    if (pos && pos.qty > 0) shortLiab += pos.qty * this.valuePrice(cid);
  }
  return p.cash + p.deposit + this.receivables(p) + this.inventoryValue(p) * 0.95 +
    this.fixedAssets(p) * 0.8 - p.debt - shortLiab;
};
Game.prototype.debtRatio = function (p) {
  const assets = p.cash + p.deposit + this.inventoryValue(p) * 0.95 + this.fixedAssets(p) * 0.8;
  if (assets <= 0) return 1;
  return clamp((p.debt + this.shortLiability(p)) / assets, 0, 2);
};
Game.prototype.shortLiability = function (p) {
  let v = 0; for (const cid in p.shorts) if (p.shorts[cid]) v += p.shorts[cid].qty * this.s.crops[cid].price;
  return v;
};

/* 垄断：分子 = 自持库存（深仓天赋藏起来的那部分在局内不计入，摊牌时并入）；
   分母 = 其他持有者的库存 + 未来一段时间的到货量（NPC 日吸纳 × monoAbsorbWeight）。
   注意：做市商库存**不在分母里** —— 你把它买走，它就变成你的分子了。
   早先版本把 mmInv 算进分母，等于要求玩家买下"自己还没买的货"，
   垄断成本荒谬地高，也把门槛与货量混为一谈（已修）。 */
Game.prototype.monoDenom = function (p, cid) {
  const c = this.s.crops[cid];
  if (!c) return 0;
  let others = 0;
  for (const q of this.s.players) if (q.alive && q !== p) others += (q.storage[cid] || 0);
  return others + c.absorbDay * BAL.monoAbsorbWeight;
};
Game.prototype.monoShare = function (p, cid) {
  let best = 0;
  if (cid && !this.s.crops[cid]) return 0;
  const ids = cid ? [cid] : CROP_IDS;
  for (const id of ids) {
    const hidden = this.s.over ? 0 : (p.mods.hiddenStorage || 0);
    const hold = Math.max(0, (p.storage[id] || 0) - hidden);
    if (hold * this.valuePrice(id) < BAL.monoMinValue) continue;   // 太便宜的仓位不算控盘
    const denom = this.monoDenom(p, id);
    const share = denom > 0 ? hold / (hold + denom) : 1;
    if (share > best) best = share;
  }
  return best;
};
Game.prototype.monoNeed = function (p) {
  const crop = this.monoCrop(p);
  return crop ? this.s.crops[crop].mono : 0.6;
};
Game.prototype.monoCrop = function (p) {
  let best = 0, bc = CROP_IDS[0];
  for (const id of CROP_IDS) {
    const hold = p.storage[id] || 0;
    const d = this.monoDenom(p, id);
    const sh = hold / (hold + d);
    // 用「占门槛的比例」比较，消除不同作物门槛差异
    const ratio = sh / this.s.crops[id].mono;
    if (ratio > best) { best = ratio; bc = id; }
  }
  return bc;
};
Game.prototype.monoProx = function (p) {
  const lam = { radish: 0.8, chili: 1.0, ginseng: 1.3 };
  let best = 0, info = null;
  for (const id of CROP_IDS) {
    const d = this.monoDenom(p, id);
    const hold = p.storage[id] || 0;
    const ctrl = hold / (hold + d);
    const prox = (ctrl / this.s.crops[id].mono) * lam[id];
    if (prox > best) { best = prox; info = { crop: id, ctrl, prox }; }
  }
  return { prox: best, ...info };
};

/* ---- 3.5 动作分发 -----------------------------------------------------*/
Game.prototype.act = function (pid, name, payload) {
  const p = this.s.players.find(x => x.id === pid);
  if (!p) return { ok: false, msg: '没有这个玩家' };
  if (this.s.over) return { ok: false, msg: '赛季已经结束了' };
  const fn = this['_a_' + name];
  if (!fn) return { ok: false, msg: '无效操作：' + name };
  const r = fn.call(this, p, payload || {}) || { ok: true };
  this._syncRng();
  this._flush();
  return r;
};

Game.prototype._a_plant = function (p, d) {
  const cid = d.crop;
  if (!CROP_IDS.includes(cid)) return { ok: false, msg: '没有这种作物' };
  const c = this.s.crops[cid];
  const corp = CORPS.find(x => x.id === p.corp);
  /* 种子来源两支（docs/19 §4.15）——
     ① seedMustBuy 开（新局默认）：种子得先在市场买下，播种只扣**库存**，
        不再扣种子钱（钱在“买种子”那一步就付过了，再扣一次就是双重收费）。
     ② 关（旧存档的 rules 没这个键）：保持原样，播种时按种价扣现金（含公司折扣）。 */
  const mustBuy = !!this.s.rules.seedMustBuy;
  const sid = 'seed_' + cid;
  const cost = Math.round(c.seed * corp.seedDiscount * (this.s.rules.doubleLandRent ? 1.25 : 1));
  let idx = d.index;
  if (idx == null) idx = p.plots.findIndex(pl => !pl.crop);
  if (idx < 0 || idx >= p.plots.length) return { ok: false, msg: '没有空地了，先扩一块地' };
  const pl = p.plots[idx];
  if (pl.crop) return { ok: false, msg: '这块地还种着东西' };
  let bought = 0;
  if (mustBuy) {
    if ((p.storage[sid] || 0) < 1) {
      /* 手头没种子 → **顺手在市场上买一包**（牌价 + 手续费，种子按公司折扣）。
         为什么不做成“报错、让玩家自己先去买”：
         ① 这条主线原本是“点农田 → 种下萝卜”，只有 16 秒（见 04-ui-state.js 的注）；
            改成必须先去“总账 → 市场 → 种子档 → 买 → 回农田”，第一分钟当场被拆散，
            而 docs/06 §6 的新手引导脚本里**只要求“种下萝卜”**。
         ② docs/08 §2.4：前 5 分钟决定成败（漏斗杀手）。
         ⇒ 自动补一包，既保住那一分钟，也让种子确实**来自市场**、按市场价出钱。
         ⚠ 代价（已记入 docs/19 §4.18.2）：想“提前囤种省手续费”的人没有额外好处，
           “去市场买种子”这件事对玩家是**可见但不强制**的。 */
      const rb = this._buyInput(p, sid, 1);
      if (!rb.ok) return { ok: false, msg: '手头没这号种子了，先去「种子·农资」那档买一份。' };
      bought = 1;
    }
    /* 地租附加（doubleLandRent 那 25%）**仍然在播种时付**：它是地租，不是种子钱。
       把它留在这一侧，是为了让“地租规则”与“种子要不要买”两个开关互不干扰。 */
    const rent = Math.round(c.seed * corp.seedDiscount * (this.s.rules.doubleLandRent ? 0.25 : 0));
    if (p.cash < rent) return { ok: false, msg: '现金不够付这一季的地租（' + rent + ' G）' };
    p.storage[sid] -= 1;
    if (p.storage[sid] <= 0) delete p.storage[sid];
    p.cash -= rent;
  } else {
    if (p.cash < cost) return { ok: false, msg: '现金不够买种子（' + cost + ' G）' };
    p.cash -= cost;
  }
  const growMin = c.growH * 60 * p.mods.growMult;
  pl.crop = cid; pl.plantedT = this.s.t; pl.matureT = this.s.t + growMin; pl.ready = false;
  /* 如实告知种子从哪来 —— 不然“钱怎么少了”会变成猜谜。 */
  const seedNote = bought ? '（顺手在市场上买了一包种子）' : '';
  return { ok: true, msg: '种下了 ' + c.icon + c.name + seedNote + '，' + c.growH + ' 游戏小时后可以收割', idx };
};

Game.prototype._a_plantAll = function (p, d) {
  let n = 0, last = null;
  for (let i = 0; i < p.plots.length; i++) {
    if (p.plots[i].crop) continue;
    const r = this._a_plant(p, { crop: d.crop, index: i });
    if (!r.ok) { last = r; break; }
    n++;
  }
  return n ? { ok: true, msg: '一口气种了 ' + n + ' 块地' } : (last || { ok: false, msg: '没有空地' });
};

Game.prototype._harvest = function (p, idx, silent) {
  const pl = p.plots[idx];
  if (!pl || !pl.crop || !pl.ready) return { ok: false, msg: '还没熟' };
  const c = this.s.crops[pl.crop];
  const cid = pl.crop;
  let y = c.yld * p.mods.yieldMult * (pl.upgraded ? BAL.plotUpgradeMult : 1) * this.plotUseYield(pl);
  const dis = c.activeYieldMult || 1;
  /* ⚠ 2026-10-08 审计拓出的硬 bug（原来是错的，两个方向都错）：
     原式：y *= (1 + (1 - dis) * (1 - p.mods.disasterMult))
       · disasterMult 默认是 **1** → (1-1)=0 → 乘 1 → **天灾完全不影响收成**
       · 点【g3 抗灾】后变成 0.5 → 1 + 0.5×(1-dis) → 干旱 **+10%**、病虫害 **+25%**
         —— 全游戏唯一针对天灾的天赋，居然把天灾变成了利好
     为什么致命：事件卡上写着「一半的苗子烂在地里」，而玩家据此囤货、
     结果一颗苗都没少；点了抗灾的玩家更会看到“天灾期间产量反涨”，
     直接得出“这游戏的数字是假的”（正是 §17.0 要防的东西）。
     现式：disasterMult 语义 = **损失系数**（默认 1 = 全额减产，0.5 = 减半） */
  if (dis < 1) y *= 1 - (1 - dis) * p.mods.disasterMult;
  if (p.mods.doubleHarvest && this.rng.main.chance(p.mods.doubleHarvest)) y *= 2;
  y = Math.max(1, Math.round(y));
  /* room 必须夹到 ≥0。仓储已经超出上限时（例如刚拍下"稀有种子"、或者降级了仓储），
     room 会是负数，而 Math.min(y, room) 就变成负数 —— 收割会**倒扣**库存，
     实测能把库存扣成 -27（回归测试的不变量检查抓到的）。 */
  const room = Math.max(0, this.storageMax(p) - this.storageUsed(p));
  const stored = Math.min(y, room);
  const wasted = y - stored;
  p.storage[cid] = (p.storage[cid] || 0) + stored;
  const book = p.avgCost[cid] || { q: 0, c: 0 };
  p.avgCost[cid] = { q: book.q + stored, c: (book.q * book.c + 0) / Math.max(1, book.q + stored) };
  const val = stored * this.valuePrice(cid);
  p.m.harvestedValue += val;
  p.m.harvestedUnits += stored;
  this._addCp(p, val * BAL.cpPerHarvestGold);
  pl.crop = null; pl.plantedT = null; pl.matureT = null; pl.ready = false;
  if (!silent) this._log('good', p.name + ' 收成 ' + c.icon + c.name + ' × ' + stored + (wasted ? '（仓满浪费 ' + wasted + '）' : ''), p.id);
  return { ok: true, msg: '收成 ' + c.name + ' × ' + stored + (wasted ? '，仓库满了浪费 ' + wasted : ''), amount: stored };
};

Game.prototype._a_harvest = function (p, d) { return this._harvest(p, d.index, false); };
Game.prototype._a_harvestAll = function (p) {
  let n = 0;
  for (let i = 0; i < p.plots.length; i++) if (p.plots[i].ready) { this._harvest(p, i, true); n++; }
  return n ? { ok: true, msg: '收了 ' + n + ' 块地' } : { ok: false, msg: '没有成熟的地' };
};

Game.prototype._a_buy = function (p, d) {
  const r = this.buy(p, d.crop, d.qty);
  if (r.ok) this._log('trade', p.name + ' 买入 ' + d.qty + ' ' + this.good(d.crop).name + ' @' + round2(r.price) +
    '（手续费 ' + round2(r.fee) + '，价格被推高 ' + (r.impact * 100).toFixed(1) + '%）', p.id);
  return r;
};
/* ---------- §17.1 收货商：额度（按玩家计） ---------- */
/** 你自己一天能卖给他多少。萝卜（absorbDay 800）→ 80。
 *  ⚠ 夹到至少 dealerQuotaMin，避免高端作物（absorbDay 小）额度小到没法玩。 */
Game.prototype.dealerQuota = function (cid) {
  const c = this.good(cid);
  if (!c || !c.absorbDay || this.isProduct(cid)) return 0;
  return Math.max(BAL.dealerQuotaMin, Math.round(c.absorbDay * BAL.dealerQuotaMult));
};
/** 你今天已经卖给他多少（跨天自动归零，不看日历只算差值） */
Game.prototype.dealerSoldToday = function (p, cid) {
  if (!p) return 0;
  const today = Math.floor(this.s.t / 1440);
  if (p.dealerSoldDay !== today) return 0;
  return p.dealerSold[cid] || 0;
};

/* ---- §17.2 ② 上门的买家 ----------------------------------------------
   三类人：街坊（买得多、出价低）/ 作坊主（贵也得买）/ 豪客（出价高、量小、只来一次）。

   ⚠ 三个关键设计决定（写下来防止后人“优化”掉）：

   1. **报价是纯函数，不存隐藏状态**。他今天来不来、买什么、出多少，
      全由（世界种子 + 游戏日 + 你手里的货 + 见过的次数）算出来。
      这是 §17.0 判据 3 的要求：**不能有玩家看不到的原因**。

   2. **绝不动主 RNG 流**。用 FNV-1a 自己算一个确定值 ——
      若消耗 `this.rng.main.next()`，每帧渲染都会扰动全局随机序列，
      直接搞坏“同种子同结果”的仿真复现（工具链靠它跑 660 局）。 */
function buyerRoll(seed, day, type, pid) {
  let h = 2166136261;
  const str = seed + '|' + day + '|' + type + '|' + pid;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 100000) / 100000;
}

/** 算出某个买家此刻摆在门口的那张报价（纯函数，不修改任何状态）。
 *  返回 null = 他今天没来 / 已经买过 / 你手里没货 / 你今天请过他回去。 */
Game.prototype.buyerOffer = function (p, type) {
  const cfg = BAL.buyers[type];
  if (!cfg || !p || !p.buyers) return null;
  const b = p.buyers[type];
  if (cfg.once && b.used) return null;
  const today = Math.floor(this.s.t / 1440);
  if (b.refusedDay === today) return null;
  if (buyerRoll(this.s.seed, today, type, p.id) >= BAL.buyerComeChance) return null;

  /* 买什么：挑你手里最多的一种作物（“货压手里”→ 他就来）。
     街坊“**只认便宜货**”：行价高于基准（=贵了）的他不买，一件便宜的都没有就不来。
     ⚠ 这是三个人**性格上的真差别** —— 不是只有数字不同。
        （2026-10-08 试玩员实测：“三张卡文案几乎一字不差，看不出他们有任何别的差别”） */
  const pool = CROP_IDS.filter(cid => (p.storage[cid] || 0) > 0);
  const held = cfg.cheapOnly
    ? pool.filter(cid => this.good(cid).price <= this.good(cid).base)
    : pool;
  if (!held.length) return null;
  const cid = type === 'hood'
    ? held.slice().sort((a, b2) => this.good(a).price - this.good(b2).price)[0]
    : held.slice().sort((a, b2) => (p.storage[b2] || 0) - (p.storage[a] || 0))[0];

  const boughtToday = (b.day === today) ? b.boughtToday : 0;
  const cap = Math.floor(cfg.cap + cfg.growPerDay * today);   // “总需求每天略多一点”
  const qty = Math.min(p.storage[cid] || 0, cap);
  if (qty <= 0) return null;

  const c = this.good(cid);
  let px = c.price * cfg.px;
  const regular = b.met >= BAL.buyerRegularAt;
  if (regular) px *= BAL.buyerRegularBonus;
  /* “吃腻了”的力度按人不同：作坊主是**拿去用的**，少吃一点不影响他下逐客令 */
  px *= Math.max(0.55, 1 - BAL.buyerSat * (cfg.satMult == null ? 1 : cfg.satMult) * boughtToday);
  /* ⚠ 这里**故意不设“至少比砸盘好”的地板**。
     我一开始加了，随后发现它把三个人的差价全抹平：
     小单砸盘滑点极小 → 地板（砸盘均价 ×1.01）永远盖过街坊的 0.88×，
     于是「街坊出价低」这条脾气消失、`吃腻了` 也再也看不见（测试 B4 会当场抓出来）。
     §17.4 说的「还比市场价好」由**作坊主（1.02×）和豪客（1.25×）**兑现；
     街坊就是**低价**那一个 —— 他的价值不是单价，是**买走你的大单却不砸价**。
     三个人差价分明，玩家才能学到“看人下菜”；全抬到市价之上反而教不出东西。 */
  /* ⚠ 天花板：夹在价格带内 —— 防印钱机的第三道夹子 */
  px = clamp(px, c.base * 0.30, c.base * BAL.importValveMult);

  return {
    type: type, cid: cid, qty: qty,
    /* ⚠ 量化到 1 位小数：卡片上“他出的价 × 买多少”必须能**当场验算**。
       2026-10-08 试玩员实测：9.5×30=285 但卡上写 284，差 1 G 无解释。
       看不出来的差价会直接把玩家教成“这游戏数字不准”。 */
    price: Math.round(px * 10) / 10,
    met: b.met, regular: regular, boughtToday: boughtToday,
  };
};

/** 卖给他。
 *  ⚠ 货**离开这个世界**（不回做市商库存）→ 是一条需求沉淀，**不砸价**。
 *    这就是“上门出价比市场好”的全部道理：不是单价高，是**没有滑点**。 */
Game.prototype._a_sellTo = function (p, d) {
  const cfg = BAL.buyers[d.type];
  if (!cfg) return { ok: false, msg: '没有这个人' };
  const off = this.buyerOffer(p, d.type);
  if (!off) return { ok: false, msg: cfg.name + '现在没在门口' };
  const have = p.storage[off.cid] || 0;
  if (have < off.qty) return { ok: false, msg: '你手里只剩 ' + have + ' 单位 ' + this.good(off.cid).name };

  const c = this.good(off.cid);
  const gross = off.qty * off.price;
  p.storage[off.cid] = have - off.qty;
  if (p.storage[off.cid] <= 0) delete p.storage[off.cid];
  p.cash += gross;
  p.m.volume += gross;
  p.m.publicTrades += 1;
  this.s.stats.trades += 1;

  const b = p.buyers[d.type];
  const today = Math.floor(this.s.t / 1440);
  if (b.day !== today) { b.day = today; b.boughtToday = 0; }
  b.boughtToday += off.qty;
  b.met += 1;
  if (cfg.once) b.used = true;

  /* 归因句（格式取自 docs/13 §17.2，逐字落地）。
     ⚠ 只对玩家发 —— NPC 不参与上门买家，但保险起见仍然守一道。
     ⚠ 零术语（§17.2 明令）：不说 需求曲线/价格弹性/派生需求/边际消费倾向/饱和/需求侧。 */
  if (p.isHuman) {
    const next = this.buyerOffer(p, d.type);
    this._log('trade', cfg.name + '今天已经买了 ' + b.boughtToday + ' 单位' + c.name +
      ' —— 再卖他，' + (next ? '他只肯出 ' + round2(next.price) : '他今天不再收了'), p.id);
  }
  return { ok: true, msg: cfg.name + '把 ' + off.qty + ' 单位' + c.name + '带走了，到手 ' + money(gross) + ' G' };
};

/** 把今天上门的人请回去（免得他一直杵在门口） */
Game.prototype._a_declineBuyer = function (p, d) {
  const cfg = BAL.buyers[d.type];
  if (!cfg) return { ok: false, msg: '没有这个人' };
  p.buyers[d.type].refusedDay = Math.floor(this.s.t / 1440);
  return { ok: true, msg: cfg.name + '耸耸肩走了' };
};

Game.prototype._a_sell = function (p, d) {
  const g = this.good(d.crop);
  const r = this.sell(p, d.crop, d.qty);
  if (r.ok) {
    this._log('trade', p.name + ' 卖出 ' + d.qty + ' ' + this.good(d.crop).name + ' @' + round2(r.price) +
      '（价格被砸低 ' + (r.impact * 100).toFixed(1) + '%）', p.id);
    /* §17.1 收货商 · 归因句（docs/13 §17.1 给了格式，此处逐字落地）。
       目的：让玩家能自己把「我卖得多 → 他压价」这条因果连起来。
       ⚠ 只对玩家本人发 —— NPC 每 30 分钟就卖一笔，给他们也发会直接洗版。
       ⚠ 零术语（lint-copy 会查）：不说“做市商/库存偏离/保留价/逆向选择/流动性”。 */
    if (p.isHuman && g) {
      const left = Math.max(0, this.dealerQuota(d.crop) - this.dealerSoldToday(p, d.crop));
      /* ⚠ 文案必须短到**一行读得完**：折叠状态只给 29px（一行）。
         2026-10-08 试玩员实测：「括号后面到底写了什么，我到现在都不知道」
         —— 解释写了但读不到，等于没写。
         ⚠ 也**不说“明天再来”**：他并不拒绝成交，只是往死里压价。
           写着“明天再来”却能卖，会直接教出“规则在骗我”。 */
      this._log('trade', '你卖了 ' + d.qty + ' ' + g.name + '，老赵压到 ' + round2(g.price) +
        (left > 0 ? '（今天还能收 ' + left + '）' : '（他今天收够了）'), p.id);
    }
  }
  return r;
};

Game.prototype._a_limit = function (p, d) {
  /* 挂单只支持作物：加工品走到这里会读到不存在的字段并抛异常，
     而异常会打断 requestAnimationFrame 链 —— 整个游戏当场卡死（审核实测）。 */
  if (!CROP_IDS.includes(d.crop)) return { ok: false, msg: '这个品种不能挂单，直接买卖就行' };
  const c = this.s.crops[d.crop];
  const qty = Math.floor(d.qty), price = d.price;
  if (!qty || !price || price <= 0) return { ok: false, msg: '价格和数量都要填' };
  const o = { id: ++this.s.seq, crop: d.crop, side: d.side, qty, price, t: this.s.t, expireT: this.s.t + 24 * 60 };
  if (d.side === 'buy') {
    const cost = qty * price * (1 + BAL.marketFee);
    if (p.cash < cost) return { ok: false, msg: '挂买单需要先冻结 ' + money(cost) + ' G' };
    p.cash -= cost; o.locked = cost;
  } else if ((p.storage[d.crop] || 0) < qty) return { ok: false, msg: '库存不足' };
  p.limitOrders.push(o);
  return { ok: true, msg: '挂单成功：' + (d.side === 'buy' ? '买' : '卖') + ' ' + qty + ' ' + c.name + ' @' + price };
};
Game.prototype._a_cancelOrder = function (p, d) {
  const o = p.limitOrders.find(x => x.id === d.id);
  if (!o) return { ok: false, msg: '没有这个挂单' };
  if (o.side === 'buy' && o.locked) p.cash += o.locked;
  p.limitOrders = p.limitOrders.filter(x => x.id !== d.id);
  return { ok: true, msg: '挂单已撤，冻结资金退回' };
};

/* 地价（docs/19 §4.16）：使用 × 地段。
   锚点 = “粮田 · 城郊” = plotExpandCost[idx] 本身 ⇒
   默认地块的价钱与加这条机制之前**逐位一致**。
   ⚠ 单独立成一个函数，是因为 §4.16 要求市场面板与记账读**同一个价** ——
     两处各算一遍必然对不上（本项目在别处踩过“面板价 vs 成交价”不一致）。 */
Game.prototype.landPrice = function (p, d) {
  const n = (p && p.plots ? p.plots.length : BAL.startPlots) - BAL.startPlots;
  const idx = clamp(n, 0, BAL.plotExpandCost.length - 1);
  const use = (d && d.use) || 'grain';
  const district = (d && d.district) || 'suburb';
  const um = BAL.landUseMult[use] == null ? 1 : BAL.landUseMult[use];
  const dm = BAL.landDistrictMult[district] == null ? 1 : BAL.landDistrictMult[district];
  return Math.round(BAL.plotExpandCost[idx] * um * dm * (this.s.rules.doubleLandRent ? 1.3 : 1));
};
/* “使用”对单产的影响（docs/19 §4.16）。粮田 = 1.0 ⇒ 默认地块算出来与以前完全一样。
   旧存档的地块没有 use 字段 ⇒ 这是 undefined ⇒ 走默认 1.0（不会被改单产）。 */
Game.prototype.plotUseYield = function (pl) {
  if (!pl) return 1;
  const v = BAL.landUseYield[pl.use];
  return v == null ? 1 : v;
};

Game.prototype._a_expand = function (p, d) {
  if (p.plots.length >= BAL.maxPlots) return { ok: false, msg: '已经是上限 ' + BAL.maxPlots + ' 块地了' };
  const use = (d && d.use) || 'grain';
  const district = (d && d.district) || 'suburb';
  const cost = this.landPrice(p, { use, district });
  if (p.cash < cost) return { ok: false, msg: '这块地要 ' + money(cost) + ' G' };
  p.cash -= cost;
  p.plots.push({ crop: null, plantedT: null, matureT: null, auto: false, upgraded: false, use, district });
  const nm = (BAL.landUseName[use] || '地');
  /* 文案说“现象与价钱”，不说“使用/地段/溢价率”这类表格语言。 */
  this._log('money', p.name + ' 买下一块' + nm + '（第 ' + p.plots.length + ' 块，花了 ' + money(cost) + ' G）', p.id);
  return { ok: true, msg: '买下一块' + nm + '（第 ' + p.plots.length + ' 块），现在有 ' + p.plots.length + ' 块地' };
};

Game.prototype._a_upgradePlot = function (p, d) {
  const pl = p.plots[d.index];
  if (!pl) return { ok: false, msg: '没有这块地' };
  if (pl.upgraded) return { ok: false, msg: '已经是高产地了' };
  if (p.cash < BAL.plotUpgradeCost) return { ok: false, msg: '要 ' + money(BAL.plotUpgradeCost) + ' G' };
  p.cash -= BAL.plotUpgradeCost; pl.upgraded = true;
  return { ok: true, msg: '这块地单产提升到 ' + BAL.plotUpgradeMult + ' 倍' };
};
Game.prototype._a_buyAuto = function (p, d) {
  const pl = p.plots[d.index];
  if (!pl) return { ok: false, msg: '没有这块地' };
  if (pl.auto) return { ok: false, msg: '已经是自动地了' };
  if (p.cash < BAL.autoPlotCost) return { ok: false, msg: '要 ' + money(BAL.autoPlotCost) + ' G' };
  p.cash -= BAL.autoPlotCost; pl.auto = true;
  return { ok: true, msg: '这块地会自动收割并补种（放置化）' };
};
Game.prototype._a_upgradeStorage = function (p) {
  const cost = Math.round(BAL.storageUpgradeCost * (this.s.rules.doubleStoragePrice ? 1.5 : 1));
  if (p.cash < cost) return { ok: false, msg: '要 ' + money(cost) + ' G' };
  p.cash -= cost; p.storageCap += BAL.storageUpgradeStep;
  return { ok: true, msg: '仓储上限 +' + BAL.storageUpgradeStep + '，现在是 ' + this.storageMax(p) };
};

Game.prototype._a_loan = function (p, d) {
  const limit = this.creditLimit(p);
  const amt = Math.min(Math.floor(d.amount || 0), Math.floor(limit));
  if (amt <= 0) return { ok: false, msg: '额度用完了（授信 = 资产成本法 ×50%，且总额有上限）' };
  p.cash += amt; p.debt += amt;
  this._log('money', p.name + ' 借入 ' + money(amt) + ' G，日息 ' + (BAL.loanRateDay * 100).toFixed(1) + '%', p.id);
  return { ok: true, msg: '到账 ' + money(amt) + ' G（负债 ' + money(p.debt) + '，剩余额度 ' + money(this.creditLimit(p)) + '）' };
};
Game.prototype._a_repay = function (p, d) {
  const amt = Math.min(Math.floor(d.amount || 0), p.cash, p.debt);
  if (amt <= 0) return { ok: false, msg: '没有可还的' };
  p.cash -= amt; p.debt -= amt;
  return { ok: true, msg: '还了 ' + money(amt) + ' G' };
};

Game.prototype._a_intel = function (p, d) {
  const s = this.s;
  const tier = d.tier || 'insider';
  const corp = CORPS.find(x => x.id === p.corp);
  const r = this.s.rules;
  if (tier === 'free') {
    const q = this.s.eventQueue.find(x => x.fired && !x.ended) || this.s.eventQueue.find(x => !x.fired);
    if (!q) return { ok: false, msg: '市场上暂时没什么风声' };
    const ev = EVENT_POOL.find(e => e.id === q.id);
    const at = Math.floor(q.at / 60) + ' 时';
    const msg = q.fired
      ? '正在发生：' + ev.name + (q.crop ? '（' + this.s.crops[q.crop].name + '）' : '（全场）')
      : '风声：' + at + ' 前后可能有动静，方向偏' + (q.anchorMult > 1 ? '涨' : '跌') + '，具体看不清。' +
        (r.intelPublic ? '（本局消息灵通，信息更准）' : '');
    return { ok: true, msg, kind: 'free' };
  }
  const price = Math.round(BAL.intelInsiderPrice * corp.intelMod);
  // 情报不是无限刷的：同一条内幕只能买一次，且两次购买之间有等待
  if (s.t < (p.intelCdT || 0)) {
    const waitH = ((p.intelCdT - s.t) / 60).toFixed(1);
    return { ok: false, msg: '线人还在外面打听（' + waitH + ' 游戏小时后有新消息）' };
  }
  const bought = (p.m.intelEvents = p.m.intelEvents || []);
  const upcoming = this.s.eventQueue.find(x => !x.fired && !bought.includes(x.at));
  if (!upcoming) return { ok: false, msg: '线人说：最近没有新的风声了。这钱省下来吧。' };
  if (p.cash < price) return { ok: false, msg: '要 ' + price + ' G' };
  p.cash -= price;
  p.intelCdT = s.t + BAL.intelCooldownH * 60;
  bought.push(upcoming.at);
  const acc = BAL.intelInsiderAcc + (corp.intelAccBonus || 0);
  const ev = EVENT_POOL.find(e => e.id === upcoming.id);
  const correct = this.rng.main.chance(acc);
  const atH = Math.floor(upcoming.at / 60);
  const when = '第 ' + (Math.floor(atH / 24) + 1) + ' 天 ' + (atH % 24) + ' 时';
  let crop = upcoming.crop, dir = upcoming.anchorMult > 1 ? '涨' : '跌';
  if (!correct) { crop = this.rng.main.pick(CROP_IDS.filter(c => c !== upcoming.crop)); dir = dir === '涨' ? '跌' : '涨'; }
  const text = '内幕：' + when + ' 前后【' + ev.name + '】，' +
    (crop ? this.s.crops[crop].name : '全场') + ' 价格偏' + dir + '。';
  p.m.intelBought++;
  /* correct 只用于内部结算（最佳线报商 + 卖消息定价），UI 不许显示单条真假 ——
     否则 80% 准确率会被玩家变成 100%（审核发现的）。 */
  p.m.intelKnown.push({ qid: upcoming.at, correct, crop, dir, verdict: '待验证' });
  this._log('intel', p.name + ' 买到一条内幕情报', p.id);
  const comm = corp.intelCommission;
  return { ok: true, msg: text + (comm ? '（情报公司抽成 ' + (comm * 100) + '% 已计入你的营收）' : ''), kind: 'insider', correct };
};

Game.prototype._a_sellIntel = function (p, d) {
  const corp = CORPS.find(x => x.id === p.corp);
  if (!corp.intelCommission) return { ok: false, msg: '你的公司类型不靠卖消息赚钱' };
  const known = p.m.intelKnown.filter(k => !k.sold);
  if (!known.length) return { ok: false, msg: '你手上没有可卖的情报，先买一条' };
  const k = known[0];
  // 同一条消息可以卖给多个买家，但越往后越不值钱（消息会扩散）
  k.soldTo = k.soldTo || [];
  const buyers = this.s.players.filter(x => !x.isHuman && x.alive && !k.soldTo.includes(x.id));
  if (!buyers.length) { k.sold = true; return { ok: false, msg: '这条消息能卖的人都卖过了' }; }
  const buyer = buyers[0];
  const decay = Math.pow(0.6, k.soldTo.length);
  const base = 420 * (k.correct ? 1.4 : 0.7) * (0.6 + p.reputation / 100) * decay;
  const price = Math.round(base * (this.s.rules.intelPublic ? 1.2 : 1));
  k.soldTo.push(buyer.id);
  if (k.soldTo.length >= 3) k.sold = true;
  p.cash += price;
  p.m.intelSold++;
  if (k.correct) p.m.intelCorrect++;
  p.reputation = clamp(p.reputation + (k.correct ? 2 : -6), 0, 100);
  this._log('intel', p.name + ' 把情报卖给 ' + buyer.name + '，进账 ' + money(price) + ' G' +
    (k.correct ? '' : '（是条假消息，信誉受损）'), p.id);
  return { ok: true, msg: '卖掉一条情报，进账 ' + money(price) + ' G（信誉 ' + Math.round(p.reputation) + '）' };
};

Game.prototype._a_rumor = function (p, d) {
  const s = this.s;
  const cost = Math.round(BAL.rumorCost * p.mods.rumorCostMult);
  // 冷却：谣言是稀缺弹药，不能连点（也保护 UX 与新手不被自己的手速坑）
  if (s.t < (p.rumorCdT || 0)) {
    const wait = ((p.rumorCdT - s.t) / 60).toFixed(1);
    return { ok: false, msg: '放消息的渠道要缓一缓（' + wait + ' 游戏小时后）' };
  }
  if (p.cash < cost) return { ok: false, msg: '要 ' + cost + ' G' };
  p.cash -= cost;
  p.rumorCdT = s.t + BAL.rumorCooldownH * 60;
  const c = this.s.crops[d.crop];
  const dir = d.dir === 'up' ? 1 : -1;
  const shift = BAL.rumorShift * p.mods.rumorShiftMult * dir;
  const exposed = this.rng.main.chance(BAL.rumorExposeChance);
  c.rumorMult = 1 + shift * (exposed ? 0.5 : 1);
  c.rumorUntil = this.s.t + BAL.rumorDurH * 60;
  p.m.rumorCount++;
  p.m.aggression += 10;
  if (exposed) {
    p.m.rumorExposed++;
    p.reputation = clamp(p.reputation - 10, 0, 100);
    this._log('bad', p.name + ' 放出关于' + c.name + '的消息，被人当场拆穿（信誉 −10）', p.id);
    return { ok: true, msg: '消息放出去了，但被人拆穿——效果减半，信誉受损' };
  }
  this._log('intel', '市场上开始流传关于' + c.name + '的传闻，价格向' + (dir > 0 ? '上' : '下') + '偏了 ' + Math.abs(shift * 100).toFixed(0) + '%', null);
  return { ok: true, msg: '传闻生效：' + c.name + ' 价格锚 ' + (dir > 0 ? '+' : '−') + Math.abs(shift * 100).toFixed(0) + '%，持续 ' + BAL.rumorDurH + ' 游戏小时' };
};

Game.prototype._a_short = function (p, d) {
  const cid = d.crop, c = this.s.crops[cid];
  const qty = Math.floor(d.qty);
  if (!qty || qty <= 0) return { ok: false, msg: '数量不对' };
  if (!CROP_IDS.includes(cid)) return { ok: false, msg: '没有这种作物' };
  // 规则不允许裸卖空时，必须先借到货（借货池 = 对手盘库存）
  if (!this.s.rules.nakedShort && c.mmInv < qty)
    return { ok: false, msg: '借不到货。对手盘只剩 ' + Math.floor(Math.max(0, c.mmInv)) + ' 单位可借' };
  const notional = qty * c.price;
  const margin = notional * BAL.shortMargin * p.mods.shortMarginMult;
  if (p.cash < margin) return { ok: false, msg: '押金需要 ' + money(margin) + ' G（名义本金的 ' + Math.round(BAL.shortMargin * p.mods.shortMarginMult * 100) + '%）' };
  const r = this._trade(p, cid, qty, 'sell', c.price, true, true);
  if (!r.ok) return r;
  p.cash -= margin;                       // 卖出所得已在 _trade 内入账，押金另行冻结
  const pos = p.shorts[cid] || { qty: 0, entry: c.price, margin: 0, fee: 0 };
  pos.entry = (pos.entry * pos.qty + c.price * qty) / (pos.qty + qty);
  pos.qty += qty;
  pos.margin += margin;
  pos.fee = pos.fee || 0;
  p.shorts[cid] = pos;
  p.m.shortCount++;
  p.m.aggression += 15;
  this._log('trade', p.name + ' 借货卖出 ' + qty + ' ' + c.name + ' @' + round2(c.price) +
    '（押金 ' + money(margin) + ' G，价格被砸低 ' + (r.impact * 100).toFixed(1) + '%）', p.id);
  return { ok: true, msg: '建仓完成：' + qty + ' 单位 ' + c.name + '，押金 ' + money(margin) + ' G。价格反向涨 30% 会被动清盘。' };
};

Game.prototype._a_cover = function (p, d) {
  const cid = d.crop, pos = p.shorts[cid];
  if (!pos || pos.qty <= 0) return { ok: false, msg: '你没有这个方向的仓位' };
  const qty = Math.min(Math.floor(d.qty || pos.qty), pos.qty);
  const c = this.s.crops[cid];
  const fee = qty * c.price * BAL.marketFee * p.mods.feeMult;
  if (p.cash < qty * c.price + fee) return { ok: false, msg: '现金不足，买不回来' };
  const r = this._trade(p, cid, qty, 'buy', c.price, true, true);
  if (!r.ok) return r;
  const marginShare = pos.margin * (qty / pos.qty);
  const profit = qty * (pos.entry - c.price) - fee;
  p.cash += marginShare;                    // 释放押金
  p.realized += profit;
  p.m.realized += profit;
  pos.margin -= marginShare;
  pos.qty -= qty;
  if (pos.qty <= 0) delete p.shorts[cid];
  this._log(profit >= 0 ? 'good' : 'bad', p.name + ' 平掉 ' + qty + ' 单位 ' + c.name + ' 的看跌仓位，' +
    (profit >= 0 ? '赚了 ' : '亏了 ') + money(Math.abs(profit)) + ' G', p.id);
  return { ok: true, msg: '平仓完成，' + (profit >= 0 ? '赚' : '亏') + ' ' + money(Math.abs(profit)) + ' G' };
};

Game.prototype._forceCover = function (p, cid, why) {
  const pos = p.shorts[cid];
  if (!pos) return;
  const c = this.s.crops[cid];
  const qty = pos.qty;
  const cost = qty * c.price;
  p.cash += pos.margin;                     // 押金全部用于买回
  const cashAfterMargin = p.cash;           // 记下“加完押金”的现金，用来算买回到底花了多少
  delete p.shorts[cid];
  this._trade(p, cid, qty, 'buy', c.price, true, true);
  /* ⚠ 2026-10-08 审计拓到的金额 bug：原来这里打的是 p.cash，那是**清盘后的全部现金**
     （= 原现金 + 押金 − 买回成本），不是“剩余押金”。
     一个钱包 10,000 G、押金 1,000 G 的玩家会看到“剩余押金 9,850 G 退回”——
     直接印在吐司上的错误金额。现在打真实退回的押金。 */
  const back = Math.max(0, pos.margin - (cashAfterMargin - p.cash));
  if (p.cash < 0) {
    const short = -p.cash;
    p.debt += short; p.cash = 0;
    this._log('bad', '⚠ ' + p.name + ' 的 ' + c.name + ' 看跌仓位被动清盘，押金不够，缺口 ' + money(short) + ' G 转为负债', p.id);
  } else {
    this._log('bad', p.name + ' 的 ' + c.name + ' 看跌仓位被动清盘，' +
      '剩余押金 ' + money(back) + ' G 退回（' + why + '）', p.id);
  }
  p.m.aggression += 5;
  void cost;
};

Game.prototype._a_shell = function (p, d) {
  const corp = CORPS.find(x => x.id === p.corp);
  if (p.shell.owned === 0) {
    if (p.cash < BAL.shellCost) return { ok: false, msg: '注册一间皮包公司要 ' + BAL.shellCost + ' G' };
    p.cash -= BAL.shellCost;
    p.shell.owned = 1; p.shell.cover = 30; p.shell.on = 1;
    this._log('money', p.name + ' 注册了一间没有名字的公司', p.id);
    return { ok: true, msg: '皮包公司已注册。隐蔽度会随时间成长，越高越难被识破。' };
  }
  // 加厚隐蔽度
  const cost = Math.round(BAL.shellCoverPerUnit * 100 * 10 * (corp.shellGrowthMult || 1));
  if (p.cash < cost) return { ok: false, msg: '加厚隐蔽度要 ' + money(cost) + ' G' };
  p.cash -= cost;
  p.shell.cover = clamp(p.shell.cover + 10, 0, 100);
  return { ok: true, msg: '隐蔽度提升到 ' + Math.round(p.shell.cover) };
};
Game.prototype._a_shellToggle = function (p, d) {
  if (!p.shell.owned) return { ok: false, msg: '你还没有皮包公司' };
  p.shell.on = d.on ? 1 : 0;
  return { ok: true, msg: d.on ? '交易走皮包公司通道（隐蔽但慢）' : '交易走自己名下' };
};
Game.prototype._shellTick = function (dt) {
  const s = this.s;
  for (const p of s.players) {
    if (!p.alive || !p.shell.owned || !p.shell.on) continue;
    const corp = CORPS.find(x => x.id === p.corp);
    p.shell.cover = clamp(p.shell.cover + 0.05 * (corp.shellGrowthMult || 1) * (dt / 60), 0, 100);
    const expose = BAL.shellExposeBase * (1 - p.shell.cover / 100) * (dt / 60);
    if (this.rng.main.chance(expose)) {
      p.shell.on = 0; p.shell.cover = Math.max(0, p.shell.cover - 40);
      const frozen = Math.round(this.inventoryValue(p) * 0.3);
      p.cash -= frozen * 0.1;
      p.reputation = clamp(p.reputation - 5, 0, 100);
      /* ⚠ 文案必须与机制一致（2026-10-08 审计拓到）：代码只 `Math.max(0, cover - 40)`，
         不是清零——而隐蔽度是屏幕上一条显式进度条，玩家会照着“清零”去估被识破的概率。 */
      this._log('bad', '⚠ ' + p.name + ' 的皮包公司被识破了：通道关闭，罚金 ' + money(frozen * 0.1) + ' G，隐蔽度掉了 40', p.id);
    } else {
      p.m.shellTrades++;
    }
  }
};

Game.prototype._addCp = function (p, amount) {
  p.cp += amount * (p.isHuman ? 1 : BAL.npcCpMult);
  while (p.level - 1 < BAL.cpLevels.length && p.cp >= BAL.cpLevels[p.level - 1]) {
    p.level++;
    p.talentOffers = this._rollTalents(p);
    this._log('good', '★ ' + p.name + ' 升到 Lv' + p.level + '，可以选一个天赋', p.id);
  }
};

Game.prototype._rollTalents = function (p) {
  const owned = new Set(p.talents);
  const pool = TALENTS.filter(t => !owned.has(t.id));
  if (!pool.length) return null;
  const treePref = { grow: 'grow', trade: 'market', intel: 'market', shell: 'fight' }[p.corp];
  const r = this.rng.talent.shuffle(pool);
  const out = [];
  // 保证至少 1 张来自本公司主色谱系
  const pref = r.find(t => t.tree === treePref);
  if (pref) out.push(pref.id);
  for (const t of r) {
    if (out.length >= 3) break;
    if (!out.includes(t.id)) out.push(t.id);
  }
  return out;
};

Game.prototype._a_talent = function (p, d) {
  if (!p.talentOffers) return { ok: false, msg: '现在没有可选天赋' };
  if (!p.talentOffers.includes(d.id)) return { ok: false, msg: '这张卡不在你的选择里' };
  const t = TALENTS.find(x => x.id === d.id);
  p.talents.push(t.id);
  t.apply(p);
  p.talentOffers = null;
  this._log('good', '★ ' + p.name + ' 点亮天赋【' + t.name + '】：' + t.desc, p.id);
  return { ok: true, msg: '天赋【' + t.name + '】已生效' };
};
Game.prototype._a_reroll = function (p) {
  if (p.freeReroll <= 0) return { ok: false, msg: '本局的重抽已经用掉了' };
  if (!p.talentOffers) return { ok: false, msg: '现在没有可选天赋' };
  p.freeReroll--;
  p.talentOffers = this._rollTalents(p);
  return { ok: true, msg: '换了一批' };
};

/* 建作坊：制造公司的产能来源。每间作坊同时只能跑一批。 */
Game.prototype._a_buildWorkshop = function (p) {
  const cost = p.workshops === 0 ? BAL.workshopCost : BAL.workshopCost2;
  if (p.cash < cost) return { ok: false, msg: '建一间作坊要 ' + money(cost) + ' G' };
  p.cash -= cost;
  p.workshops += 1;
  this._log('money', p.name + ' 建了第 ' + p.workshops + ' 间作坊（' + money(cost) + ' G）', p.id);
  return { ok: true, msg: '作坊建好了，现在有 ' + p.workshops + ' 条产线' };
};

/* 加工：吃原料，若干游戏小时后出成品。这是制造公司的全部意义。 */
Game.prototype._a_craft = function (p, d) {
  const pd = this.s.products[d.product];
  if (!pd) return { ok: false, msg: '没有这个配方' };
  if (p.workshops <= 0) return { ok: false, msg: '你还没有作坊，先建一间（' + BAL.workshopCost + ' G）' };
  if (p.craftJobs.length >= p.workshops) return { ok: false, msg: '产线占满了（' + p.craftJobs.length + '/' + p.workshops + '），等这批出货' };
  const have = p.storage[pd.from] || 0;
  if (have < pd.need) return { ok: false, msg: '原料不够：需要 ' + pd.need + ' ' + this.s.crops[pd.from].name + '，你有 ' + have };
  const room = this.storageMax(p) - this.storageUsed(p) + pd.need;   // 吃掉原料后腾出的位置
  if (room < pd.out) return { ok: false, msg: '仓库放不下成品，先腾点空间' };
  const corp = CORPS.find(c => c.id === p.corp) || CORPS[0];
  const fee = 20;
  if (p.cash < fee) return { ok: false, msg: '加工费要 ' + fee + ' G' };
  p.cash -= fee;
  // 扣原料（用移动平均法结转成本，方便算加工毛利）
  const book = p.avgCost[pd.from] || { q: have, c: this.s.crops[pd.from].price };
  const unitCost = book.c || this.s.crops[pd.from].price;
  p.storage[pd.from] = have - pd.need;
  if (p.storage[pd.from] <= 0) delete p.storage[pd.from];
  const hours = pd.hours * (corp.craftSpeed || 1) * p.mods.growMult;
  p.craftJobs.push({
    pid: pd.id, startedT: this.s.t, doneT: this.s.t + hours * 60,
    out: pd.out, costBasis: unitCost * pd.need,
  });
  this._log('trade', p.name + ' 开了一批【' + pd.name + '】(' + pd.need + ' ' + this.s.crops[pd.from].name +
    ' → ' + pd.out + ' ' + pd.name + '，' + hours.toFixed(1) + ' 游戏小时后出货)', p.id);
  return { ok: true, msg: '开产：' + hours.toFixed(1) + ' 游戏小时后出 ' + pd.out + ' 个' + pd.name };
};

/* 加工进度：出货 + 品牌成长 */
Game.prototype._craftTick = function (dt) {
  const s = this.s;
  for (const p of s.players) {
    if (!p.alive || !p.craftJobs.length) continue;
    const rest = [];
    for (const job of p.craftJobs) {
      if (s.t < job.doneT) { rest.push(job); continue; }
      const pd = s.products[job.pid];
      let out = job.out;
      // 品牌成长：出货越多品牌越硬（有天赋则更快）
      const corp = CORPS.find(c => c.id === p.corp) || CORPS[0];
      /* 品牌要慢慢积累。原来每件 +2，9 批就顶到 100（+30% 溢价），"需要时间积累"这条设计就没了。
         改成每件 +0.6：一局认真做 40 批大约到 48 分。 */
      p.brand = clamp(p.brand + out * 0.6 * (corp.brandGrowthMult || 1), 0, 100);
      // 出货同样受仓储上限约束（原来直接加，能把仓库顶到超额）
      const room2 = Math.max(0, this.storageMax(p) - this.storageUsed(p));
      const put = Math.min(out, room2);
      if (put < out) this._log('info', p.name + ' 的仓库放不下，' + (out - put) + ' 个' + pd.name + '损耗掉了', p.id);
      out = put;
      if (out > 0) p.storage[pd.id] = (p.storage[pd.id] || 0) + out;
      const val = out * this.valuePrice(pd.id);
      p.m.craftedValue += val;
      p.m.craftedUnits += out;
      p.m.harvestedValue += 0;             // 加工不算种地收成（不要让 D 分虚高）
      this._addCp(p, val * BAL.cpPerHarvestGold);
      this._log('good', p.name + ' 的【' + pd.name + '】出货 ×' + out + '（品牌 ' + Math.round(p.brand) + '）', p.id);
    }
    p.craftJobs = rest;
  }
};

/* 放贷（金融公司专属）：钱放出去生息，但对手倒了就是坏账 */
Game.prototype._a_lend = function (p, d) {
  const corp = CORPS.find(c => c.id === p.corp) || CORPS[0];
  if (!corp.canLend) return { ok: false, msg: '只有金融公司能做这门生意' };
  const target = this.s.players.find(x => x.id === d.pid && !x.isHuman && x.alive);
  if (!target) return { ok: false, msg: '找不到这个借款人' };
  const amount = Math.floor(d.amount || 0);
  if (amount <= 0) return { ok: false, msg: '借多少？' };
  if (p.cash < amount) return { ok: false, msg: '你手上没这么多现金' };
  /* 本金必须真的交到对方手上。原来只从自己账上扣、钱凭空消失，
     到期却从对手现金里强制划走本息 = "无风险 4%/天 + 抽干对手流动性"。 */
  p.cash -= amount;
  target.cash += amount;
  target.debt += amount;
  p.loansOut.push({ toPid: target.id, principal: amount, rateDay: 0.04, dueT: this.s.t + 2 * 1440 });
  p.m.lentTotal += amount;
  this._log('money', p.name + ' 放了 ' + money(amount) + ' G 给 ' + target.name + '（日息 4%，两天后到期）', p.id);
  return { ok: true, msg: '放出去了，两天后收回本息（对手倒下就是坏账）' };
};

Game.prototype._a_deposit = function (p, d) {
  const amt = Math.min(Math.floor(d.amount || 0), Math.floor(p.cash));
  if (amt <= 0) return { ok: false, msg: '没有可存的钱' };
  p.cash -= amt; p.deposit += amt;
  return { ok: true, msg: '存了 ' + money(amt) + ' G' };
};
Game.prototype._a_withdraw = function (p, d) {
  const amt = Math.min(Math.floor(d.amount || 0), Math.floor(p.deposit));
  if (amt <= 0) return { ok: false, msg: '没有可取的存款' };
  p.deposit -= amt; p.cash += amt;
  return { ok: true, msg: '取了 ' + money(amt) + ' G' };
};

/* ---- 3.6 NPC AI --------------------------------------------------------*/
Game.prototype._npcTick = function (dt) {
  const s = this.s;
  // 每 30 游戏分钟决策一次，避免抖动
  if (s.t - (s._lastNpcT || -Infinity) < 30) return;
  s._lastNpcT = s.t;
  for (const p of s.players) {
    if (p.isHuman || !p.alive) continue;
    this._npcDecide(p);
  }
};

Game.prototype._npcDecide = function (p) {
  const s = this.s, w = p.w;

  // 1) 自动收割成熟作物
  for (let i = 0; i < p.plots.length; i++) if (p.plots[i].ready) this._harvest(p, i, true);

  /* 2) 补种：根据耐心选作物。耐心高→长周期；激进→短周期快速周转
     ⚠ 种子必须先在市场买（docs/19 §4.15）之后，NPC 也必须**先备料**，
        否则农民永远种不了地 —— 660 局仿真与「新手增收」会一起失真（这是本刀的硬前提）。
        就地买一份够这块地用即可，不囤（囤种子对 NPC 没意义，还会占仓）。 */
  const mustBuySeed = !!s.rules.seedMustBuy;
  for (const pl of p.plots) {
    if (pl.crop) continue;
    const cid = w.patience > 0.7 ? 'ginseng' : (w.aggro > 0.6 ? 'chili' : 'radish');
    const c = s.crops[cid];
    const cost = c.seed;
    if (p.cash > cost + p.debt * 0.05) {
      if (mustBuySeed && (p.storage['seed_' + cid] || 0) < 1) this._buyInput(p, 'seed_' + cid, 1);
      this._a_plant(p, { crop: cid });
    }
  }

  // 3) 卖出：估算自己的成本与当前价（作物与加工品一起处理）
  for (const cid of ALL_GOODS) {
    const held = p.storage[cid] || 0;
    if (held <= 0) continue;
    const c = this.good(cid);          // 加工品也要能卖
    if (!c) continue;
    const book = p.avgCost[cid] || { c: c.base };
    const est = this._npcFairValue(p, cid);
    const margin = (c.price - book.c) / Math.max(1, book.c);
    // 价格高于估值就卖；恐慌时（价格跌破估值 12%）也卖一半止损
    let qty = 0;
    if (c.price > est * (1 + 0.05 - 0.05 * w.patience)) qty = Math.round(held * (0.35 + 0.4 * w.risk));
    else if (c.price < est * 0.88) qty = Math.round(held * 0.3 * w.risk);
    if (p.cash < 500 && held > 5) qty = Math.max(qty, Math.round(held * 0.6));
    if (qty > 0) this._trade(p, cid, Math.min(qty, held), 'sell');
  }

  // 4) 买入：价格低于估值且现金充裕
  for (const cid of ALL_GOODS) {
    const c = this.good(cid);
    if (!c) continue;
    const est = this._npcFairValue(p, cid);
    if (c.price < est * (1 - 0.12 + 0.06 * w.risk) && p.cash > 2000 && c.mmInv > 5) {
      const budget = p.cash * (0.15 + 0.25 * w.aggro);
      const qty = Math.min(Math.floor(budget / c.price), Math.floor(c.mmInv * 0.5));
      if (qty > 0) this._trade(p, cid, qty, 'buy');
    }
  }

  // 5) 攻击行为：激进/报复型会砸盘、放消息、看跌
  const grudge = p.memory.grudge[s.humanId] || 0;
  const humanP = s.players.find(x => x.id === s.humanId);
  const avengerMult = (humanP && humanP.isAvenger && s.t < 1440) ? 1.3 : 1;   // 复仇者第 1 天被重点照顾
  const aggro = (w.aggro + grudge * 0.15 + (p.w.revenge * grudge * 0.1)) * avengerMult;
  if (aggro > 0.75 && this.rng.npc.chance(0.10)) {
    const cid = this.rng.npc.pick(CROP_IDS);
    const c = s.crops[cid];
    const held = p.storage[cid] || 0;
    if (held > 20) {
      const qty = Math.round(held * 0.6);
      const before = c.price;
      this._trade(p, cid, qty, 'sell');
      this._log('bad', p.name + ' 突然大举抛售 ' + c.name + ' × ' + qty + '，价格从 ' +
        round2(before) + ' 砸到 ' + round2(c.price), null);
      p.memory.grudge[s.humanId] = grudge; // 记录仇恨
    } else if (this.rng.npc.chance(0.35 * w.aggro)) {
      this._npcRumor(p, cid);
    }
  }
  // 6) 看跌（激进型 + 规则允许）
  if (w.risk > 0.7 && this.rng.npc.chance(0.06)) {
    const cid = this.rng.npc.pick(CROP_IDS);
    const c = s.crops[cid];
    if (this._npcFairValue(p, cid) < c.price * 0.95 && p.cash > 3000) {
      const qty = Math.min(Math.floor(p.cash * 0.2 / (c.price * BAL.shortMargin)), Math.floor(c.mmInv));
      if (qty > 0) this._a_short(p, { crop: cid, qty });
    }
  }
  // 6.5) 制造型 NPC 会加工
  if (p.workshops > 0 && p.craftJobs.length < p.workshops) {
    for (const pd of PRODUCTS) {
      if ((p.storage[pd.from] || 0) >= pd.need && p.cash > 200) {
        const r = this._a_craft(p, { product: pd.id });
        if (r.ok) break;
      }
    }
  }
  // 6.6) 制造型 NPC 会建作坊；金融型 NPC 会放贷
  if ((CORPS.find(c => c.id === p.corp) || {}).canLend && p.cash > 6000 && this.rng.npc.chance(0.25)) {
    const need = this.s.players.filter(x => !x.isHuman && x.alive && x.cash < 1200)[0];
    if (need) this._a_lend(p, { pid: need.id, amount: Math.floor(Math.min(p.cash * 0.4, 3000)) });
  }
  if (p.corp === 'make' && p.cash > 5000 && p.workshops < 3 && this.rng.npc.chance(0.3)) {
    this._a_buildWorkshop(p);
  }
  // 7) 扩张
  if (p.cash > 6000 && p.plots.length < 6) this._a_expand(p);
  if (p.cash > 4000 && this.storageUsed(p) > this.storageMax(p) * 0.9) this._a_upgradeStorage(p);
  if (p.cash > 5000) {
    const free = p.plots.findIndex(pl => !pl.auto);
    if (free >= 0 && this.rng.npc.chance(0.3)) this._a_buyAuto(p, { index: free });
  }
  // 8) 天赋自动选
  if (p.talentOffers && p.talentOffers.length) this._a_talent(p, { id: this.rng.npc.pick(p.talentOffers) });
};

Game.prototype._npcFairValue = function (p, cid) {
  const c = this.good(cid);
  // 估值 = 锚 + 私有噪声（信息敏感度越低，噪声越大）
  const noise = (this.rng.npc.next() - 0.5) * 2 * (1 - p.w.info) * 0.25;
  return c.anchor * (1 + noise);
};

Game.prototype._npcRumor = function (p, cid) {
  const c = this.s.crops[cid];
  c.rumorMult = 1 - 0.08;
  c.rumorUntil = this.s.t + 180;
  this._log('intel', '有人在传' + c.name + '要跌的消息，价格应声走低', null);
};

/* ---- 3.7 破产与收购 ---------------------------------------------------*/
Game.prototype._bankrupt = function (p, why) {
  const s = this.s;
  // 金蝉脱壳天赋
  const keepRatio = p.mods.escapeRope ? 0.20 : 0;
  const kept = {};
  let leftoverVal = 0;
  for (const cid in p.storage) {
    const n = p.storage[cid];
    const k = Math.floor(n * keepRatio);
    if (k > 0) kept[cid] = k;
    leftoverVal += (n - k) * this.valuePrice(cid);      // 加工品也要估值
  }
  // 强制变卖（折价 30%，并砸盘）
  for (const cid in p.storage) {
    const n = p.storage[cid] - (kept[cid] || 0);
    if (n > 0) {
      const c = this.good(cid);
      if (!c) continue;
      const factor = Math.exp(-c.eta * (n / c.depth));   // 用市场深度，不用对手盘库存
      c.price = Math.max(0.5, c.price * factor);
      c.mmInv = Math.min(c.mmInvMax || 1e9, c.mmInv + n);
      c.anchor *= Math.pow(factor, c.anchorImpactShare || BAL.anchorImpactShare);
    }
  }
  const recovered = leftoverVal * (1 - BAL.liquidationHaircut);
  p.cash += recovered;
  p.storage = kept;

  const debtBefore = p.debt;
  let debtLeft = Math.max(0, p.debt - p.cash);
  p.cash = Math.max(0, p.cash - p.debt);
  p.debt = 0;
  if (p.mods.escapeRope) debtLeft *= 0.7;

  // 土地进入拍卖（破产资产包）
  const plots = p.plots.filter(pl => pl.upgraded || true).length;
  this._queueBankruptLot(p, plots);

  /* 持仓层（docs/13 §7.4）：破产的是“某一家公司”，【全部持仓】都破产你才出局。
     现阶段每家玩家恒有 1 条持仓（开局只能选一家），所以行为与旧版逐位一致。
     ⚠ 收购层接上后，必须把上面的清算范围收到“破产的那一家”，而不是整个玩家。 */
  if (Array.isArray(p.holdings)) {
    for (const h of p.holdings) if (h.corpId === p.corp) h.bankrupt = true;
  }
  p.alive = false;
  p.bankruptT = s.t;
  p.bankruptCount++;
  p.m.bankruptLeftover = debtLeft;
  p.m.bankruptAt = s.t;
  p.m.bankruptProx = this.monoProx(p).prox;
  p.m.bankruptNav = this.nav(p);
  this._log('bad', '💀 ' + p.name + ' 出局了（' + why + '）。欠债 ' + money(debtLeft) + ' G，' +
    plots + ' 块地和存货被挂上拍卖台。', null);

  // 有人接手他留下的债务 → 记债权人
  const creditor = s.players.find(x => x.alive && !x.isHuman);
  if (creditor) creditor.m.acquisitions++;
};

Game.prototype._queueBankruptLot = function (victim, plotCount) {
  const s = this.s;
  s.auction = {
    phase: 'sealed',
    lot: { id: 'wreck-' + victim.id, name: victim.name + ' 的破产资产包', kind: 'wreck',
      desc: plotCount + ' 块地 + 剩余存货（' + (Object.keys(victim.storage).length ? '含现货' : '空仓') + '）',
      value: plotCount * BAL.plotCost * 1.1, payload: { from: victim.id, plots: plotCount } },
    startT: s.t,
    sealedEndT: s.t + this._realSecToGameMin(BAL.auctionWreckSealedSec),
    openEndT: null, startPrice: 0, finalists: [], entries: [], high: null,
    minIncrement: 0, softCount: 0, history: [],
  };
  s.auctionCount++;
};

/* ---- 3.8 拍卖状态机 ---------------------------------------------------*/
Game.prototype._auctionTick = function (dt) {
  const s = this.s, a = s.auction;
  const sched = [
    { day: 2, hour: 6, big: false },
    { day: 3, hour: 6, big: true },
  ];
  if (!a) {
    if (s._auctionDone == null) s._auctionDone = 0;
    for (let i = 0; i < sched.length; i++) {
      if (i < s._auctionDone) continue;
      const at = ((sched[i].day - 1) * 24 + sched[i].hour) * 60;
      if (s.t >= at) { this._openAuction(sched[i].big); s._auctionDone = i + 1; break; }
    }
    return;
  }
  const sealedLen = this._realSecToGameMin(BAL.auctionSealedSec);
  const openLen = this._realSecToGameMin(BAL.auctionOpenSec);
  const softStep = this._realSecToGameMin(BAL.auctionSoftCloseSec);
  if (a.phase === 'sealed') {
    // NPC 也会投暗标（否则玩家随手出个价就白拿，暗标阶段形同虚设）
    if (!a._npcSealedDone && s.t > (a.startT || 0) + 15) {
      a._npcSealedDone = true;
      for (const npc of s.players) {
        if (npc.isHuman || !npc.alive) continue;
        const v = a.lot.value * (0.55 + npc.w.aggro * 0.7);
        const budget = Math.min(npc.cash * 0.8, v);
        if (budget > a.lot.value * 0.45 && this.rng.auction.chance(0.55 + npc.w.aggro * 0.35)) {
          a.entries.push({ pid: npc.id, amount: Math.floor(budget), t: s.t });
        }
      }
    }
  }
  if (a.phase === 'sealed' && s.t >= a.sealedEndT) {
    // 结算入围
    const valid = a.entries.filter(e => e.amount > 0).sort((x, y) => y.amount - x.amount);
    const alive = s.players.filter(p => p.alive);
    const K = clamp(Math.ceil(alive.length * 0.5), 2, 4);
    a.finalists = valid.slice(0, K).map(e => e.pid);
    if (!a.finalists.length) { a.phase = 'done'; a.result = '流拍：没人出价'; this._log('info', '拍卖流拍——没人出价', null); return; }
    const kth = valid[Math.min(K, valid.length) - 1];
    const reserve = a.lot.value * 0.55;
    // 价格一律取整：带小数的"最低出价"会让玩家的出价永远差一点点而失败（已修）
    a.startPrice = Math.ceil(Math.max(reserve, kth ? kth.amount * 0.8 : reserve));
    a.minIncrement = Math.max(20, Math.ceil(a.startPrice * 0.05));
    a.phase = 'open'; a.openEndT = s.t + openLen;
    a.high = { pid: a.finalists[0], amount: a.startPrice };
    this._syncNextBid(a);   // 供 UI 直接显示"最低出价" 
    this._log('auction', '【' + a.lot.name + '】入围名单出炉，起拍价 ' + money(a.startPrice) + ' G。明标开始。', null);
  } else if (a.phase === 'open' && s.t >= a.openEndT) {
    a.phase = 'done';
    a.result = a.high ? (this._pidName(a.high.pid) + ' 以 ' + money(a.high.amount) + ' G 拿下') : '流拍';
    this._log('auction', '拍卖结束：' + a.result, null);
    if (a.high) this._awardLot(a.high.pid, a.high.amount);
    // 破产资产：土地转给赢家
    if (a.lot.kind === 'wreck' && a.high) {
      const w = s.players.find(x => x.id === a.high.pid);
      if (w) for (let i = 0; i < a.lot.payload.plots; i++) w.plots.push({ crop: null, plantedT: null, matureT: null, auto: false, upgraded: false });
      if (w) { w.m.acquisitions++; w.m.acquiredValue += a.high.amount; }
    }
    /* 拍卖结束后延迟清理。这里用 s 里的普通字段而不是 setTimeout 闭包 ——
       闭包进不了存档，读档后定时任务会丢（旧实现踩过：读档后拍卖永远不清理）。 */
    a.clearAt = s.t + 180;
  } else if (a.phase === 'open') {
    // NPC 在明标阶段出价
    if (s.t - (a._lastNpcBid || -Infinity) > 8 && a.finalists.length) {
      a._lastNpcBid = s.t;
      for (const pid of a.finalists) {
        const npc = s.players.find(x => x.id === pid);
        if (!npc || npc.isHuman || !npc.alive) continue;
        if (a.high && a.high.pid === pid) continue;
        const v = a.lot.value * (1 + npc.w.aggro * 0.4);
        const budget = Math.min(npc.cash, v);
        const next = (a.high ? a.high.amount : a.startPrice) + a.minIncrement;
        if (next <= budget && this.rng.auction.chance(0.5 + npc.w.aggro * 0.4)) {
          a.high = { pid, amount: next };
          a.minIncrement = Math.max(20, Math.ceil(next * 0.05));
          this._syncNextBid(a);
        }
      }
      // 软延时
      if (a.high && a.openEndT - s.t <= softStep && a.softCount < BAL.auctionSoftCloseMax) {
        a.openEndT += softStep; a.softCount++;
      }
    }
  }
};

/* 计划任务：全部用 s 里的字段表达，保证可存档（原来用闭包 + 实例字段，读档即丢） */
Game.prototype._timerTick = function () {
  const s = this.s, a = s.auction;
  if (a && a.phase === 'done' && a.clearAt && s.t >= a.clearAt) s.auction = null;
};

/* 真实秒 → 游戏分钟（拍卖窗口专用） */
Game.prototype._realSecToGameMin = function (sec) {
  return Math.max(0.5, sec * 60 / (this.s.secPerGameHour || 8));
};
/* 游戏分钟 → 真实秒（UI 显示倒计时用） */
Game.prototype.realSecLeft = function (gameMin) {
  return Math.max(0, gameMin * (this.s.secPerGameHour || 8) / 60);
};

Game.prototype._openAuction = function (big) {
  const s = this.s;
  const r = this.rng.auction;
  const count = big ? (s.rules.auctionBig ? 3 : 2) : 1;
  const lots = r.shuffle(LOT_POOL).slice(0, 1);
  const lot = lots[0];
  s.auction = {
    phase: 'sealed', lot: Object.assign({}, lot),
    startT: s.t,
    sealedEndT: s.t + this._realSecToGameMin(BAL.auctionSealedSec),
    openEndT: null, startPrice: 0, finalists: [], entries: [], high: null,
    minIncrement: 0, softCount: 0, history: [],
  };
  // 本场同期还有其它小标的（展示用）
  s.auction.extraLots = r.shuffle(LOT_POOL).slice(0, count - 1).map(l => l.name);
  s.auctionCount++;
  this._log('auction', '🔨 第 ' + s.auctionCount + ' 场拍卖会开始：' + lot.name + ' — ' + lot.desc +
    '（暗标窗口开放，估值约 ' + money(lot.value) + ' G）', null);
};

Game.prototype._a_bid = function (p, d) {
  const a = this.s.auction;
  if (!a) return { ok: false, msg: '现在没有拍卖会' };
  const amount = Math.floor(d.amount || 0);
  if (amount <= 0) return { ok: false, msg: '出个价吧' };
  const deposit = Math.round(amount * BAL.bidDepositRate * p.mods.snipeDeposit);
  if (a.phase === 'sealed') {
    if (p.cash < amount * 0.2) return { ok: false, msg: '资金实力不够，暗标至少要能覆盖 20% 出价' };
    a.entries = a.entries.filter(e => e.pid !== p.id);
    a.entries.push({ pid: p.id, amount, t: this.s.t });
    return { ok: true, msg: '暗标已投：' + money(amount) + ' G（别人看不到）' };
  }
  if (a.phase === 'open') {
    if (!a.finalists.includes(p.id)) return { ok: false, msg: '你没进明标名单（暗标没进前几名）' };
    const min = Math.ceil((a.high ? a.high.amount : a.startPrice) + a.minIncrement);
    if (amount < min) return { ok: false, msg: '至少要出 ' + money(min) + ' G' };
    if (p.cash < amount) return { ok: false, msg: '现金不够' };
    a.high = { pid: p.id, amount };
    a.minIncrement = Math.max(20, Math.ceil(amount * 0.05));
    this._syncNextBid(a);
    const softStep2 = this._realSecToGameMin(BAL.auctionSoftCloseSec);
    if (a.openEndT - this.s.t <= softStep2 && a.softCount < BAL.auctionSoftCloseMax) {
      a.openEndT += softStep2; a.softCount++;
    }
    this._log('auction', p.name + ' 出价 ' + money(amount) + ' G' + (a.softCount ? '（触发延时）' : ''), p.id);
    return { ok: true, msg: '你现在领先：' + money(amount) + ' G' };
  }
  return { ok: false, msg: '这轮已经结束了' };
};

/* 最低出价必须随每次价格变动重算。
   早先只在"入围结算"和"玩家出价"时算过一次，NPC 抬价后 nextBid 就变成陈旧值，
   UI 会照着它显示一个已经无效的价格（已修）。 */
Game.prototype._syncNextBid = function (a) {
  if (!a) return;
  const base = a.high ? a.high.amount : a.startPrice;
  a.nextBid = Math.ceil(base + (a.minIncrement || 0));
};
Game.prototype._awardLot = function (pid, amount) {
  const s = this.s, a = s.auction, p = s.players.find(x => x.id === pid);
  if (!p) return;
  if (p.cash < amount) { this._log('bad', p.name + ' 付不出钱，悔拍——押金没收', p.id); return; }
  p.cash -= amount * (1 + BAL.auctionFee);
  p.m.auctionSpend += amount;
  p.m.auctionWins++;
  const lot = a.lot;
  if (lot.kind === 'plot') p.plots.push({ crop: null, plantedT: null, matureT: null, auto: false, upgraded: true });
  else if (lot.kind === 'privilege') { p.taxfreeUntil = s.t + (lot.durH || 24) * 60; p.exportUntil = s.t + (lot.durH || 24) * 60; }
  else if (lot.kind === 'seeds') {
    const cid = this.rng.main.pick(CROP_IDS);
    // 必须受仓储上限约束，否则会把玩家顶到超容量（进而触发收割倒扣库存的 bug）
    const room = Math.max(0, this.storageMax(p) - this.storageUsed(p));
    const put = Math.min(40, room);
    if (put > 0) {
      p.storage[cid] = (p.storage[cid] || 0) + put;
      const bk = p.avgCost[cid] || { q: 0, c: s.crops[cid].base };
      p.avgCost[cid] = { q: bk.q + put, c: bk.c * bk.q / (bk.q + put) };
    }
    if (put < 40) this._log('info', p.name + ' 仓库存不下这么多，只收下了 ' + put + ' / 40 单位', p.id);
  } else if (lot.kind === 'intel') {
    const up = s.eventQueue.find(x => !x.fired);
    if (up) {
      const ev = EVENT_POOL.find(e => e.id === up.id);
      const atH = Math.floor(up.at / 60);
      this._log('intel', p.name + ' 拿到绝密情报：第 ' + (Math.floor(atH / 24) + 1) + ' 天 ' + (atH % 24) +
        ' 时【' + ev.name + '】，' + (up.crop ? s.crops[up.crop].name : '全场') + ' 偏' +
        (up.anchorMult > 1 ? '涨' : '跌'), p.id);
      p.m.intelKnown.push({ qid: up.at, correct: true, sold: true });
    }
  } else if (lot.kind === 'debt') {
    // 债务包：接手一笔对手的坏账
    const victim = s.players.filter(x => !x.alive || x.debt > 0).sort((x, y) => y.debt - x.debt)[0];
    if (victim && victim.debt > 0) {
      const pack = victim.debt * 0.8;
      p.cash += pack; p.debt += pack;
      p.m.aggression += 5;
      this._log('money', p.name + ' 买下债务包：+' + money(pack) + ' G 现金，同时背上等额债务', p.id);
    }
  }
  this._log('good', '🏆 ' + p.name + ' 拍得【' + lot.name + '】（' + money(amount) + ' G + 5% 拍卖行抽成）', p.id);
};

Game.prototype._pidName = function (pid) {
  const p = this.s.players.find(x => x.id === pid);
  return p ? p.name : pid;
};

/* ---- 3.9 日志 ---------------------------------------------------------*/
Game.prototype._log = function (kind, text, pid) {
  this.s.feed.push({ i: ++this.s.feedSeq, t: Math.round(this.s.t), kind, text, pid: pid || null });
  if (this.s.feed.length > 400) this.s.feed.shift();
};
/* ---- 3.9b 信匣（docs/20 §2.1 信匣｜邮箱 / docs/19 §4.6 治理入口）----------------
   信 = **指名寄给你**的东西（合作请求 / 收购通知 / 风声 / 决议通知），留未读角标；
   流水条（feed）= **外面的动静**（谁买卖了什么、价格动了），不留未读。
   ⚠ 这个分工是 docs/20 §2.1 定的：告急带与信匣角标把“必须回来处理”钉在视线里，
     流水条是背景音。混成一个会同时污染两边。
   ⚠ 旧存档没有 inbox / inboxSeq，全部当场兜底，不做迁移（迁移守卫会挂）。 */
Game.prototype._mail = function (pid, kind, from, subject, body, opts) {
  const o = opts || {};
  if (!Array.isArray(this.s.inbox)) this.s.inbox = [];
